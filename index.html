<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Mayo Bet - احترافية المراهنة</title>
    <style>
        body { background: #1e1e1e; color: #eee; font-family: 'Cairo', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* تصميم الطاولة والخيارات */
        .arena { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 50px; width: 80%; }
        .bet-box { 
            background: #2d3436; border: 3px solid #636e72; padding: 20px; border-radius: 15px; text-align: center;
            min-height: 150px; cursor: pointer; transition: 0.3s;
        }
        .bet-box:hover { background: #353b48; border-color: #00cec9; }

        /* الشخصية 3D (SVG) */
        .player-model { width: 60px; transition: 0.5s; position: absolute; }
        
        .ui-panel { background: #2f3542; padding: 20px; border-radius: 10px; width: 90%; margin-top: 20px; display: flex; justify-content: space-between; }
        .input-bet { width: 80px; padding: 5px; }
    </style>
</head>
<body>

    <div id="setup">
        <h1>Mayo Bet - اختر دورك</h1>
        <input id="pName" placeholder="اسمك">
        <button onclick="join('host')">دخول كمقدم</button>
        <button onclick="join('player')">دخول كمتسابق</button>
    </div>

    <div id="game" style="display:none; width: 100%;">
        <div class="ui-panel">
            <div>الرصيد: <span id="money">10000</span>$</div>
            <div id="status">انتظار المقدم...</div>
        </div>

        <h2 id="qText" style="text-align:center;">السؤال: ما هي عاصمة السعودية؟</h2>

        <div class="arena">
            <div class="bet-box" onclick="placeBet('الرياض')"><h3>الرياض</h3><input type="number" class="input-bet" id="bet1"></div>
            <div class="bet-box" onclick="placeBet('جدة')"><h3>جدة</h3><input type="number" class="input-bet" id="bet2"></div>
            <div class="bet-box" onclick="placeBet('مكة')"><h3>مكة</h3><input type="number" class="input-bet" id="bet3"></div>
        </div>
    </div>

    <!-- الشخصية -->
    <svg id="myAvatar" class="player-model" viewBox="0 0 100 100">
        <circle cx="50" cy="20" r="15" fill="#f39c12"/> <!-- الرأس -->
        <rect x="40" y="35" width="20" height="40" fill="#3498db"/> <!-- الجسم -->
        <rect x="25" y="40" width="10" height="30" fill="#3498db"/> <!-- اليد اليسرى -->
        <rect x="65" y="40" width="10" height="30" fill="#3498db"/> <!-- اليد اليمنى -->
        <rect x="42" y="75" width="6" height="20" fill="#2c3e50"/> <!-- الرجل -->
        <rect x="52" y="75" width="6" height="20" fill="#2c3e50"/> <!-- الرجل -->
    </svg>

    <script>
        let isHost = false;
        let money = 10000;
        let myAvatar = document.getElementById('myAvatar');
        let posX = 100, posY = 400;

        function join(role) {
            isHost = (role === 'host');
            document.getElementById('setup').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            if(isHost) {
                myAvatar.style.fill = "gold"; // المقدم لونه ذهبي
            }
        }

        // الحركة
        document.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowRight') posX += 20;
            if(e.key === 'ArrowLeft') posX -= 20;
            myAvatar.style.left = posX + 'px';
            myAvatar.style.top = posY + 'px';
        });

        function placeBet(option) {
            let betVal = document.getElementById(option === 'الرياض' ? 'bet1' : option === 'جدة' ? 'bet2' : 'bet3').value;
            if(betVal > money) { alert("رصيدك لا يكفي!"); return; }
            money -= betVal;
            document.getElementById('money').innerText = money;
            alert("تم الرهان بـ " + betVal + " على " + option);
        }
    </script>
</body>
</html>
