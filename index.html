<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mayo Ascension Towers - Full Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; user-select: none; }
        body, html { width: 100%; height: 100%; margin: 0; background: #000 url('./background2.png') no-repeat center/cover; font-family: 'Orbitron', sans-serif; overflow: hidden; }
        
        /* الشاشات */
        .screen { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; background: rgba(0,0,0,0.8); }
        .hidden { display: none !important; }
        
        /* الأزرار والمدخلات */
        .btn-ui { background: #00f0ff; border: none; padding: 20px 40px; font-size: 1.5rem; border-radius: 12px; cursor: pointer; color: #000; font-weight: bold; margin: 10px; }
        .input-box { padding: 15px; font-size: 1.2rem; border-radius: 8px; border: none; margin-bottom: 20px; width: 280px; text-align: center; }
        
        /* منطقة اللعب */
        #game-area { width: 100vw; height: 100vh; position: relative; z-index: 5; }
        .controls { position: absolute; bottom: 40px; display: flex; gap: 30px; z-index: 50; width: 100%; justify-content: center; }
        .btn-ctrl { width: 70px; height: 70px; border-radius: 50%; border: 3px solid #fff; background: rgba(0,0,0,0.5); color: #fff; font-size: 2rem; cursor: pointer; }
    </style>
</head>
<body>

    <div id="start-screen" class="screen">
        <input type="text" id="p-name" class="input-box" placeholder="اسم اللاعب">
        <button class="btn-ui" onclick="goToLobby()">دخول اللوبي</button>
    </div>

    <div id="lobby-screen" class="screen hidden">
        <h1 style="color:#fff;">اللوبي</h1>
        <button class="btn-ui" onclick="alert('التعليمات: القطع تسقط تلقائياً! استخدم الأسهم للتحريك والتدوير. لا تدع القطع تطيح!')">التعليمات 📖</button>
        <button class="btn-ui" style="background:#00ff88;" onclick="startMatch()">بدء اللعب</button>
    </div>

    <div id="game-screen" class="screen hidden" style="background:transparent;">
        <div id="game-area"></div>
        <div class="controls">
            <button class="btn-ctrl" onclick="move(-1)">⬅️</button>
            <button class="btn-ctrl" onclick="rotate()">🔄</button>
            <button class="btn-ctrl" onclick="move(1)">➡️</button>
        </div>
    </div>

    <script>
        const { Engine, Render, Runner, Bodies, Composite, Body } = Matter;
        let engine, render, activeBlock, myTowerX;

        // تنظيف البيانات
        window.onload = () => document.getElementById('p-name').value = '';

        function goToLobby() {
            if(!document.getElementById('p-name').value) return alert("أدخل الاسم");
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('hidden');
        }

        function startMatch() {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            initEngine();
        }

        function initEngine() {
            engine = Engine.create();
            render = Render.create({
                element: document.getElementById('game-area'),
                engine: engine,
                options: { width: window.innerWidth, height: window.innerHeight, wireframes: false, background: 'transparent' }
            });

            // إنشاء قاعدتين (لي ولك)
            myTowerX = window.innerWidth * 0.3;
            const ground = Bodies.rectangle(window.innerWidth/2, window.innerHeight-20, window.innerWidth, 40, { isStatic: true });
            Composite.add(engine.world, [ground]);

            Render.run(render);
            Runner.run(Runner.create(), engine);
            spawn();
        }

        function spawn() {
            // أشكال Tetrominoes احترافية (كمجسمات فيزيائية)
            const type = Math.floor(Math.random() * 3);
            if(type === 0) activeBlock = Bodies.rectangle(myTowerX, 50, 40, 40); // مربع
            else if(type === 1) activeBlock = Bodies.rectangle(myTowerX, 50, 80, 20); // مستطيل
            else activeBlock = Body.create({ parts: [Bodies.rectangle(myTowerX, 50, 40, 40), Bodies.rectangle(myTowerX, 90, 40, 40)] }); // L
            
            Composite.add(engine.world, activeBlock);
        }

        function move(d) { if(activeBlock) Body.setPosition(activeBlock, {x: activeBlock.position.x + (d*40), y: activeBlock.position.y}); }
        function rotate() { if(activeBlock) Body.setAngle(activeBlock, activeBlock.angle + Math.PI/4); }

        // نظام الخسارة: إذا طاحت القطعة خارج الشاشة
        Matter.Events.on(engine, 'afterUpdate', () => {
            if(activeBlock && activeBlock.position.y > window.innerHeight) {
                alert("طاحت القطعة! خسرت!");
                location.reload();
            }
        });
    </script>
</body>
</html>
