<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الدب كامل الجسم 🧸</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f4f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* فقاعة المحادثة */
        .speech-bubble {
            background: white;
            border: 4px solid #2b1d12;
            border-radius: 25px;
            padding: 15px 30px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            max-width: 450px;
            margin-bottom: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
            direction: rtl;
            z-index: 10;
        }

        .speech-bubble.angry {
            background: #ffe6e6;
            border-color: #dc143c;
            color: #dc143c;
            transform: scale(1.05);
            animation: shake 0.3s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* حاوية اللعبة */
        .game-container {
            position: relative;
            width: 420px;
            height: 520px;
            cursor: pointer;
        }

        .teddy {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* 1. الأذنين */
        .ear {
            position: absolute;
            width: 85px;
            height: 85px;
            background: #a05a2c;
            border-radius: 50%;
            top: 25px;
        }
        .ear.left { left: 55px; }
        .ear.right { right: 55px; }
        .ear::after {
            content: '';
            position: absolute;
            width: 45px;
            height: 45px;
            background: #cca07a;
            border-radius: 50%;
            top: 20px;
            left: 20px;
        }

        /* 2. الجسم الكامل والدائري */
        .body-fur {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 260px;
            height: 240px;
            background: #a05a2c;
            border-radius: 50%;
            box-shadow: inset 0 -15px 30px rgba(0,0,0,0.15);
            z-index: 1;
        }

        /* الفرو الفاتح في بطن الدب */
        .belly-patch {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 150px;
            background: #eadecc;
            border-radius: 50%;
        }

        /* 3. الرجلين الكاملة أسفل الجسم */
        .leg {
            position: absolute;
            bottom: 30px;
            width: 90px;
            height: 70px;
            background: #a05a2c;
            border-radius: 40% 40% 50% 50%;
            z-index: 2;
            box-shadow: 0 5px 10px rgba(0,0,0,0.15);
        }
        .leg.left { left: 75px; }
        .leg.right { right: 75px; }
        /* باطن القدم الفاتح */
        .leg::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 65px;
            height: 45px;
            background: #cca07a;
            border-radius: 50%;
        }

        /* 4. رأس الدب */
        .head {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 290px;
            height: 250px;
            background: #a05a2c;
            border-radius: 50%;
            z-index: 3;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        /* الشماغ/العصابة الزرقاء */
        .keffiyeh-hat {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 296px;
            height: 90px;
            background: repeating-linear-gradient(45deg, #10629a, #10629a 8px, #052c4c 8px, #052c4c 16px);
            border-radius: 150px 150px 20px 20px;
            z-index: 5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
        }

        /* العيون اللامعة */
        .eye {
            position: absolute;
            top: 110px;
            width: 20px;
            height: 20px;
            background: #050505;
            border-radius: 50%;
            z-index: 6;
            transition: all 0.15s ease;
        }
        .eye.left { left: 75px; }
        .eye.right { right: 75px; }
        .eye::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            top: 3px;
            left: 4px;
        }

        /* حواجب الغضب المخفية */
        .eyebrow {
            position: absolute;
            top: 90px;
            width: 35px;
            height: 7px;
            background: #2b1d12;
            z-index: 7;
            opacity: 0;
            transition: all 0.15s ease;
        }
        .eyebrow.left { left: 65px; }
        .eyebrow.right { right: 65px; }

        /* منطقة الفم والأنف الكريمية */
        .muzzle {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 115px;
            background: #eadecc;
            border-radius: 50%;
            z-index: 6;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nose {
            width: 70px;
            height: 45px;
            background: #54311c;
            border-radius: 50% 50% 45% 45%;
            margin-top: 15px;
            position: relative;
        }
        .nose::after {
            content: '';
            position: absolute;
            width: 3px;
            height: 22px;
            background: #2b1d12;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* الفم الضاحك واللسان */
        .mouth-container {
            width: 90px;
            height: 40px;
            position: relative;
            margin-top: 6px;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .mouth-happy {
            position: absolute;
            top: -25px;
            width: 90px;
            height: 60px;
            background: #802020;
            border: 4px solid #2b1d12;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .tongue {
            width: 45px;
            height: 18px;
            background: #ff7373;
            border-radius: 20px 20px 0 0;
            margin-bottom: -1px;
        }

        /* اليد الترحيبية */
        .hand-wave {
            position: absolute;
            right: 40px;
            top: 240px;
            width: 70px;
            height: 70px;
            background: #a05a2c;
            border-radius: 50%;
            z-index: 4;
            transform-origin: bottom center;
            animation: waveAction 1.2s infinite ease-in-out;
            box-shadow: -2px 4px 10px rgba(0,0,0,0.1);
        }

        @keyframes waveAction {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(25deg); }
        }

        /* 🔫 المسدس التكتيكي المخفي */
        .gun-hand {
            position: absolute;
            left: 30px;
            top: 260px;
            width: 75px;
            height: 75px;
            background: #a05a2c;
            border-radius: 50%;
            z-index: 8;
            opacity: 0;
            transform: scale(0) rotate(45deg);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .pistol {
            position: absolute;
            top: -15px;
            left: -30px;
            width: 85px;
            height: 28px;
            background: #3a3d40;
            border-radius: 4px;
            transform: rotate(-10deg);
        }
        .pistol::after {
            content: '';
            position: absolute;
            right: 8px;
            top: 23px;
            width: 25px;
            height: 45px;
            background: #1e2022;
            border-radius: 4px;
        }

        /* 😡 حالة الغضب العارم */
        .game-container.is-angry .eye {
            background: #ff0033;
            transform: scaleY(0.6);
            box-shadow: 0 0 10px #ff0033;
        }
        .game-container.is-angry .eye::after { display: none; }

        .game-container.is-angry .eyebrow.left { opacity: 1; transform: rotate(30deg); top: 97px; }
        .game-container.is-angry .eyebrow.right { opacity: 1; transform: rotate(-30deg); top: 97px; }

        .game-container.is-angry .mouth-container {
            height: 15px;
            margin-top: 15px;
        }
        .game-container.is-angry .mouth-happy {
            top: 10px;
            width: 75px;
            height: 35px;
            background: transparent;
            border: none;
            border-top: 5px solid #2b1d12;
            border-radius: 50%;
        }
        .game-container.is-angry .tongue { display: none; }

        .game-container.is-angry .hand-wave { display: none; }
        .game-container.is-angry .gun-hand {
            opacity: 1;
            transform: scale(1.3) rotate(0deg);
        }

        .footer-hint {
            margin-top: 15px;
            color: #7f8c8d;
            font-size: 15px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="speech-bubble" id="dialogue">مرحباً! أنا الدب المتكلم السعيد.. اضغط علي لنتحدث! هههههه 😂👋</div>

    <div class="game-container" id="bear-target">
        <div class="teddy">
            <div class="ear left"></div>
            <div class="ear right"></div>
            
            <div class="leg left"></div>
            <div class="leg right"></div>

            <div class="body-fur">
                <div class="belly-patch"></div>
            </div>
            
            <div class="head">
                <div class="keffiyeh-hat"></div> <div class="eyebrow left"></div>
                <div class="eyebrow right"></div>
                <div class="eye left"></div>
                <div class="eye right"></div>
                
                <div class="muzzle">
                    <div class="nose"></div>
                    <div class="mouth-container">
                        <div class="mouth-happy">
                            <div class="tongue"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="hand-wave"></div>

            <div class="gun-hand">
                <div class="pistol"></div>
            </div>
        </div>
    </div>

    <div class="footer-hint">اضغط مع الاستمرار على الدب (المسه) لتجعله يعصب! 👆</div>

    <script>
        const bearTarget = document.getElementById('bear-target');
        const dialogueBox = document.getElementById('dialogue');

        const angryPhrases = [
            "لقد حذرتك!! الآن ستواجه العواقب!! 😡🔫",
            "ابتعد بيدك عن وجهي وإلا أطلقت النار! 🤬💥",
            "ألم أقل لك لا تلمسني أيها البشري؟! 💀",
            "راح الضحك وجاء الجد الآن! 🔫😤"
        ];

        function triggerAngry() {
            bearTarget.classList.add('is-angry');
            dialogueBox.classList.add('angry');
            const randomText = angryPhrases[Math.floor(Math.random() * angryPhrases.length)];
            dialogueBox.innerText = randomText;
        }

        function triggerHappy() {
            if (bearTarget.classList.contains('is-angry')) {
                bearTarget.classList.remove('is-angry');
                dialogueBox.classList.remove('angry');
                dialogueBox.innerText = "مرحباً! أنا الدب المتكلم السعيد.. اضغط علي لنتحدث! هههههه 😂👋";
            }
        }

        // الكمبيوتر (الماوس)
        bearTarget.addEventListener('mousedown', triggerAngry);
        window.addEventListener('mouseup', triggerHappy);

        // الجوال (اللمس الفعلي)
        bearTarget.addEventListener('touchstart', (e) => {
            e.preventDefault();
            triggerAngry();
        });
        window.addEventListener('touchend', triggerHappy);
    </script>
</body>
</html>
