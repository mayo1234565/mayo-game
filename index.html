<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Mayo Show - Ultimate Edition</title>
    <style>
        :root { --studio-blue: #00cec9; --dark-bg: #1e272e; }
        body { margin: 0; background: #000; font-family: 'Cairo', sans-serif; color: white; overflow: hidden; }
        
        /* 1. هيكل الأستوديو */
        .stage { width: 100vw; height: 100vh; position: relative; background: radial-gradient(circle, #2c3e50 0%, #000 100%); }
        .studio-table { 
            position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%) perspective(800px) rotateX(20deg);
            width: 800px; height: 200px; background: #34495e; border-radius: 20px 20px 0 0;
            display: flex; justify-content: space-around; align-items: center; border: 5px solid var(--studio-blue);
        }
        .bet-option { width: 200px; height: 100px; background: #fff; color: #333; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border-radius: 10px; }
        
        /* 2. نظام الشخصيات 3D */
        .player-3d { 
            width: 70px; height: 120px; background: #95a5a6; position: absolute; transition: 0.3s;
            border-radius: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .player-3d .head { width: 40px; height: 40px; background: #f39c12; border-radius: 50%; margin: -40px auto 0; }
        
        /* 3. التحكم */
        .host-panel { position: absolute; top: 20px; left: 20px; background: #2f3640; padding: 20px; border-radius: 10px; }
        .player-panel { position: absolute; bottom: 20px; right: 20px; background: #2f3640; padding: 20px; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="stage" id="main-view">
        <h1 id="question-display" style="text-align: center; margin-top: 50px;">بانتظار المقدم...</h1>
        
        <div class="studio-table">
            <div class="bet-option" onclick="placeBet('A')">خيار (أ) <span id="amtA">0$</span></div>
            <div class="bet-option" onclick="placeBet('B')">خيار (ب) <span id="amtB">0$</span></div>
            <div class="bet-option" onclick="placeBet('C')">خيار (ج) <span id="amtC">0$</span></div>
        </div>

        <div class="player-3d" id="p-host" style="left: 100px; top: 300px; background: gold;"><div class="head"></div></div>
        <div class="player-3d" id="p1" style="left: 300px; bottom: 200px;"><div class="head"></div></div>
        <div class="player-3d" id="p2" style="left: 450px; bottom: 200px;"><div class="head"></div></div>
    </div>

    <div id="host-controls" class="host-panel" style="display:none;">
        <button onclick="sendQuestion()">إرسال سؤال</button>
        <button onclick="reveal()">كشف الإجابة</button>
    </div>

    <div class="player-panel">
        <div id="balance">الرصيد: 10000$</div>
        <button onclick="changeBet(-500)">-500</button>
        <span id="betValue">0</span>
        <button onclick="changeBet(500)">+500</button>
        <button onclick="confirmBet()">تأكيد المزايدة</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        const db = firebase.database().ref('game');
        let myBet = 0;
        let balance = 10000;

        // نظام الحركة (سلس)
        window.addEventListener('keydown', (e) => {
            let p = document.getElementById('p1');
            if(e.key === 'ArrowRight') p.style.left = (parseInt(p.style.left) + 20) + 'px';
            if(e.key === 'ArrowLeft') p.style.left = (parseInt(p.style.left) - 20) + 'px';
        });

        function changeBet(val) {
            myBet = Math.max(0, myBet + val);
            document.getElementById('betValue').innerText = myBet;
        }

        function confirmBet() {
            if(myBet > balance) return alert("رصيدك لا يكفي!");
            db.update({ lastBet: myBet });
        }

        // لوجيك المقدم
        function sendQuestion() {
            db.update({ question: "ما هي عاصمة السعودية؟" });
        }
    </script>
</body>
</html>
