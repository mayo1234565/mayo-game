<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ascension - Ultimate Network Lobby</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Orbitron:wght@500;700;900&family=Cairo:wght@600;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
        }

        /* حاوية اللعبة المعتمدة على خلفيتك النظيفة */
        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: url('background2.png') no-repeat center center;
            background-size: cover;
            display: flex;
            align-items: center; 
            justify-content: center; 
        }

        /* تعتيم سينمائي متوازن الحواف */
        .game-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 25%, rgba(0,0,0,0.65) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* الشاشات الفردية */
        .screen {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            z-index: 2;
            width: 100%;
            height: 100%;
            transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1), transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95); 
        }

        /* أزرار بلايستيشن النيون الفخمة */
        .sony-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Orbitron', 'Cinzel', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            padding: 5px 15px;
        }

        .sony-btn::after {
            content: '';
            width: 0;
            height: 3px;
            background-color: #00f0ff; 
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            transition: width 0.3s ease;
            box-shadow: 0 0 10px #00f0ff;
        }

        .sony-btn:hover {
            color: #ffffff;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6), 2px 2px 4px rgba(0, 0, 0, 0.9);
        }

        .sony-btn:hover::after {
            width: 100%; 
        }

        .start-title {
            font-size: 3.5rem;
            letter-spacing: 8px;
            color: #ffffff;
        }

        /* مجموعات الإدخال والترتيب الهرمي */
        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .input-label {
            color: rgba(255, 255, 255, 0.5) !important;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .sony-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 10px;
            font-size: 1.5rem;
            font-family: 'Cairo', 'Orbitron', sans-serif;
            text-align: center;
            outline: none;
            width: 340px;
            transition: all 0.4s ease;
        }

        .sony-input:focus {
            border-bottom-color: #00f0ff;
            box-shadow: 0 5px 15px -5px rgba(0, 240, 255, 0.3);
        }

        /* 👑 واجهة اللوبي المركزية الاحترافية (Centralized Showcase Menu) */
        .central-lobby {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 100%;
        }

        .lobby-header-zone {
            text-align: center;
        }

        .room-badge {
            font-family: 'Orbitron', sans-serif;
            color: #00f0ff;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            cursor: pointer;
            margin-top: 5px;
        }

        /* صف مصفوفات اللاعبين الفريد في المنتصف تماماً */
        .central-player-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px; /* المسافة بين اللاعبين */
            flex-wrap: wrap;
            width: 80%;
            margin: 20px 0;
        }

        /* بطاقة عرض الأيقونات المصغرة السداسية/الدائرية بستايل الأونلاين */
        .avatar-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            position: relative;
            animation: cardSpawn 0.5s ease-out forwards;
        }

        .avatar-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(15, 15, 25, 0.8);
            border: 3px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
            transition: all 0.3s;
        }

        /* تأثير التوهج المضيء للاعب المتصل والجهاز النشط */
        .avatar-circle.active-player {
            border-color: #00f0ff;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.4), inset 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .avatar-circle i {
            font-size: 2.5rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .avatar-circle.active-player i {
            color: #00f0ff;
        }

        .player-name-tag {
            font-family: 'Cairo', 'Orbitron', sans-serif;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 1px 1px 4px #000;
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 12px;
            border-radius: 10px;
        }

        .host-indicator {
            position: absolute;
            top: -8px;
            background: #00f0ff;
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            font-weight: 900;
            padding: 1px 6px;
            border-radius: 3px;
            letter-spacing: 1px;
            box-shadow: 0 0 8px #00f0ff;
        }

        .lobby-buttons {
            display: flex;
            gap: 30px;
            margin-top: 15px;
        }

        .back-mini-btn {
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.4);
        }
        .back-mini-btn:hover { color: #ff4a4a; }
        .back-mini-btn:hover::after { background-color: #ff4a4a; }

        @keyframes cardSpawn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="game-container">
        
        <div id="screen-start" class="screen">
            <button class="sony-btn start-title" onclick="switchScreen('screen-identity')">START</button>
        </div>

        <div id="screen-identity" class="screen hidden">
            <div class="input-group">
                <span class="input-label">PLAYER IDENTITY</span>
                <input type="text" id="player-name" class="sony-input" placeholder="ENTER NAME..." maxlength="12">
            </div>
            <button class="sony-btn" onclick="confirmIdentity()">CONFIRM</button>
            <button class="sony-btn back-mini-btn" onclick="switchScreen('screen-start')">BACK</button>
        </div>

        <div id="screen-choice" class="screen hidden">
            <div class="input-group">
                <span class="input-label">JOIN EXISTING LOBBY</span>
                <input type="text" id="join-code" class="sony-input" placeholder="ENTER ROOM CODE..." style="font-family:'Orbitron'; letter-spacing:2px; font-size:1.2rem;">
            </div>
            <button class="sony-btn" onclick="initNetwork('join')"><i class="fa-solid fa-right-to-bracket"></i> JOIN LOBBY</button>
            <div style="color: rgba(255,255,255,0.2); font-family:'Orbitron'; font-size:0.9rem; letter-spacing:2px;">— OR —</div>
            <button class="sony-btn" onclick="initNetwork('host')"><i class="fa-solid fa-plus"></i> CREATE LOBBY</button>
            <button class="sony-btn back-mini-btn" onclick="switchScreen('screen-identity')">BACK</button>
        </div>

        <div id="screen-lobby" class="screen hidden">
            <div class="central-lobby">
                <div class="lobby-header-zone">
                    <span class="input-label" style="opacity:0.6;">MULTIPLAYER MATCHMAKING</span>
                    <div id="room-id-display" class="room-badge" title="Click to copy code" onclick="copyCode()">ROOM-0000</div>
                </div>

                <div class="central-player-grid" id="player-mesh">
                    </div>

                <div class="lobby-buttons">
                    <button class="sony-btn" style="color: #00ff88; font-size: 1.5rem;" id="host-start-trigger" onclick="alert('Launching server components...')">LAUNCH MATCH</button>
                    <button class="sony-btn back-mini-btn" onclick="disconnectLobby()">LEAVE LOBBY</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        let peer = null;
        let connections = [];
        let pName = "";
        let globalPlayers = [];

        // إعدادات خوادم الاتصالات المفتوحة والمضمونة لتخطي حظور الراوتر وجدران الحماية بالكامل
        const iceConfig = {
            config: {
                'iceServers': [
                    { 'urls': 'stun:stun.l.google.com:19302' },
                    { 'urls': 'stun:stun1.l.google.com:19302' },
                    { 'urls': 'stun:stun2.l.google.com:19302' },
                    { 'urls': 'stun:stun3.l.google.com:19302' },
                    { 'urls': 'stun:stun4.l.google.com:19302' }
                ]
            }
        };

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
        }

        function confirmIdentity() {
            pName = document.getElementById('player-name').value.trim();
            if(!pName) {
                alert("Please declare a valid identity name!");
                return;
            }
            switchScreen('screen-choice');
        }

        // إعداد شبكة الأونلاين ونظام الربط الفعلي
        function initNetwork(mode) {
            if(mode === 'host') {
                const generatedRoom = 'ROOM-' + Math.floor(1000 + Math.random() * 9000);
                document.getElementById('room-id-display').innerText = generatedRoom;
                document.getElementById('host-start-trigger').style.display = 'block';

                peer = new Peer(generatedRoom, iceConfig);
                
                peer.on('open', () => {
                    switchScreen('screen-lobby');
                    syncLobbyArray(pName, true);
                });

                peer.on('connection', (conn) => {
                    connections.push(conn);
                    conn.on('data', (data) => {
                        if(data.type === 'register') {
                            syncLobbyArray(data.name, false);
                            broadcastData({type: 'sync', list: globalPlayers});
                        }
                    });
                });

            } else {
                const enteredCode = document.getElementById('join-code').value.trim().toUpperCase();
                if(!enteredCode) {
                    alert("Room code field cannot be empty!");
                    return;
                }

                document.getElementById('host-start-trigger').style.display = 'none';
                peer = new Peer(iceConfig);

                peer.on('open', () => {
                    const conn = peer.connect(enteredCode);
                    conn.on('open', () => {
                        connections.push(conn);
                        conn.send({type: 'register', name: pName});
                        document.getElementById('room-id-display').innerText = enteredCode;
                        switchScreen('screen-lobby');
                    });

                    conn.on('data', (data) => {
                        if(data.type === 'sync') {
                            drawCentralGrid(data.list);
                        }
                    });
                });
            }
        }

        function syncLobbyArray(name, isHost) {
            globalPlayers.push({name: name, isHost: isHost});
            drawCentralGrid(globalPlayers);
        }

        // رسم مصفوفة اللاعبين بشكل مصغر وأيقونات في المنتصف تماماً كما طلبت
        function drawCentralGrid(list) {
            const grid = document.getElementById('player-mesh');
            grid.innerHTML = "";
            list.forEach(player => {
                grid.innerHTML += `
                    <div class="avatar-card">
                        ${player.isHost ? '<span class="host-indicator">HOST</span>' : ''}
                        <div class="avatar-circle active-player">
                            <i class="fa-solid fa-user-ninja"></i>
                        </div>
                        <div class="player-name-tag">${player.name}</div>
                    </div>
                `;
            });
        }

        function broadcastData(payload) {
            connections.forEach(c => {
                if(c.open) c.send(payload);
            });
        }

        function disconnectLobby() {
            if(peer) peer.destroy();
            connections = [];
            globalPlayers = [];
            switchScreen('screen-choice');
        }

        function copyCode() {
            const c = document.getElementById('room-id-display').innerText;
            navigator.clipboard.writeText(c);
            alert("Lobby ID Copied: " + c);
        }
    </script>
</body>
</html>
