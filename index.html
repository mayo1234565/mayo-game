<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game - TEST</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    /* ========================================= */
    /* الهوية البصرية حقت TEST (نيون غامق) */
    /* ========================================= */
    :root {
      --sky-purple: #340c6e;
      --sky-blue: #141753;
      --neon-pink: #ff2e63;
      --neon-purple: #811cc2;
      --border-start: #ff91b1;
      --border-other: #b36ff0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }

    body {
      width: 100vw; 
      min-height: 100vh;
      /* خلفية نفس تدريج السماء في الصورة */
      background: linear-gradient(180deg, var(--sky-purple) 0%, var(--sky-blue) 100%);
      font-family: 'Cairo', sans-serif; /* للعربي */
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: space-between; /* عشان نوزع العنوان فوق والأزرار بالنص والمربع تحت */
      overflow: hidden;
      position: relative;
      padding: 60px 0;
    }

    /* تأثير خطوط التلفزيون القديم (Scanlines) اللي في الصورة */
    body::before {
      content: '';
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%);
      background-size: 100% 4px;
      z-index: 1; pointer-events: none;
    }

    /* محاكاة للشمس الفايديت في الخلفية */
    .retro-sun {
      position: absolute; bottom: 30%; left: 50%; transform: translateX(-50%);
      width: 500px; height: 500px;
      background: radial-gradient(circle, var(--neon-pink) 0%, #ff814d 60%, transparent 100%);
      border-radius: 50%;
      filter: blur(20px); opacity: 0.7; z-index: 0;
    }

    /* ========================================= */
    /* ترتيب العنوان (Header) */
    /* ========================================= */
    header { text-align: center; z-index: 2; }

    h1.pixel-title {
      font-size: 4rem; margin: 0;
      /* تأثير التدرج الأبيض المائل للأزرق اللي في الصورة */
      background: linear-gradient(180deg, #fff 0%, #a0a0ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-family: 'Cairo', sans-serif; font-weight: 700;
      /* تأثير النيون القوي المتوهج للأزرق والبنفسجي */
      filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.8)) drop-shadow(0 0 20px rgba(129, 28, 194, 0.8));
      text-transform: uppercase;
    }

    h2.pixel-subtitle {
      font-family: 'Press Start 2P', cursive; /* خط بكسل للإنجليزي */
      font-size: 1rem; color: #fff; margin-top: 5px;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
    }

    /* ========================================= */
    /* ترتيب وأشكال الأزرار (Main) */
    /* ========================================= */
    main {
      display: flex; flex-direction: column; 
      align-items: center; justify-content: center; 
      gap: 20px; z-index: 2; width: 100%;
    }

    /* الحاوية حقت الأزرار عشان نعطيهم شكل الألماس (الماسي) بالبكسل */
    .btn-wrapper {
      background: none; border: none; cursor: pointer; position: relative;
      width: 250px; height: 100px;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.1s; transform-style: preserve-3d;
    }
    .btn-wrapper:active { transform: scale(0.95); }

    /* الطبقة الخارجية حقت النيون (توهج النيون) */
    .btn-outer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      /* شكل ماسي مقصوص الأطراف بالبكسل */
      clip-path: polygon(15% 0%, 85% 0%, 100% 50%, 85% 100%, 15% 100%, 0% 50%);
      z-index: 1;
    }

    /* الطبقة الداخلية حقت اللون الغامق */
    .btn-inner {
      position: absolute; top: 3px; left: 3px; right: 3px; bottom: 3px;
      background: #121021;
      clip-path: polygon(15% 0%, 85% 0%, 100% 50%, 85% 100%, 15% 100%, 0% 50%);
      z-index: 2;
    }

    /* محاكاة لتوهج النيون الكبير حول الزر */
    .btn-glow {
      position: absolute; top: 5px; left: 5px; right: 5px; bottom: 5px;
      clip-path: polygon(15% 0%, 85% 0%, 100% 50%, 85% 100%, 15% 100%, 0% 50%);
      filter: blur(10px); opacity: 0.8; z-index: 0;
    }

    /* النص داخل الزر بنفس ترتيب الصورة */
    .btn-text {
      font-size: 2.2rem; font-weight: 700; color: #fff; z-index: 3;
      font-family: 'Cairo', sans-serif; text-transform: uppercase;
      transform: translateY(3px); /* تعديل بسيط لمكان النص */
    }

    /* تخصيص زر البداية (START) بنفس لون التوهج الوردي اللي في الصورة */
    .btn-start .btn-outer { 
      background: var(--border-start); 
      box-shadow: 0 0 30px rgba(255, 46, 99, 0.9);
    }
    .btn-start .btn-glow { box-shadow: 0 0 30px rgba(255, 46, 99, 0.9); }

    /* تخصيص زر خيارات وخروج بنفس لون التوهج البنفسجي */
    .btn-options .btn-outer, .btn-exit .btn-outer { 
      background: var(--border-other); 
    }
    .btn-options .btn-glow, .btn-exit .btn-glow { box-shadow: 0 0 30px rgba(129, 28, 194, 0.9); }

    /* ========================================= */
    /* ترتيب مربع الاسم في الأسفل (Footer) */
    /* ========================================= */
    footer {
      width: 100%; display: flex; justify-content: center; z-index: 2;
    }

    .player-input-container {
      display: flex; align-items: center; justify-content: space-between;
      gap: 15px; 
      background-color: rgba(18, 16, 33, 0.85); /* نفس لون المربع */
      border: 2px solid var(--neon-purple); /* تدرج بنفسجي */
      padding: 10px 20px; border-radius: 5px;
      font-family: 'Cairo', sans-serif;
      width: 60%; max-width: 600px;
    }

    .player-input-container label {
      color: #dcdcdc; font-size: 1.2rem; font-weight: 700;
    }

    .player-input-container input {
      background: none; border: none;
      color: #fff; font-family: 'Press Start 2P', cursive; /* خط بكسل للإنجليزي */
      font-size: 1rem; outline: none; text-align: right;
      width: 60%;
    }

    /* التجاوب مع الجوال بنفس الترتيب في الصورة */
    @media (max-width: 900px) {
      h1.pixel-title { font-size: 2.5rem; }
      .player-input-container { width: 90%; }
      .btn-wrapper { width: 200px; height: 80px; }
      .btn-text { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

  <div class="retro-sun"></div>

  <header>
    <h1 class="pixel-title">أساتذة الـ 7</h1>
    <h2 class="pixel-subtitle">THE 7 INFILTRATORS</h2>
  </header>

  <main>
    <button class="btn-wrapper btn-start">
      <div class="btn-glow"></div>
      <div class="btn-outer"></div>
      <div class="btn-inner"></div>
      <span class="btn-text">ابدأ</span>
    </button>

    <button class="btn-wrapper btn-options">
      <div class="btn-glow"></div>
      <div class="btn-outer"></div>
      <div class="btn-inner"></div>
      <span class="btn-text">خيارات</span>
    </button>

    <button class="btn-wrapper btn-exit">
      <div class="btn-glow"></div>
      <div class="btn-outer"></div>
      <div class="btn-inner"></div>
      <span class="btn-text">خروج</span>
    </button>
  </main>

  <footer>
    <div class="player-input-container">
      <label for="playerName">أدخل الاسم</label>
      <input type="text" id="playerName" value="TEST_PLAYER">
    </div>
  </footer>

</body>
</html>
