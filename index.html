<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة اللعبة الاحترافية</title>
    <style>
        /* إعدادات الشاشة الأساسية - أبعاد الجوال والايفون */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 🌌 نظام الخلفية الفضائية المتقدم */
        .space-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            background: black;
        }

        /* النجوم المتحركة ببطء في الخلفية دائماً */
        .stars-bg {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                radial-gradient(1px 1px at 40px 80px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 200px 300px, #fff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 100px 500px, #aaa, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 350px 150px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            top: -50%;
            left: -50%;
            animation: starsRotate 50s infinite linear;
            opacity: 0.5;
        }

        /* الكواكب البعيدة (تظهر فقط في شاشة ابدأ) */
        .planets-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transition: opacity 1s ease-in-out, transform 1s ease-in-out;
            z-index: 2;
        }

        .planet {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #161722, #000000 80%);
            box-shadow: inset -10px -10px 25px rgba(0,0,0,0.9);
            opacity: 0.6;
            animation: floatingPlanet 10s infinite ease-in-out;
        }

        .planet-1 { width: 80px; height: 80px; top: 15%; left: 10%; animation-delay: 0s; }
        .planet-2 { width: 110px; height: 110px; bottom: 20%; right: 5%; animation-delay: 2s; }

        @keyframes starsRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes floatingPlanet {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }

        /* عند الانتقال للشاشة التالية، تختفي الكواكب وتنسحب ببطء */
        .planets-layer.fade-out {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }

        /* 📱 حاوية الجوال والقوائم */
        .ui-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 390px; /* مقاس الايفون المثالي */
            height: 100vh;
            max-height: 844px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .hidden { display: none !important; opacity: 0; }

        /* 🛑 قائمة شاشة ابدأ */
        .btn-start {
            background: linear-gradient(135deg, #12131a 0%, #050507 100%);
            color: #d1d5db;
            border: 2px solid #232533;
            padding: 16px 60px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            transition: all 0.3s ease;
        }

        .btn-start:hover {
            border-color: #8c1d1d;
            color: #ffffff;
            box-shadow: 0 0 25px rgba(140, 29, 29, 0.4);
        }

        /* ⚙️ قائمة التخصيص واختيار الهوية */
        .menu-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* تصميم خانة الاسم الحركي */
        .input-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-section label {
            font-size: 14px;
            color: #646b7c;
            font-weight: 600;
            padding-right: 5px;
        }

        .input-hero {
            width: 100%;
            padding: 15px;
            background: rgba(8, 9, 13, 0.9);
            border: 1px solid #1a1c24;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-hero:focus { border-color: #731515; }

        /* 🕹️ نظام القوائم التفاعلية الجديد (Sliders) */
        .slider-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            background: rgba(8, 9, 13, 0.7);
            border: 1px solid #161820;
            padding: 10px 15px;
            border-radius: 10px;
        }

        .arrow-btn {
            background: #000;
            border: 1px solid #222533;
            color: #ffffff;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .arrow-btn:hover { background: #12131a; border-color: #444; }

        /* زر الاختيار الأوسط الثابت */
        .action-select-btn {
            background: linear-gradient(180deg, #1a1c26 0%, #0d0e15 100%);
            border: 1px solid #2b2e3d;
            color: #e2e8f0;
            padding: 10px 30px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            min-width: 160px;
            text-align: center;
        }

        /* 🖼️ منطقة المعاينة الحية الفخمة في الأسفل */
        .preview-box {
            width: 100%;
            background: radial-gradient(circle, #0c0d14 0%, #040407 100%);
            border: 1px solid #161820;
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }

        .preview-title {
            font-size: 13px;
            color: #4b5263;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* تركيب الصورة والاطار برمجياً فوق بعض */
        .avatar-composition {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* طبقة الصورة الخلفية */
        .img-layer {
            position: absolute;
            width: 95px;
            height: 95px;
            border-radius: 10px;
            background-size: cover;
            background-position: center;
            z-index: 1;
            background-color: #0d0d11;
            transition: background-image 0.2s ease;
        }

        /* طبقة الإطار الأمامية */
        .frame-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 2;
            pointer-events: none;
        }

        .item-name-indicator {
            font-size: 14px;
            color: #a0a6b7;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="space-container">
        <div class="stars-bg"></div>
        <div id="planetsLayer" class="planets-layer">
            <div class="planet planet-1"></div>
            <div class="planet planet-2"></div>
        </div>
    </div>

    <div class="ui-wrapper">
        
        <div id="startScreen" class="screen">
            <button class="btn-start" onclick="onStartClicked()">ابدأ</button>
        </div>

        <div id="setupScreen" class="screen hidden">
            <div class="menu-container">
                
                <div class="input-section">
                    <label>اسـم الـلاعـب</label>
                    <input type="text" id="playerName" class="input-hero" placeholder="اكتب اسمك هنا..." maxlength="14">
                </div>

                <div class="input-section">
                    <label>تغيير الصورة الشخصية</label>
                    <div class="slider-control">
                        <button class="arrow-btn" onclick="rotateImages(-1)">&gt;</button>
                        <button class="action-select-btn" id="imgBtn">اضغط صوره</button>
                        <button class="arrow-btn" onclick="rotateImages(1)">&lt;</button>
                    </div>
                </div>

                <div class="input-section">
                    <label>تغيير إطار المرتبة</label>
                    <div class="slider-control">
                        <button class="arrow-btn" onclick="rotateFrames(-1)">&gt;</button>
                        <button class="action-select-btn" id="frameBtn">اضغط الايطار</button>
                        <button class="arrow-btn" onclick="rotateFrames(1)">&lt;</button>
                    </div>
                </div>

                <div class="preview-box">
                    <div class="preview-title">مظهر الهوية الحالي</div>
                    <div class="avatar-composition">
                        <div id="liveImage" class="img-layer"></div>
                        <div id="liveFrame" class="frame-layer"></div>
                    </div>
                    <div id="statusIndicator" class="item-name-indicator">إطار: Bronze</div>
                </div>

            </div>
        </div>

    </div>

    <script>
        // 🔗 مصفوفة روابط الصور (يمكنك استبدال الروابط الوهمية بروابط صور الأنمي الحقيقية لاحقاً)
        const imagesList = [
            "https://placehold.co/150/0d0d11/ffffff?text=Anime+1", // هنا تضع رابط صورة الأنمي 1
            "https://placehold.co/150/0d0d11/ffffff?text=Anime+2", // هنا تضع رابط صورة الأنمي 2
            "https://placehold.co/150/0d0d11/ffffff?text=Anime+3"  // هنا تضع رابط صورة الأنمي 3
        ];

        // 🔗 مصفوفة روابط الإطارات المقصوصة (تضع روابط الإطارات الفردية الشفافة هنا)
        const framesList = [
            { name: "Bronze", url: "https://placehold.co/200/rgba(0,0,0,0)/ffffff?text=[Bronze]" },
            { name: "Silver", url: "https://placehold.co/200/rgba(0,0,0,0)/ffffff?text=[Silver]" },
            { name: "Gold", url: "https://placehold.co/200/rgba(0,0,0,0)/ffffff?text=[Gold]" },
            { name: "Platinum / Gold", url: "https://placehold.co/200/rgba(0,0,0,0)/ffffff?text=[Platinum]" },
            { name: "Diamond / Gold", url: "https://placehold.co/200/rgba(0,0,0,0)/ffffff?text=[Diamond]" },
            { name: "Ruby / Gold", url: "https://placehold.co/200/rgba(0,0,0,0)/ffffff?text=[Ruby]" },
            { name: "Solar", url: "https://placehold.co/200/rgba(0,0,0,0)/ffffff?text=[Solar]" }
        ];

        let currentImageIndex = 0;
        let currentFrameIndex = 0;

        // دالة الضغط على زر ابدأ
        function onStartClicked() {
            // 1. إخفاء الكواكب بسلاسة من الخلفية وإبقاء النجوم فقط
            document.getElementById('planetsLayer').classList.add('fade-out');

            // 2. الانتقال إلى شاشة القوائم واختيار الهوية
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('setupScreen').classList.remove('hidden');
            
            // تحديث العرض الأول
            renderUI();
        }

        // دالة تدوير واختيار الصور
        function rotateImages(direction) {
            currentImageIndex += direction;
            if (currentImageIndex < 0) currentImageIndex = imagesList.length - 1;
            if (currentImageIndex >= imagesList.length) currentImageIndex = 0;
            renderUI();
        }

        // دالة تدوير واختيار الإطارات
        function rotateFrames(direction) {
            currentFrameIndex += direction;
            if (currentFrameIndex < 0) currentFrameIndex = framesList.length - 1;
            if (currentFrameIndex >= framesList.length) currentFrameIndex = 0;
            renderUI();
        }

        // تحديث القوائم والمعاينة الحية فوراً
        function renderUI() {
            // تحديث الصورة الحالية في طبقة المعاينة
            document.getElementById('liveImage').style.backgroundImage = `url('${imagesList[currentImageIndex]}')`;

            // تحديث الإطار الحالي في طبقة المعاينة
            const currentFrame = framesList[currentFrameIndex];
            document.getElementById('liveFrame').style.backgroundImage = `url('${currentFrame.url}')`;

            // تحديث مؤشر الاسم في الأسفل
            document.getElementById('statusIndicator').innerText = `الإطار الحالي: ${currentFrame.name}`;
        }

        // تشغيل مبدئي عند تحميل الصفحة للتأكد من جاهزية الطبقات
        window.onload = renderUI;
    </script>
</body>
</html>
