<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Arena AAA - Full Game 0 to 100</title>
    <style>
        /* --- التصميم العام والخطوط السينمائية --- */
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #020204;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            color: #fff;
        }

        /* --- خلفية الفضاء المتحركة --- */
        #environment {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .stars {
            position: absolute;
            width: 2px; height: 2px;
            background: transparent;
            box-shadow: 100px 200px #fff, 300px 500px #fff, 800px 100px #fff, 
                        1200px 400px #fff, 500px 800px #fff, 1500px 900px #fff, 
                        200px 900px #fff, 1000px 600px #fff, 1700px 200px #fff;
            animation: twinkle 4s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* --- الشاشات --- */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.02) translateY(-10px);
        }

        /* --- الشاشة 1: ابدأ اللعب --- */
        #start-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 20px;
            cursor: pointer;
            outline: none;
            text-shadow: 0 0 15px rgba(255,255,255,0.2);
            transition: all 0.3s ease;
        }
        #start-btn:hover {
            text-shadow: 0 0 25px #ff003c, 0 0 50px #ff003c;
            transform: scale(1.05);
        }

        /* --- الشاشة 2: إعداد الملف الشخصي الشفاف تماماً --- */
        .clean-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background: transparent;
        }

        .glow-text {
            background: transparent;
            border: none;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.3rem;
            letter-spacing: 2px;
            outline: none;
            text-align: center;
        }

        input[type="text"] {
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding: 10px;
            width: 260px;
            text-transform: uppercase;
            transition: all 0.3s;
        }
        input[type="text"]:focus {
            border-bottom: 1px solid #ff003c;
            text-shadow: 0 0 10px rgba(255, 0, 60, 0.5);
        }

        select {
            appearance: none;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding: 5px 15px;
            cursor: pointer;
            text-align-last: center;
        }
        select option { background: #0c0c12; color: #fff; }

        .action-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 30px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
        }
        .action-btn:hover { 
            border-color: #fff;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        .action-btn.red-glow { border-color: #ff003c; color: #ff003c; }
        .action-btn.red-glow:hover { background: #ff003c; color: #fff; box-shadow: 0 0 25px #ff003c; }

        /* --- الشاشة 3: اللوبي لـ 7 لاعبين جنباً إلى جنب (بدون مربعات خلفية) --- */
        .lobby-header h1 { font-size: 2.5rem; letter-spacing: 10px; text-transform: uppercase; text-align: center;}
        .room-tag { color: #ff003c; font-size: 1.3rem; text-align: center; letter-spacing: 3px; margin-top: 5px;}

        .players-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px; /* مسافة متناسقة لتكفي 7 لاعبين عرضياً */
            width: 95%;
            max-width: 1600px;
            margin: 40px 0;
        }

        .player-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 160px;
            background: transparent;
            animation: card-entry 0.5s ease-out forwards;
        }

        @keyframes card-entry {
            0% { opacity: 0; transform: translateY(20px); filter: blur(5px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .player-name {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-top: 5px;
            text-align: center;
            text-shadow: 0 0 8px rgba(255,255,255,0.3);
        }

        /* --- نظام الإطارات المرن --- */
        .frame-box {
            position: relative;
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .rank-svg { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 2; }
        .avatar-box {
            position: absolute;
            width: 62px; height: 72px;
            top: 34px; left: 44px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            background: #101015;
            z-index: 1;
        }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }

        /* ألوان وهالات الرتب */
        .rank-bronze .accent-stroke { stroke: #b87333; } .rank-bronze .glow-effect { filter: drop-shadow(0 0 5px #b87333); }
        .rank-silver .accent-stroke { stroke: #9ca3af; } .rank-silver .glow-effect { filter: drop-shadow(0 0 5px #9ca3af); }
        .rank-gold .accent-stroke { stroke: #d97706; } .rank-gold .glow-effect { filter: drop-shadow(0 0 8px #d97706); }
        .rank-diamond .accent-stroke { stroke: #2563eb; } .rank-diamond .glow-effect { filter: drop-shadow(0 0 10px #2563eb); }
        .rank-solar .accent-stroke { stroke: #ea580c; } .rank-solar .glow-effect { filter: drop-shadow(0 0 12px #ea580c); }

        /* --- الشاشة 4: ساحة اللعبة الحقيقية (Gameplay Arena) --- */
        #game-canvas {
            background: radial-gradient(circle, #090914 0%, #020205 100%);
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        .game-ui {
            position: absolute;
            top: 20px; left: 20px;
            font-family: inherit;
            letter-spacing: 2px;
            z-index: 100;
            pointer-events: none;
        }
        .game-ui h2 { color: #ff003c; text-shadow: 0 0 10px #ff003c; }

        /* لافتة الفوز */
        .victory-screen {
            position: absolute;
            font-size: 4rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 30px #ff003c;
            letter-spacing: 10px;
            display: none;
            z-index: 105;
        }
    </style>
</head>
<body>

    <div id="environment"><div class="stars"></div></div>

    <div id="phase1" class="screen">
        <button id="start-btn">COSMIC ARENA</button>
    </div>

    <div id="phase2" class="screen hidden">
        <div class="clean-container">
            <div class="player-slot" style="width:200px;">
                <div id="preview-frame" class="frame-box rank-bronze">
                    <div class="avatar-box">
                        <img id="preview-img" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=">
                    </div>
                    <svg class="rank-svg glow-effect" viewBox="0 0 260 260" fill="none">
                        <polygon points="130,42 200,77 200,163 130,198 60,163 60,77" class="accent-stroke" stroke-width="5"/>
                        <path d="M52,70 Q25,90 35,140" class="accent-stroke" stroke-width="4"/>
                        <path d="M208,70 Q235,90 225,140" class="accent-stroke" stroke-width="4"/>
                    </svg>
                </div>
                <div id="preview-rank-text" class="player-name" style="color:#b87333; font-size:1rem;">BRONZE</div>
            </div>

            <select id="rank-select" class="glow-text">
                <option value="bronze">RANK: BRONZE</option>
                <option value="silver">RANK: SILVER</option>
                <option value="gold">RANK: GOLD</option>
                <option value="diamond">RANK: DIAMOND</option>
                <option value="solar">RANK: SOLAR</option>
            </select>

            <input type="text" id="player-name" class="glow-text" value="PILOT_01" autocomplete="off" maxlength="12">
            
            <div class="multiplayer-btns">
                <button id="create-room-btn" class="action-btn red-glow">CREATE ARENA</button>
            </div>
        </div>
    </div>

    <div id="phase3" class="screen hidden">
        <div class="lobby-header">
            <h1>MATCHMAKING LOBBY</h1>
            <div id="room-id" class="room-tag">ROOM: #7777</div>
        </div>

        <div id="players-row" class="players-row"></div>

        <div class="multiplayer-btns">
            <button id="leave-btn" class="action-btn">LEAVE</button>
            <button id="launch-btn" class="action-btn red-glow">LAUNCH MATCH</button>
        </div>
    </div>

    <div id="phase4" class="screen hidden">
        <div class="game-ui">
            <h2>COSMIC ARENA: FREE FOR ALL</h2>
            <p>CONTROLS: ARROWS / WASD TO MOVE | MOUSE TO AIM & CLICK TO SHOOT</p>
            <p style="color: #a3e635;">PLAYERS ALIVE: <span id="alive-count">7</span> / 7</p>
        </div>
        <div id="victory-banner" class="victory-screen">VICTORY!</div>
        <canvas id="game-canvas" width="1200" height="700"></canvas>
    </div>

    <script>
        // --- عناصر واجهة المستخدم ---
        const phase1 = document.getElementById('phase1'), phase2 = document.getElementById('phase2');
        const phase3 = document.getElementById('phase3'), phase4 = document.getElementById('phase4');
        const startBtn = document.getElementById('start-btn'), createRoomBtn = document.getElementById('create-room-btn');
        const launchBtn = document.getElementById('launch-btn'), leaveBtn = document.getElementById('leave-btn');
        const rankSelect = document.getElementById('rank-select'), playerNameInput = document.getElementById('player-name');
        const previewFrame = document.getElementById('preview-frame'), previewRankText = document.getElementById('preview-rank-text');
        const playersRow = document.getElementById('players-row'), canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        // --- البيانات العامة والألوان ---
        const rankColors = { bronze: '#b87333', silver: '#9ca3af', gold: '#d97706', diamond: '#2563eb', solar: '#ea580c' };
        let myData = { name: "PILOT_01", rank: "bronze", avatar: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" };

        // توليد 6 لاعبين وهميين لإكمال الـ 7 لاعبين في اللوبي واللعبة
        const botsData = [
            { name: "X_SHADOW_X", rank: "solar" },
            { name: "VORTEX", rank: "diamond" },
            { name: "KINETIC", rank: "gold" },
            { name: "Z3RO_COOL", rank: "silver" },
            { name: "CYPHER", rank: "diamond" },
            { name: "TITAN", rank: "bronze" }
        ];

        // --- المعاينة الفورية في القائمة قبل الدخول ---
        rankSelect.addEventListener('change', (e) => {
            myData.rank = e.target.value;
            previewFrame.className = `frame-box rank-${myData.rank}`;
            previewRankText.textContent = myData.rank.toUpperCase();
            previewRankText.style.color = rankColors[myData.rank];
        });

        startBtn.addEventListener('click', () => {
            phase1.classList.add('hidden');
            setTimeout(() => phase2.classList.remove('hidden'), 400);
        });

        // --- بناء اللوبي السينمائي لـ 7 لاعبين جنب بعض ---
        function buildLobby() {
            playersRow.innerHTML = ''; // تنظيف
            myData.name = playerNameInput.value.toUpperCase() || "PILOT_01";

            // 1. إدخالك أنت كلاعب أول
            playersRow.innerHTML += createPlayerSlotHTML(myData.name, myData.rank, myData.avatar, "#ff003c");

            // 2. إدخال الـ 6 لاعبين الآخرين بجانبك فوراً ليكون الإجمالي 7
            botsData.forEach((bot, index) => {
                setTimeout(() => {
                    playersRow.innerHTML += createPlayerSlotHTML(bot.name, bot.rank, myData.avatar, rankColors[bot.rank]);
                }, (index + 1) * 250); // أنيميشن دخول متتالي رهيب
            });
        }

        function createPlayerSlotHTML(name, rank, av, textColor) {
            return `
                <div class="player-slot">
                    <div class="frame-box rank-${rank}">
                        <div class="avatar-box"><img src="${av}"></div>
                        <svg class="rank-svg glow-effect" viewBox="0 0 260 260" fill="none">
                            <polygon points="130,42 200,77 200,163 130,198 60,163 60,77" class="accent-stroke" stroke-width="5"/>
                        </svg>
                    </div>
                    <div class="player-name" style="color:${textColor}">${name}</div>
                    <div style="font-size:0.7rem; color:rgba(255,255,255,0.4); letter-spacing:1px; margin-top:2px;">READY</div>
                </div>
            `;
        }

        createRoomBtn.addEventListener('click', () => {
            phase2.classList.add('hidden');
            setTimeout(() => {
                phase3.classList.remove('hidden');
                buildLobby();
            }, 400);
        });

        leaveBtn.addEventListener('click', () => {
            phase3.classList.add('hidden');
            setTimeout(() => phase2.classList.remove('hidden'), 400);
        });

        // ==========================================
        // 🎮 محرك اللعبة الحقيقي من 0 إلى 100 (GAME ENGINE)
        // ==========================================
        let players = [];
        let bullets = [];
        let gameLoopId;
        let keys = {};

        // مراقبة أزرار الكيبورد للتحكم
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
        
        // مراقبة الماوس للتصويب والإطلاق
        let mouseX = 0, mouseY = 0;
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });
        canvas.addEventListener('mousedown', () => {
            if (players[0] && players[0].alive) {
                fireBullet(players[0], mouseX, mouseY);
            }
        });

        function setupGame() {
            players = [];
            bullets = [];
            document.getElementById('victory-banner').style.display = 'none';

            // إضافتك كلاعب رقم 1 (المركبة الحمراء المتحكم بها)
            players.push({
                id: 0, x: 100, y: 350, vx: 0, vy: 0, radius: 20,
                color: '#ff003c', name: myData.name, isBot: false, alive: true, angle: 0
            });

            // إضافة الـ 6 لاعبين الآخرين كـ الأعداء (ذكاء اصطناعي يتحركون ويطلقون النار تلقائياً)
            botsData.forEach((bot, i) => {
                players.push({
                    id: i + 1,
                    x: 400 + (i * 120),
                    y: 100 + (Math.random() * 500),
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    radius: 20,
                    color: rankColors[bot.rank],
                    name: bot.name,
                    isBot: true,
                    alive: true,
                    angle: 0,
                    lastShot: 0
                });
            });
        }

        function fireBullet(fromPlayer, targetX, targetY) {
            const angle = Math.atan2(targetY - fromPlayer.y, targetX - fromPlayer.x);
            bullets.push({
                x: fromPlayer.x + Math.cos(angle) * 25,
                y: fromPlayer.y + Math.sin(angle) * 25,
                vx: Math.cos(angle) * 10,
                vy: Math.sin(angle) * 10,
                owner: fromPlayer.id,
                color: fromPlayer.color
            });
        }

        function updateGame() {
            // 1. تحريك اللاعب البشري (أنت) بواسطة WASD أو الأسهم
            const p = players[0];
            if (p && p.alive) {
                if (keys['w'] || keys['arrowup']) p.y -= 4;
                if (keys['s'] || keys['arrowdown']) p.y += 4;
                if (keys['a'] || keys['arrowleft']) p.x -= 4;
                if (keys['d'] || keys['arrowright']) p.x += 4;
                p.angle = Math.atan2(mouseY - p.y, mouseX - p.x);

                // الحدود لمنع الخروج من الشاشة
                p.x = Math.max(p.radius, Math.min(canvas.width - p.radius, p.x));
                p.y = Math.max(p.radius, Math.min(canvas.height - p.radius, p.y));
            }

            // 2. تحريك الـ 6 لاعبين الآخرين (الذكاء الاصطناعي Bot AI)
            players.forEach(pl => {
                if (!pl.alive || !pl.isBot) return;

                // حركة عشوائية ذكية داخل الساحة
                pl.x += pl.vx; pl.y += pl.vy;
                if (pl.x < pl.radius || pl.x > canvas.width - pl.radius) pl.vx *= -1;
                if (pl.y < pl.radius || pl.y > canvas.height - pl.radius) pl.vy *= -1;

                // تصويب تلقائي وإطلاق نار على أقرب لاعب حي كل ثانية
                let now = Date.now();
                if (now - pl.lastShot > 1200) {
                    let target = players.find(t => t.id !== pl.id && t.alive);
                    if (target) {
                        fireBullet(pl, target.x, target.y);
                        pl.angle = Math.atan2(target.y - pl.y, target.x - pl.x);
                    }
                    pl.lastShot = now;
                }
            });

            // 3. تحريك وتحديث الطلقات والاصطدامات
            bullets.forEach((b, bIdx) => {
                b.x += b.vx; b.y += b.vy;

                // اصطدام الرصاصة باللاعبين
                players.forEach(pl => {
                    if (pl.alive && b.owner !== pl.id) {
                        let dist = Math.hypot(b.x - pl.x, b.y - pl.y);
                        if (dist < pl.radius) {
                            pl.alive = false; // خروج اللاعب المصاب فوراً
                            bullets.splice(bIdx, 1);
                        }
                    }
                });
            });

            // تنظيف الرصاص خارج الشاشة
            bullets = bullets.filter(b => b.x > 0 && b.x < canvas.width && b.y > 0 && b.y < canvas.height);

            // 4. حساب عدد الأحياء والتحقق من الفائز
            let alivePlayers = players.filter(pl => pl.alive);
            document.getElementById('alive-count').textContent = alivePlayers.length;

            if (alivePlayers.length === 1) {
                const winnerBanner = document.getElementById('victory-banner');
                winnerBanner.textContent = `${alivePlayers[0].name} WINS!`;
                winnerBanner.style.display = 'block';
            }
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // رسم الطلقات الليزرية الفضائية
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = b.color;
                ctx.shadowBlur = 15; ctx.shadowColor = b.color;
                ctx.fill();
                ctx.shadowBlur = 0; // إعادة التعيين لعدم تدمير الأداء
            });

            // رسم الـ 7 لاعبين (مركبات دائرية سينمائية موجهة)
            players.forEach(pl => {
                if (!pl.alive) return;

                ctx.save();
                ctx.translate(pl.x, pl.y);
                ctx.rotate(pl.angle);

                // رسم جسم المركبة الفضائية المثلث القتالي
                ctx.beginPath();
                ctx.moveTo(25, 0);
                ctx.lineTo(-15, -15);
                ctx.lineTo(-15, 15);
                ctx.closePath();
                ctx.fillStyle = pl.color;
                ctx.shadowBlur = 20; ctx.shadowColor = pl.color;
                ctx.fill();

                // قمرة القيادة النظيفة
                ctx.beginPath();
                ctx.arc(0, 0, 6, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
                ctx.restore();
                ctx.shadowBlur = 0;

                // رسم اسم اللاعب فوق رأس المركبة الفضائية مباشرة وبشفافية
                ctx.font = 'bold 12px Rajdhani';
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.textAlign = 'center';
                ctx.fillText(pl.name, pl.x, pl.y - 30);
            });
        }

        function mainLoop() {
            updateGame();
            drawGame();
            gameLoopId = requestAnimationFrame(mainLoop);
        }

        launchBtn.addEventListener('click', () => {
            phase3.classList.add('hidden');
            setTimeout(() => {
                phase4.classList.remove('hidden');
                setupGame();
                mainLoop();
            }, 400);
        });
    </script>
</body>
</html>
