<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة لعبة - شاشة التجهيز</title>
    <style>
        /* إعدادات عامة للواجهة (UI) */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #05050a; /* خلفية داكنة جداً */
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* لمنع شريطة التمرير */
        }

        /* خلفية الفضاء: النجوم والكوكب */
        .space-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            display: flex;
            justify-content: center;
            align-items: center;
            /* حركة خلفية النجوم - أبطأ بكثير وأهدأ */
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
            background-repeat: repeat;
            animation: moveStars 60s linear infinite; /* 60 ثانية للدورة الكاملة */
        }

        @keyframes moveStars {
            from { background-position: 0 0; }
            to { background-position: -1000px 500px; }
        }

        /* حركة دوران الكوكب - أهدأ وواقعية */
        .planet {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #4facfe, #00f2fe);
            box-shadow: 0 0 50px rgba(79, 172, 254, 0.5);
            animation: rotatePlanet 120s linear infinite; /* 120 ثانية للدوران الكامل */
        }

        @keyframes rotatePlanet {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* الحاوية الرئيسية (نظام قوائم بلايستيشن) */
        .ui-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            backdrop-filter: blur(5px); /* تأثير ضبابي خفيف */
        }

        .main-panel {
            background-color: rgba(20, 20, 30, 0.85); /* لوحة شبه شفافة */
            border: 1px solid rgba(100, 100, 150, 0.3);
            border-radius: 15px;
            padding: 40px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
        }

        .panel-header {
            font-size: 1.5rem;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            margin-bottom: 25px;
        }

        /* حاوية الأفاتار والإطار */
        .avatar-section {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 30px;
        }

        .avatar-image {
            width: 130px;
            height: 130px;
            border-radius: 10px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 1;
        }

        .frame-image {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: none; /* عشان ما يأثر على الكليك */
        }

        /* الأزرار الخلفية (كانت محجوبة) */
        .hidden-buttons-container {
            margin-bottom: 20px;
        }

        .action-button-mini {
            background-color: transparent;
            color: #00f2fe;
            border: 1px solid #00f2fe;
            padding: 8px 15px;
            font-size: 0.9rem;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 0 5px;
            text-shadow: 0 0 5px #00f2fe;
        }

        .action-button-mini:hover {
            background-color: rgba(0, 242, 254, 0.2);
            box-shadow: 0 0 10px #00f2fe;
        }

        /* حقل إدخال الاسم */
        .name-input {
            width: 80%;
            padding: 12px;
            margin-bottom: 30px;
            background-color: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1.1rem;
            text-align: center;
            border-radius: 5px;
            outline: none;
            transition: border-color 0.3s;
        }

        .name-input:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        /* أزرار الإجراءات الرئيسية */
        .primary-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .main-action-button {
            flex: 1;
            padding: 15px;
            font-size: 1.1rem;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .main-action-button.create {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            border: none;
            box-shadow: 0 0 15px rgba(0, 198, 255, 0.5);
        }

        .main-action-button.create:hover {
            box-shadow: 0 0 25px rgba(0, 198, 255, 0.8);
            transform: translateY(-2px);
        }

        .main-action-button.join {
            background: transparent;
            border: 2px solid #ffffff;
        }

        .main-action-button.join:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div class="space-background">
        <div class="planet"></div>
    </div>

    <div class="ui-container">
        <div class="main-panel">
            <div class="panel-header">تجهيز الملف الشخصي</div>

            <div class="avatar-section">
                <img src="https://i.pinimg.com/736x/21/df/b7/21dfb731dd5da68832c3cb16a49fa7e5.jpg" alt="الأفاتار" class="avatar-image">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Hexagon_border.svg/1024px-Hexagon_border.svg.png" alt="الإطار" class="frame-image">
            </div>

            <div class="hidden-buttons-container">
                <button class="action-button-mini" onclick="alert('تغيير صورة الشخصية...');">تغيير الصورة</button>
                <button class="action-button-mini" onclick="alert('تغيير الإطار...');">تغيير الإطار</button>
            </div>

            <input type="text" class="name-input" placeholder="أدخل اسمك هنا...">

            <div class="primary-actions">
                <button class="main-action-button create" onclick="createRoom();">إنشاء غرفة</button>
                <button class="main-action-button join">انضمام لغرفة</button>
            </div>
        </div>
    </div>

    <script>
        // وظيفة محاكاة إنشاء الغرفة
        function createRoom() {
            // توليد رمز عشوائي للغرفة (محاكاة)
            let roomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
            
            // إظهار نافذة منبثقة (Popup)
            alert("تم إنشاء الغرفة بنجاح!\nكود الغرفة هو: " + roomCode + "\nانتظار انضمام اللاعبين...");
        }
    </script>

</body>
</html>
