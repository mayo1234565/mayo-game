<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة 7 لاعبين - الواجهة الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #100b29;
            --bg-bottom: #2c1b54;
            --ocean-top: #1a2b4c;
            --ocean-bottom: #0a1128;
            --neon-pink: #ff2a6d;
            --neon-cyan: #05d9e8;
            --text-main: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(to bottom, var(--bg-top), var(--bg-bottom));
            height: 100vh;
            overflow: hidden;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ================= الخلفية المتحركة ================= */
        .background-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
        }

        /* القمر */
        .moon {
            position: absolute;
            top: 10%; right: 10%;
            width: 80px; height: 80px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 50px #fff, inset -15px -15px 0 0 rgba(0,0,0,0.1);
        }

        /* النجوم */
        .stars {
            position: absolute;
            width: 100%; height: 60%;
            background: transparent;
            background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 4px);
            background-size: 150px 150px;
            animation: twinkle 4s infinite alternate;
        }

        /* البحر والسفينة */
        .ocean {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 40%;
            background: linear-gradient(to bottom, var(--ocean-top), var(--ocean-bottom));
            border-top: 2px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }

        .ship {
            position: absolute;
            bottom: 60%; left: -100px;
            width: 120px; height: 50px;
            background: #111;
            border-radius: 5px 5px 20px 20px;
            animation: sail 25s linear infinite, bob 3s ease-in-out infinite alternate;
        }
        
        .ship::after {
            content: ''; position: absolute;
            top: -30px; left: 20px;
            width: 30px; height: 30px;
            background: #222;
            box-shadow: 40px 10px 0 #333;
        }

        /* ================= الشاشات ================= */
        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%; max-width: 1000px;
            transition: all 0.5s ease-in-out;
            position: absolute;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.9);
        }

        .active {
            opacity: 1;
            pointer-events: all;
            transform: scale(1);
        }

        /* ================= شاشة البداية ================= */
        .title {
            font-size: 3rem;
            font-weight: 900;
            text-shadow: 0 0 20px var(--neon-cyan);
            margin-bottom: 50px;
            text-align: center;
        }

        .start-btn {
            background: rgba(20, 10, 40, 0.8);
            border: 2px solid var(--neon-pink);
            color: #fff;
            font-size: 2rem;
            font-weight: bold;
            padding: 15px 60px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 15px var(--neon-pink), inset 0 0 15px var(--neon-pink);
            transition: 0.3s;
            text-transform: uppercase;
        }

        .start-btn:hover {
            background: var(--neon-pink);
            box-shadow: 0 0 30px var(--neon-pink);
            transform: scale(1.05);
        }

        /* ================= شاشة اختيار الشخصية ================= */
        .input-name {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 15px;
            font-size: 1.2rem;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 30px;
            width: 300px;
            outline: none;
            transition: 0.3s;
        }

        .input-name:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .section-title {
            margin-bottom: 15px;
            font-size: 1.2rem;
            color: #ccc;
        }

        /* شبكة الأفاتارات والإطارات */
        .grid-container {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .avatar-card, .border-card {
            width: 80px; height: 80px;
            background: rgba(255,255,255,0.05);
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            transition: 0.3s;
        }

        /* تأثيرات التحديد (Hover & Active) */
        .avatar-card:hover, .border-card:hover {
            border-color: rgba(255,255,255,0.5);
            transform: translateY(-5px);
        }

        .avatar-card.selected {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan);
            background: rgba(5, 217, 232, 0.2);
        }

        .border-card.selected {
            border-color: #ffd700;
            box-shadow: 0 0 15px #ffd700;
            background: rgba(255, 215, 0, 0.2);
        }

        /* ================= الأنيميشن (Animations) ================= */
        @keyframes twinkle {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        @keyframes sail {
            0% { left: -150px; }
            100% { left: 110%; }
        }
        @keyframes bob {
            0% { transform: translateY(0); }
            100% { transform: translateY(5px); }
        }

        /* استجابة الجوال */
        @media (max-width: 768px) {
            .avatar-card, .border-card {
                width: 60px; height: 60px; font-size: 1.5rem;
            }
            .title { font-size: 2rem; }
            .start-btn { font-size: 1.5rem; padding: 10px 40px; }
        }
    </style>
</head>
<body>

    <div class="background-container">
        <div class="stars"></div>
        <div class="moon"></div>
        <div class="ocean">
            <div class="ship"></div>
        </div>
    </div>

    <div id="startScreen" class="screen active">
        <h1 class="title">المندس 7<br><span style="font-size: 1.2rem; color: #aaa;">THE 7 INFILTRATORS</span></h1>
        <button class="start-btn" onclick="startGame()">ابدأ</button>
    </div>

    <div id="selectionScreen" class="screen hidden">
        <input type="text" class="input-name" placeholder="أدخل اسمك هنا..." maxlength="12">
        
        <div class="section-title">اختر شخصيتك (الأنمي)</div>
        <div class="grid-container" id="avatarGrid">
            <div class="avatar-card" onclick="selectItem(this, 'avatar')">🥷</div>
            <div class="avatar-card" onclick="selectItem(this, 'avatar')">🧛‍♂️</div>
            <div class="avatar-card" onclick="selectItem(this, 'avatar')">🕵️‍♀️</div>
            <div class="avatar-card" onclick="selectItem(this, 'avatar')">🧙‍♂️</div>
            <div class="avatar-card" onclick="selectItem(this, 'avatar')">🦹‍♀️</div>
            <div class="avatar-card" onclick="selectItem(this, 'avatar')">🧟‍♂️</div>
            <div class="avatar-card" onclick="selectItem(this, 'avatar')">🧑‍🎤</div>
        </div>

        <div class="section-title">اختر إطار المستوى (Border)</div>
        <div class="grid-container" id="borderGrid">
            <div class="border-card" onclick="selectItem(this, 'border')">🥇</div>
            <div class="border-card" onclick="selectItem(this, 'border')">🥈</div>
            <div class="border-card" onclick="selectItem(this, 'border')">🥉</div>
            <div class="border-card" onclick="selectItem(this, 'border')">💎</div>
            <div class="border-card" onclick="selectItem(this, 'border')">🔥</div>
        </div>
        
        <button class="start-btn" style="font-size: 1.2rem; padding: 10px 30px; margin-top: 20px;">تأكيد الدخول</button>
    </div>

    <script>
        // وظيفة الانتقال من شاشة البداية إلى شاشة الاختيار
        function startGame() {
            document.getElementById('startScreen').classList.remove('active');
            document.getElementById('startScreen').classList.add('hidden');
            
            setTimeout(() => {
                document.getElementById('selectionScreen').classList.remove('hidden');
                document.getElementById('selectionScreen').classList.add('active');
            }, 300); // تأخير بسيط لضمان سلاسة الانتقال
        }

        // وظيفة اختيار الأفاتار أو الإطار
        function selectItem(element, type) {
            // تحديد الـ Container بناءً على النوع (أفاتار أو إطار)
            let containerId = type === 'avatar' ? 'avatarGrid' : 'borderGrid';
            let container = document.getElementById(containerId);
            
            // إزالة كلاس "selected" من جميع العناصر داخل نفس المجموعة
            let cards = container.getElementsByClassName(type + '-card');
            for(let i = 0; i < cards.length; i++) {
                cards[i].classList.remove('selected');
            }
            
            // إضافة كلاس "selected" للعنصر الذي تم الضغط عليه
            element.classList.add('selected');
        }
    </script>
</body>
</html>
