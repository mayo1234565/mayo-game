<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة اللعبة الصافية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Changa:wght@400;700&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #020202; /* خلفية سوداء داكنة */
            color: white;
            font-family: 'Changa', sans-serif;
            overflow: hidden;
        }

        /* خلفية النجوم الهادئة جداً */
        .stars-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat top center;
            z-index: 0;
            animation: moveStars 200s linear infinite; 
        }

        @keyframes moveStars {
            from { background-position: 0 0; }
            to { background-position: -2000px 1000px; }
        }

        /* الكوكب يدور ببطء في الزاوية */
        .planet {
            position: absolute;
            top: 15%;
            left: 10%;
            width: 130px;
            height: 130px;
            background: radial-gradient(circle at 30% 30%, #252535, #000000);
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(40, 40, 60, 0.4);
            z-index: 1;
            animation: rotatePlanet 120s linear infinite;
        }

        @keyframes rotatePlanet {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* الشاشات */
        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.6s ease;
        }

        #setup-screen {
            display: none;
            opacity: 0;
            flex-direction: column;
        }

        /* زر البداية بستايل بكسل فن الكسل */
        .start-btn {
            background-color: transparent;
            color: #fff;
            border: 4px solid #fff;
            padding: 15px 60px;
            font-size: 2.8rem;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 5px 5px 0px #e60039;
            text-shadow: 2px 2px 0px #e60039;
            transition: all 0.2s;
            z-index: 2;
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 7px 7px 0px #e60039;
        }

        /* ❌ تم حذف المربع المستطيل المزعج بالكامل ❌ */
        /* الواجهة الآن عبارة عن عناصر عائمة مباشرة فوق الفضاء */
        .clean-ui-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 600px;
            z-index: 5;
        }

        /* حاوية الأفاتار والإطار بنظام أوفرواتش */
        .avatar-container {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 5px;
        }

        /* صورة أنمي العيون الحمراء اللي أرسلتها لي */
        .anime-avatar {
            width: 115px;
            height: 115px;
            border-radius: 8px;
            object-fit: cover;
            z-index: 1;
        }

        /* الإطار العلوي الذي يتغير مكانه حسب اختيارك */
        .overwatch-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 240px;
            height: 240px;
            background-image: url('https://preview.redd.it/give-us-back-this-right-now-ranks-and-level-portraits-v0-t9ciyfkjjl5d1.png?width=1080&crop=smart&auto=webp&s=87204f0525d8869b2d07519ba2a3286377777d13');
            background-size: 730% auto; /* تكبير دقيق للاقتصاص */
            background-position: 81.3% center; /* الافتراضي: ياقوتي Ruby */
            mix-blend-mode: screen; /* مسح الخلفية السوداء للإطار ليصبح شفافاً */
            z-index: 2;
            pointer-events: none;
            transition: background-position 0.2s ease;
        }

        /* حقل الاسم الصافي (خط ناعم فقط بالهواء) */
        .name-input {
            width: 60%;
            padding: 10px;
            margin: 20px 0 30px 0;
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-family: 'Changa', sans-serif;
            font-size: 1.8rem;
            text-align: center;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .name-input:focus {
            border-bottom: 2px solid #e60039;
            text-shadow: 0 0 10px rgba(230, 0, 57, 0.5);
        }

        /* شريط اختيار الإطارات السفلي (الألبوم المفتوح) */
        .frames-gallery {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
            width: 100%;
        }

        .gallery-item {
            width: 65px;
            height: 65px;
            background-image: url('https://preview.redd.it/give-us-back-this-right-now-ranks-and-level-portraits-v0-t9ciyfkjjl5d1.png?width=1080&crop=smart&auto=webp&s=87204f0525d8869b2d07519ba2a3286377777d13');
            background-size: 730% auto;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .gallery-item:hover {
            border-color: #e60039;
            transform: scale(1.1);
            box-shadow: 0 0 10px #e60039;
        }

        /* إحداثيات قص كل إطار من الصورة الأصلية */
        .g-bronze { background-position: 2.5% center; }
        .g-silver { background-position: 18.3% center; }
        .g-gold { background-position: 34.2% center; }
        .g-platinum { background-position: 49.9% center; }
        .g-diamond { background-position: 65.6% center; }
        .g-ruby { background-position: 81.3% center; }
        .g-solar { background-position: 97.1% center; }

        /* أزرار الغرف السفلية */
        .room-buttons {
            display: flex;
            gap: 20px;
            width: 80%;
            max-width: 400px;
        }

        .btn-game {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 14px 20px;
            font-size: 1.2rem;
            font-family: 'Changa', sans-serif;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
        }

        .btn-game:hover {
            background: #e60039;
            border-color: #e60039;
            box-shadow: 0 0 20px rgba(230, 0, 57, 0.6);
            transform: translateY(-2px);
        }

        /* نافذة كود الغرفة (تظهر بالمنتصف عند الإنشاء) */
        .room-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 15, 0.95);
            border: 2px solid #e60039;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            z-index: 100;
            box-shadow: 0 0 35px rgba(230, 0, 57, 0.5);
        }
    </style>
</head>
<body>

    <div class="stars-bg"></div>

    <div id="start-screen" class="screen">
        <div class="planet"></div>
        <button class="start-btn" onclick="goToSetup()">ابــــدأ</button>
    </div>

    <div id="setup-screen" class="screen">
        <div class="clean-ui-container">
            
            <div class="avatar-container">
                <img src="https://preview.redd.it/dark-anime-pictures-iwmu3b0sun9r6789.png?width=1080&crop=smart&auto=webp&s=ef92080f5898835080072049e6f212f45ec7d498" alt="Anime Avatar" class="anime-avatar">
                <div id="mainFrame" class="overwatch-frame"></div>
            </div>

            <input type="text" class="name-input" placeholder="اسمك...">

            <div class="frames-gallery">
                <div class="gallery-item g-bronze" title="برونزي" onclick="updateFrame('2.5%')"></div>
                <div class="gallery-item g-silver" title="فضي" onclick="updateFrame('18.3%')"></div>
                <div class="gallery-item g-gold" title="ذهبي" onclick="updateFrame('34.2%')"></div>
                <div class="gallery-item g-platinum" title="بلاتينيوم" onclick="updateFrame('49.9%')"></div>
                <div class="gallery-item g-diamond" title="دايموند" onclick="updateFrame('65.6%')"></div>
                <div class="gallery-item g-ruby" title="ياقوتي" onclick="updateFrame('81.3%')"></div>
                <div class="gallery-item g-solar" title="سولار" onclick="updateFrame('97.1%')"></div>
            </div>

            <div class="room-buttons">
                <button class="btn-game" onclick="generateRoom()">إنشاء غرفة</button>
                <button class="btn-game" onclick="alert('جاري البحث عن غرف...')">انضمام لغرفة</button>
            </div>

        </div>
    </div>

    <div id="popup" class="room-popup">
        <h3 style="margin-top:0;">🔥 تم تجهيز الغرفة!</h3>
        <p style="font-size: 1.8rem; color: #e60039; font-weight: bold; margin: 10px 0;">CODE: <span id="codeDisplay">000000</span></p>
        <p style="color: #aaa; font-size: 0.9rem;">أعطِ هذا الكود لأخوياك ليدخلوا معك فوراً</p>
        <button class="btn-game" style="padding: 5px 15px; font-size: 1rem;" onclick="closePopup()">إغلاق</button>
    </div>

    <script>
        // تنقل سلس بين الشاشات
        function goToSetup() {
            document.getElementById('start-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('setup-screen').style.display = 'flex';
                setTimeout(() => {
                    document.getElementById('setup-screen').style.opacity = '1';
                }, 50);
            }, 600);
        }

        // دالة تغيير الإطار فورياً عند الضغط على الألبوم بالأسفل
        function updateFrame(positionPercent) {
            document.getElementById('mainFrame').style.backgroundPosition = positionPercent + " center";
        }

        // إنشاء الغرفة وإظهار الكود العشوائي
        function generateRoom() {
            const randomCode = Math.floor(100000 + Math.random() * 900000);
            document.getElementById('codeDisplay').innerText = randomCode;
            document.getElementById('popup').style.display = 'block';
        }

        function closePopup() {
            document.getElementById('popup').style.display = 'none';
        }
    </script>

</body>
</html>
