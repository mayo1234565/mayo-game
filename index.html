<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الدب الغاضب 🧸🔫</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #e6f0ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* فقاعة الكلام */
        .speech-bubble {
            background: white;
            border: 4px solid #141414;
            border-radius: 20px;
            padding: 15px 30px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            max-width: 400px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            direction: rtl;
        }

        .speech-bubble.angry {
            background: #ffe6e6;
            border-color: #dc143c;
            color: #dc143c;
            transform: scale(1.05);
        }

        /* مسرح اللعبة (الدب) */
        .game-container {
            position: relative;
            width: 400px;
            height: 450px;
            cursor: pointer;
        }

        /* جسم الدب الرئيسي */
        .teddy {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .body {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 250px;
            background: #82461e;
            border-radius: 50% 50% 40% 40%;
        }

        /* الأذنين */
        .ear {
            position: absolute;
            width: 80px;
            height: 80px;
            background: #82461e;
            border-radius: 50%;
            top: 40px;
        }
        .ear.left { left: 40px; }
        .ear.right { right: 40px; }
        .ear::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            background: #f2d4a9;
            border-radius: 50%;
            top: 20px;
            left: 20px;
        }

        /* الرأس والملمس */
        .head {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 240px;
            background: #82461e;
            border-radius: 50%;
            z-index: 2;
        }

        /* الشماغ الأزرق التكتيكي */
        .keffiyeh {
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 285px;
            height: 80px;
            background: repeating-linear-gradient(45deg, #0f5282, #0f5282 10px, #052846 10px, #052846 20px);
            border-radius: 140px 140px 20px 20px;
            z-index: 3;
        }

        /* العيون */
        .eye {
            position: absolute;
            top: 100px;
            width: 24px;
            height: 24px;
            background: #141414;
            border-radius: 50%;
            z-index: 4;
            transition: all 0.2s ease;
        }
        .eye.left { left: 65px; }
        .eye.right { right: 65px; }
        .eye::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            top: 4px;
            left: 4px;
        }

        /* الحواجب الغاضبة مخفية بالبداية */
        .brow {
            position: absolute;
            top: 85px;
            width: 40px;
            height: 8px;
            background: #141414;
            z-index: 5;
            opacity: 0;
            transition: all 0.2s ease;
        }
        .brow.left { left: 55px; transform: rotate(0deg); }
        .brow.right { right: 55px; transform: rotate(0deg); }

        /* منطقة الأنف والفم الكبيرة */
        .muzzle {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 100px;
            background: #f2d4a9;
            border-radius: 50%;
            z-index: 4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .nose {
            width: 60px;
            height: 38px;
            background: #141414;
            border-radius: 50%;
            margin-top: -10px;
        }

        /* الفم */
        .mouth {
            width: 60px;
            height: 25px;
            border-bottom: 4px solid #141414;
            border-radius: 0 0 30px 30px;
            margin-top: 5px;
            transition: all 0.2s ease;
        }

        /* اليد المرفوعة للسلام */
        .hand-wave {
            position: absolute;
            right: 20px;
            top: 220px;
            width: 70px;
            height: 70px;
            background: #82461e;
            border-radius: 50%;
            z-index: 3;
            transform-origin: bottom center;
            animation: wave 1.5s infinite ease-in-out;
            display: block;
        }

        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(20deg); }
        }

        /* 🔫 المسدس المخفي */
        .gun-hand {
            position: absolute;
            left: -20px;
            bottom: 80px;
            width: 80px;
            height: 80px;
            background: #82461e;
            border-radius: 50%;
            z-index: 6;
            opacity: 0;
            transform: scale(0) rotate(45deg);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* تصميم شكل المسدس */
        .gun {
            position: absolute;
            top: -20px;
            left: -30px;
            width: 80px;
            height: 25px;
            background: #4a4a4a;
            border-radius: 5px;
            transform: rotate(-15deg);
        }
        .gun::after {
            content: '';
            position: absolute;
            right: 10px;
            top: 20px;
            width: 25px;
            height: 45px;
            background: #2b2b2b;
            border-radius: 5px;
        }

        /* 😡 حالة الغضب العارم عند اللمس */
        .game-container.is-angry .eye {
            background: #dc143c;
            transform: scaleY(0.7);
        }
        .game-container.is-angry .eye::after { display: none; }
        
        .game-container.is-angry .brow.left { opacity: 1; transform: rotate(25deg); top: 92px; }
        .game-container.is-angry .brow.right { opacity: 1; transform: rotate(-25deg); top: 92px; }

        .game-container.is-angry .mouth {
            border-bottom: none;
            border-top: 4px solid #141414;
            border-radius: 30px 30px 0 0;
            margin-top: 15px;
        }

        .game-container.is-angry .hand-wave {
            display: none;
        }

        .game-container.is-angry .gun-hand {
            opacity: 1;
            transform: scale(1.2) rotate(0deg);
        }

        /* نص توضيحي بالأسفل */
        .hint {
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="speech-bubble" id="quote">أهلاً بك يا صديقي! أنا الدب المتكلم، سعيد برؤيتك 👋</div>

    <div class="game-container" id="teddy-game">
        <div class="teddy">
            <div class="ear left"></div>
            <div class="ear right"></div>
            
            <div class="body"></div>
            
            <div class="head">
                <div class="keffiyeh"></div> <div class="brow left"></div>
                <div class="brow right"></div>
                <div class="eye left"></div>
                <div class="eye right"></div>
                
                <div class="muzzle">
                    <div class="nose"></div>
                    <div class="mouth"></div>
                </div>
            </div>

            <div class="hand-wave"></div>

            <div class="gun-hand">
                <div class="gun"></div>
            </div>
        </div>
    </div>

    <div class="hint">انقر/المس الدب لترى ماذا سيحدث!</div>

    <script>
        const gameContainer = document.getElementById('teddy-game');
        const quoteBox = document.getElementById('quote');

        // مصفوفة من العبارات العشوائية عند التهديد
        const angryQuotes = [
            "لقد حذرتك! لا تلمسني! 😡🔫",
            "ابتعد عني وإلا أطلقت النار! 🤬",
            "ألم أقل لك لا تلمس وجهي الشريف؟! 💥",
            "ستواجه العواقب الآن! خذ هذه! 💀"
        ];

        // عند الضغط على الدب (اللمس)
        gameContainer.addEventListener('mousedown', () => {
            gameContainer.classList.add('is-angry');
            quoteBox.classList.add('angry');
            
            // اختيار عبارة غاضبة عشوائية
            const randomQuote = angryQuotes[Math.floor(Math.random() * angryQuotes.length)];
            quoteBox.innerText = randomQuote;
        });

        // عند رفع الإصبع أو الماوس (يرجع طبيعي)
        window.addEventListener('mouseup', () => {
            if(gameContainer.classList.contains('is-angry')) {
                gameContainer.classList.remove('is-angry');
                quoteBox.classList.remove('angry');
                quoteBox.innerText = "أهلاً بك يا صديقي! أنا الدب المتكلم، سعيد برؤيتك 👋";
            }
        });

        // لدعم شاشات الجوال باللمس الفعلي (Touch)
        gameContainer.addEventListener('touchstart', (e) => {
            e.preventDefault();
            gameContainer.classList.add('is-angry');
            quoteBox.classList.add('angry');
            const randomQuote = angryQuotes[Math.floor(Math.random() * angryQuotes.length)];
            quoteBox.innerText = randomQuote;
        });

        window.addEventListener('touchend', () => {
            if(gameContainer.classList.contains('is-angry')) {
                gameContainer.classList.remove('is-angry');
                quoteBox.classList.remove('angry');
                quoteBox.innerText = "أهلاً بك يا صديقي! أنا الدب المتكلم، سعيد برؤيتك 👋";
            }
        });
    </script>
</body>
</html>
