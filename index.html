<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عكس المافيا: سفينة الظلام</title>
    <!-- استدعاء خط البكسل -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-bg: #050510;
            --text-color: #e0e0e0;
            --accent: #8b0000; /* أحمر داكن للمافيا */
        }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'VT323', monospace; /* تطبيق خط البكسل */
            color: var(--text-color);
            overflow: hidden;
            background-color: var(--main-bg);
        }

        /* --- الأنيميشن والخلفية المتحركة --- */
        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(to bottom, #020205 0%, #0a0a2a 60%, #000000 100%);
        }

        /* مؤثر البرق */
        .lightning {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0);
            animation: flash 7s infinite;
            z-index: 0;
        }

        @keyframes flash {
            0%, 95%, 98%, 100% { background-color: rgba(255, 255, 255, 0); }
            96%, 99% { background-color: rgba(255, 255, 255, 0.4); }
        }

        /* السفينة */
        .ship {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 350px;
            height: 200px;
            /* رسم بكسل مبسط للسفينة باستخدام SVG مدمج */
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 50"><path d="M10,40 L90,40 L80,50 L20,50 Z" fill="%23222"/><rect x="40" y="10" width="20" height="30" fill="%23111"/><circle cx="50" cy="25" r="3" fill="%238b0000"/></svg>') no-repeat center center;
            background-size: contain;
            animation: bobbing 4s ease-in-out infinite alternate;
            z-index: 1;
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.9));
        }

        @keyframes bobbing {
            0% { bottom: 18%; transform: translateX(-50%) rotate(-3deg); }
            100% { bottom: 22%; transform: translateX(-50%) rotate(3deg); }
        }

        /* أمواج البحر الأسود */
        .sea {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 25%;
            background: linear-gradient(to bottom, #000000 0%, #050510 100%);
            border-top: 2px solid rgba(255,255,255,0.05);
            z-index: 2;
            animation: waves 2s infinite alternate;
        }

        @keyframes waves {
            0% { height: 23%; }
            100% { height: 27%; }
        }

        /* --- واجهة المستخدم (UI) --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* البار العلوي */
        #top-bar {
            display: none; /* مخفي حتى تبدأ اللعبة */
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 10px 30px;
            border-bottom: 3px solid var(--accent);
            font-size: 28px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar-display {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            border: 2px solid var(--accent);
            background-color: #333;
            background-size: cover;
            background-position: center;
        }

        /* القائمة الرئيسية */
        #main-menu {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(2px);
        }

        .menu-box {
            background: rgba(10, 10, 15, 0.95);
            padding: 40px;
            border: 4px solid #222;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.5);
            text-align: center;
            width: 450px;
        }

        h1 {
            color: var(--accent);
            font-size: 56px;
            margin-bottom: 5px;
            margin-top: 0;
            text-shadow: 3px 3px 0px #000;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: right;
        }

        label {
            display: block;
            font-size: 24px;
            margin-bottom: 8px;
            color: #aaa;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            background: #0a0a0a;
            border: 2px solid #444;
            color: #fff;
            font-family: 'VT323', monospace;
            font-size: 22px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent);
        }

        button {
            background: var(--accent);
            color: #fff;
            border: 2px solid #fff;
            padding: 15px 20px;
            font-family: 'VT323', monospace;
            font-size: 32px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            margin-top: 15px;
            text-transform: uppercase;
        }

        button:hover {
            background: #ff0000;
            box-shadow: 0 0 15px #ff0000;
            transform: scale(1.02);
        }

        /* ساحة اللعبة */
        #game-area {
            display: none;
            flex: 1;
            padding: 30px;
            text-align: center;
        }
        
        .role-reveal {
            margin-top: 80px;
            font-size: 36px;
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border: 2px solid var(--accent);
            display: inline-block;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- الخلفية المتحركة -->
    <div class="background-container">
        <div class="lightning"></div>
        <div class="ship"></div>
        <div class="sea"></div>
    </div>

    <div class="ui-layer">
        <!-- البار العلوي (تظهر بعد تسجيل الدخول) -->
        <div id="top-bar">
            <div class="player-info">
                <div id="display-avatar" class="avatar-display"></div>
                <div>
                    <span id="display-name" style="color: #fff;">الاسم</span>
                    <br>
                    <span style="font-size: 22px; color: gold;">المستوى (LVL): <span id="display-level">1</span></span>
                </div>
            </div>
            <div>
                <!-- زر محاكاة الفوز لاختبار نظام التلفيل -->
                <button onclick="winGame()" style="font-size: 20px; padding: 8px 15px; width: auto; margin:0; background: #228b22; border-color:#fff;">تجربة الفوز (+1)</button>
            </div>
        </div>

        <!-- القائمة الرئيسية -->
        <div id="main-menu">
            <div class="menu-box">
                <h1>عكس المافيا</h1>
                <p style="font-size: 22px; color: #888; margin-bottom: 30px;">سفينة الظلام: الجميع مذنب.. إلا من رحم ربي</p>
                
                <div class="form-group">
                    <label>الاسم المستعار:</label>
                    <input type="text" id="player-name" placeholder="أدخل اسمك هنا...">
                </div>

                <div class="form-group">
                    <label>رابط الصورة الشخصية (اختياري):</label>
                    <input type="text" id="player-avatar" placeholder="https://example.com/image.png">
                </div>

                <div class="form-group">
                    <label>شكل الكارد (البطاقة):</label>
                    <select id="player-card">
                        <option value="classic">كلاسيكي</option>
                        <option value="bloody">ملطخ بالدماء (احترافي)</option>
                        <option value="shadow">ظلام دامس</option>
                    </select>
                </div>

                <button onclick="startGame()">دخول اللعبة</button>
            </div>
        </div>

        <!-- ساحة اللعبة -->
        <div id="game-area">
            <div class="role-reveal">
                <h2 style="color: var(--accent); margin-top: 0;">تم دخول السفينة!</h2>
                <p id="game-status">جاري البحث عن لاعبين وتوزيع الأدوار...</p>
            </div>
        </div>
    </div>

    <script>
        // نظام المستويات: يجلب المستوى الحالي من المتصفح، أو يجعله 1 إذا كانت أول مرة
        let playerLevel = localStorage.getItem('mafia_level') || 1;

        function startGame() {
            // أخذ البيانات من الحقول
            const name = document.getElementById('player-name').value || "مجهول";
            const avatar = document.getElementById('player-avatar').value || "https://i.imgur.com/KzQ3f74.png"; // صورة افتراضية

            // تحديث البار العلوي بالبيانات
            document.getElementById('display-name').innerText = name;
            document.getElementById('display-avatar').style.backgroundImage = `url('${avatar}')`;
            document.getElementById('display-level').innerText = playerLevel;

            // إخفاء القائمة وإظهار البار العلوي وساحة اللعب
            document.getElementById('main-menu').style.display = "none";
            document.getElementById('top-bar').style.display = "flex";
            document.getElementById('game-area').style.display = "block";

            // محاكاة توزيع الأدوار
            setTimeout(() => {
                document.getElementById('game-status').innerHTML = `
                    <span style="color:#ff4444">أنت: محقق (مافيا)</span><br>
                    <span style="font-size:24px; color:#ccc;">الهدف: ابحث عن الـ 2 الأبرياء واقتلهم.<br> 
                    تحذير: إذا تم قتل 3 من المافيا ستخسرون جميعاً!</span>
                `;
            }, 3000);
        }

        // دالة لزيادة المستوى عند الفوز
        function winGame() {
            playerLevel++; // زيادة المستوى
            localStorage.setItem('mafia_level', playerLevel); // حفظه في المتصفح
            document.getElementById('display-level').innerText = playerLevel; // تحديث الرقم في الشاشة
            
            // تأثير بصري بسيط عند الفوز
            document.body.style.backgroundColor = "gold";
            setTimeout(() => {
                document.body.style.backgroundColor = "var(--main-bg)";
            }, 200);
        }
    </script>
</body>
</html>
