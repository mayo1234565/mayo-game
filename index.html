<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة اختيار البطل</title>
    <style>
        /* إعدادات الشاشة الأساسية لجوال ايفون وأندرويد */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 1. فضاء أسود داكن مع كواكب ونجوم تتحرك فعلياً */
        .space-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: radial-gradient(circle at center, #080810 0%, #000000 100%);
            overflow: hidden;
        }

        /* تأثير النجوم المتحركة ببطء */
        .stars-layer {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 150px 250px, #aaa, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 300px 80px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            top: -50%;
            left: -50%;
            animation: spaceSlowScroll 35s infinite linear;
            opacity: 0.4;
        }

        /* كواكب مظلمة تدور في مدارها خلف الواجهة */
        .dark-planet {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #101118, #000000 80%);
            box-shadow: inset -15px -15px 30px rgba(0,0,0,0.9);
            opacity: 0.6;
            animation: planetOrbit 60s infinite linear;
        }

        .planet-top { width: 140px; height: 140px; top: 10%; left: -40px; }
        .planet-bottom { width: 180px; height: 180px; bottom: 8%; right: -50px; animation-duration: 90s; }

        @keyframes spaceSlowScroll {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes planetOrbit {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(180deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }

        /* حاوية الجوال */
        .game-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 820px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .hidden { display: none !important; opacity: 0; transform: scale(0.95); }

        /* زر ابدأ الفخم والغامق */
        .btn-start {
            background: linear-gradient(135deg, #14151b 0%, #07080a 100%);
            color: #c5c9d6;
            border: 2px solid #2c2f3d;
            padding: 16px 55px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            transition: all 0.3s;
        }

        .btn-start:hover {
            border-color: #801a1a;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(128, 26, 26, 0.4);
        }

        /* صندوق الإعدادات واختيار الشخصية */
        .setup-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 30px;
            align-items: center;
        }

        .ui-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .ui-group label {
            font-size: 15px;
            color: #798094;
            letter-spacing: 1px;
        }

        /* خانة إدخال الاسم المظلمة */
        .dark-input {
            width: 85%;
            padding: 14px;
            background-color: rgba(5, 6, 10, 0.85);
            border: 1px solid #1c1e26;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            text-align: center;
            transition: border-color 0.3s;
        }
        .dark-input:focus { border-color: #611818; }

        /* منطقة الأفتار المتداخل مع الإطار الأصلي */
        .avatar-display-zone {
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* صورة الأنمي بالأسفل */
        .anime-avatar-holder {
            position: absolute;
            width: 110px;
            height: 110px;
            z-index: 2;
            border-radius: 12px;
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.9);
            transition: background-image 0.3s ease;
        }

        /* الإطار الحقيقي المأخوذ مباشرة من صورتك */
        .exact-rank-frame {
            position: absolute;
            width: 240px;
            height: 90px; /* الارتفاع المتناسق مع أبعاد الصورة الاصلية */
            z-index: 3;
            background-image: url('give-us-back-this-right-now-ranks-and-level-portraits-v0-t9ciyfkjjl5d1.webp');
            background-repeat: no-repeat;
            pointer-events: none;
            transform: scale(2.2); /* تكبير الإطار ليتناسب مع الصورة */
            transition: background-position 0.1s ease;
        }

        /* أزرار التحكم في تغيير الصور والإطارات */
        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 85%;
            margin-top: 5px;
        }

        .nav-btn {
            background: #090a0e;
            border: 1px solid #1c1e24;
            color: #a0a5b5;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .nav-btn:hover { border-color: #444; color: #fff; }

        .status-text {
            font-size: 14px;
            color: #8e95a8;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="space-bg">
        <div class="stars-layer"></div>
        <div class="dark-planet planet-top"></div>
        <div class="dark-planet planet-bottom"></div>
    </div>

    <div class="game-wrapper">
        
        <div id="startScreen" class="screen">
            <button class="btn-start" onclick="enterSetup()">ابدأ</button>
        </div>

        <div id="setupScreen" class="screen hidden">
            <div class="setup-container">
                
                <div class="ui-group">
                    <label>اسـم الـبـطـل</label>
                    <input type="text" id="heroName" class="dark-input" placeholder="أدخل اسمك الحركي..." maxlength="12">
                </div>

                <div class="ui-group">
                    <label>تخصيص الهوية والرتبة</label>
                    <div class="avatar-display-zone">
                        <div id="animeAvatar" class="anime-avatar-holder"></div>
                        <div id="rankFrame" class="exact-rank-frame"></div>
                    </div>
                </div>

                <div class="control-row">
                    <button class="nav-btn" onclick="changeCharacter(-1)">&gt;</button>
                    <span id="rankLabel" class="status-text">الرتبة: Bronze</span>
                    <button class="nav-btn" onclick="changeCharacter(1)">&lt;</button>
                </div>

            </div>
        </div>

    </div>

    <script>
        // إعدادات الصور والإطارات المأخوذة من ملفاتك مباشرة
        // الإحداثيات (bgPosition) تقص الإطار المطلوب من صورتك بدقة دون الحاجة لقصها يدوياً بالفوتوشوب!
        const itemsConfig = [
            { name: "Bronze", bgPosition: "0px 0px", img: "dark-anime-pictures-iwmu3b0sun9r6789.webp" },
            { name: "Silver", bgPosition: "-142px 0px", img: "dark-anime-pictures-iwmu3b0sun9r6789.webp" },
            { name: "Gold", bgPosition: "-285px 0px", img: "dark-anime-pictures-iwmu3b0sun9r6789.webp" },
            { name: "Platinum / Gold", bgPosition: "-427px 0px", img: "dark-anime-pictures-iwmu3b0sun9r6789.webp" },
            { name: "Diamond / Gold", bgPosition: "-570px 0px", img: "dark-anime-pictures-iwmu3b0sun9r6789.webp" },
            { name: "Ruby / Gold", bgPosition: "-712px 0px", img: "dark-anime-pictures-iwmu3b0sun9r6789.webp" },
            { name: "Solar", bgPosition: "-855px 0px", img: "dark-anime-pictures-iwmu3b0sun9r6789.webp" }
        ];

        let currentIndex = 0;

        function enterSetup() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('setupScreen').classList.remove('hidden');
            renderSelection();
        }

        function renderSelection() {
            const current = itemsConfig[currentIndex];
            
            // تحديث الإطار الأصلي عبر تحريك الـ Sprite Sheet بناءً على الرتبة المحددة
            const frameElement = document.getElementById('rankFrame');
            frameElement.style.backgroundPosition = current.bgPosition;
            
            // تحديث صورة الأنمي (هنا تستخدم الصورة التي أرسلتها، ويمكنك إضافة روابط صور أخرى في مصفوفة img)
            document.getElementById('animeAvatar').style.backgroundImage = `url('${current.img}')`;
            
            // تحديث اسم الرتبة في الأسفل
            document.getElementById('rankLabel').innerText = `الرتبة: ${current.name}`;
        }

        function changeCharacter(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = itemsConfig.length - 1;
            if (currentIndex >= itemsConfig.length) currentIndex = 0;
            renderSelection();
        }

        // تشغيل التهيئة التلقائية للصور عند تحميل الصفحة
        window.onload = renderSelection;
    </script>
</body>
</html>
