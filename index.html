<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Mayo Bet - احترافية المراهنة</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Cairo', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; }
        
        /* طاولة 3D */
        .table-container { 
            width: 800px; height: 400px; background: #34495e; margin-top: 100px;
            transform: perspective(1000px) rotateX(40deg); border-radius: 50px;
            display: flex; justify-content: space-around; align-items: center;
            border: 15px solid #2c3e50; box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            position: relative;
        }

        .bet-box { width: 200px; height: 250px; background: #2c3e50; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* شخصيات اللاعبين (ستايل سوني) */
        .player-3d { width: 80px; height: 120px; background: #95a5a6; border-radius: 10px; position: absolute; transition: 0.5s; box-shadow: 5px 5px 15px rgba(0,0,0,0.5); }
        .player-3d::after { content: '👤'; font-size: 40px; }

        /* التحكم */
        .controls { background: #333; padding: 20px; border-radius: 20px; margin-top: 50px; display: flex; gap: 20px; }
        .bet-btn { background: #e67e22; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; color: white; }
    </style>
</head>
<body>

    <div id="lobby">
        <h1>Mayo Bet 🎮</h1>
        <button onclick="join('host')">المقدم</button>
        <button onclick="join('player')">متسابق</button>
    </div>

    <div id="game" style="display:none; width: 100%; text-align: center;">
        <h2 id="q">السؤال: ما هي عاصمة السعودية؟</h2>
        
        <div class="table-container">
            <div class="bet-box" id="box1">الرياض<div class="bet-amount">0$</div></div>
            <div class="bet-box" id="box2">جدة<div class="bet-amount">0$</div></div>
            <div class="bet-box" id="box3">مكة<div class="bet-amount">0$</div></div>
            
            <div class="player-3d" id="p1" style="left: 100px; bottom: 50px;"></div>
            <div class="player-3d" id="p2" style="left: 400px; bottom: 50px;"></div>
        </div>

        <div id="host-controls" style="display:none;">
            <button onclick="revealAnswer()">إظهار النتيجة</button>
            <button onclick="nextQuestion()">السؤال التالي</button>
        </div>

        <div class="controls">
            <button class="bet-btn" onclick="changeBet(-500)">-500</button>
            <span id="my-bet">رهانك: 0$</span>
            <button class="bet-btn" onclick="changeBet(500)">+500</button>
        </div>
    </div>

    <script>
        let myBet = 0;
        let isHost = false;

        function join(role) {
            isHost = (role === 'host');
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            if(isHost) document.getElementById('host-controls').style.display = 'block';
        }

        function changeBet(amount) {
            myBet = Math.max(0, myBet + amount);
            document.getElementById('my-bet').innerText = "رهانك: " + myBet + "$";
        }

        function revealAnswer() {
            alert("النتيجة: الرياض هي الصح! من أخطأ خسر رهانه.");
        }

        function nextQuestion() {
            document.getElementById('q').innerText = "السؤال التالي: كم عدد أضلاع المثلث؟";
        }

        // تحريك شخصيتك بالأسهم
        let pos = 100;
        document.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowRight') pos += 50;
            if(e.key === 'ArrowLeft') pos -= 50;
            document.getElementById('p1').style.left = pos + 'px';
        });
    </script>
</body>
</html>
