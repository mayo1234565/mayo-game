<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أساتميرامين 7 - The 7 Infiltrators</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap');

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #0f0c29;
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            font-family: 'Tajawal', sans-serif;
            color: white;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- خلفية النجوم المتحركة --- */
        .stars {
            position: absolute;
            top: 0; left: 0; width: 200%; height: 100%;
            background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
            animation: moveStars 50s linear infinite;
            z-index: 0;
            opacity: 0.5;
        }

        @keyframes moveStars {
            from { background-position: 0 0; }
            to { background-position: -1000px 1000px; }
        }

        /* --- حاوية الواجهة --- */
        .ui-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            height: 100%;
            width: 100%;
            max-width: 800px;
        }

        /* --- العنوان --- */
        .title-box { text-align: center; }
        .main-title {
            font-size: 50px;
            margin: 0;
            color: #d1b3ff;
            text-shadow: 0 0 15px #b589d6, 0 0 30px #b589d6;
        }
        .sub-title {
            font-size: 20px;
            letter-spacing: 5px;
            margin-top: 5px;
            color: #a3a3a3;
        }

        /* --- الأزرار --- */
        .start-btn {
            background: linear-gradient(180deg, #8a0000, #5a0000);
            color: white;
            border: 2px solid #ff4d4d;
            border-radius: 12px;
            padding: 15px 80px;
            font-size: 30px;
            font-weight: 800;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6), inset 0 0 10px rgba(255, 100, 100, 0.5);
            transition: all 0.3s ease;
        }
        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.9), inset 0 0 15px rgba(255, 100, 100, 0.8);
            background: linear-gradient(180deg, #a30000, #6e0000);
        }
        .small-btns {
            display: flex; gap: 15px; margin-top: 20px; justify-content: center;
        }
        .small-btn {
            background: rgba(255,255,255,0.1);
            color: #ddd;
            border: 1px solid #777;
            padding: 8px 30px;
            border-radius: 8px;
            font-family: inherit; font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .small-btn:hover { background: rgba(255,255,255,0.2); color: white; border-color: white; }

        /* --- منطقة إدخال الاسم والشخصيات --- */
        .player-setup {
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #444;
        }
        .name-input {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #6b4c9a;
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            width: 250px;
            font-size: 16px;
            font-family: inherit;
            outline: none;
            margin-bottom: 20px;
            transition: border 0.3s;
        }
        .name-input:focus { border-color: #d1b3ff; box-shadow: 0 0 10px #d1b3ff; }

        .characters {
            display: flex; gap: 12px; justify-content: center;
        }
        .char-box {
            width: 65px; height: 65px;
            background-color: #222;
            border: 2px solid #555;
            border-radius: 8px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 35px;
            transition: all 0.2s;
            position: relative;
        }
        .char-box:hover { border-color: #aaa; transform: translateY(-3px); }
        .char-box.selected {
            border-color: #00ffff;
            box-shadow: 0 0 15px #00ffff, inset 0 0 10px #00ffff;
            background-color: #113333;
            transform: scale(1.1);
        }

        /* --- الرتب --- */
        .ranks { display: flex; gap: 20px; justify-content: center; margin-top: 10px; }
        .rank {
            width: 50px; height: 50px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 25px;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="ui-container">
        
        <div class="title-box">
            <h1 class="main-title">أساتميرامين 7</h1>
            <div class="sub-title">THE 7 INFILTRATORS</div>
        </div>

        <div style="text-align: center;">
            <button class="start-btn" id="startGameBtn">ابدأ</button>
            <div class="small-btns">
                <button class="small-btn">Options</button>
                <button class="small-btn">Quit</button>
            </div>
        </div>

        <div class="player-setup">
            <input type="text" id="playerName" class="name-input" placeholder="أدخل الاسم هنا">
            
            <div class="characters" id="characterList">
                <div class="char-box" data-char="1">🥷</div>
                <div class="char-box" data-char="2">🧛‍♂️</div>
                <div class="char-box" data-char="3">🧙‍♀️</div>
                <div class="char-box" data-char="4">🕵️‍♂️</div>
                <div class="char-box" data-char="5">🧝‍♀️</div>
                <div class="char-box" data-char="6">🧟‍♀️</div>
                <div class="char-box" data-char="7">🤖</div>
            </div>
        </div>

        <div class="ranks">
            <div class="rank" style="background: linear-gradient(45deg, #ffd700, #b8860b);">⭐</div>
            <div class="rank" style="background: linear-gradient(45deg, #9370db, #4b0082);">🌌</div>
            <div class="rank" style="background: linear-gradient(45deg, #ff4500, #8b0000);">🔥</div>
            <div class="rank" style="background: linear-gradient(45deg, #c0c0c0, #778899);">🌙</div>
            <div class="rank" style="background: linear-gradient(45deg, #cd7f32, #8b4513);">🛡️</div>
        </div>

    </div>

    <script>
        const charBoxes = document.querySelectorAll('.char-box');
        const startBtn = document.getElementById('startGameBtn');
        const nameInput = document.getElementById('playerName');
        let selectedCharacterId = null;

        // نظام اختيار الشخصية
        charBoxes.forEach(box => {
            box.addEventListener('click', function() {
                // إزالة التحديد من كل الشخصيات
                charBoxes.forEach(b => b.classList.remove('selected'));
                // إضافة التحديد للشخصية المضروبة
                this.classList.add('selected');
                selectedCharacterId = this.getAttribute('data-char');
            });
        });

        // زر البدء
        startBtn.addEventListener('click', function() {
            const playerName = nameInput.value.trim();

            if (playerName === '') {
                alert('عذراً، يجب عليك إدخال اسمك أولاً!');
                return;
            }

            if (selectedCharacterId === null) {
                alert('عذراً، يجب عليك اختيار شخصيتك من القائمة!');
                return;
            }

            // إذا كان كل شيء صحيح
            alert('أهلاً بك يا ' + playerName + '! لقد تم اختيار الشخصية رقم ' + selectedCharacterId + '.\n\nجاري تحميل اللعبة...');
            
            // هنا يمكنك وضع الكود الذي ينقل اللاعب لصفحة اللعبة الفعلية
            // window.location.href = "game.html";
        });
    </script>

</body>
</html>
