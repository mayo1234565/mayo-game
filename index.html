<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ascension - Ultimate Custom Lobby</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Orbitron:wght@500;700;900&family=Cairo:wght@600;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
        }

        /* حاوية اللعبة المعتمدة على خلفيتك النظيفة */
        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: url('background2.png') no-repeat center center;
            background-size: cover;
            display: flex;
        }

        /* تعتيم سينمائي */
        .game-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 25%, rgba(0,0,0,0.65) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .screen {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            z-index: 2;
            width: 100%;
            height: 100%;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95); 
        }

        /* إرجاع شاشة البداية لتكون في الأسفل اليمين كما كانت وبمظهر فخم */
        #screen-start {
            align-items: flex-end;
            justify-content: flex-end;
            padding-bottom: 8%;
            padding-right: 10%;
        }

        /* أزرار بلايستيشن النيون */
        .sony-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Orbitron', 'Cinzel', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            padding: 5px 15px;
        }

        .sony-btn::after {
            content: '';
            width: 0;
            height: 3px;
            background-color: #00f0ff; 
            position: absolute;
            bottom: -5px;
            right: 0;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px #00f0ff;
        }

        .sony-btn:hover {
            color: #ffffff;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6), 2px 2px 4px rgba(0, 0, 0, 0.9);
            transform: translateX(-5px);
        }

        .sony-btn:hover::after { width: 100%; }
        .start-title { font-size: 3.5rem; letter-spacing: 8px; color: #ffffff; }

        /* التنسيقات العامة للمدخلات */
        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .input-label {
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 3px;
        }

        .sony-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 10px;
            font-size: 1.5rem;
            font-family: 'Cairo', 'Orbitron', sans-serif;
            text-align: center;
            outline: none;
            width: 340px;
        }

        .sony-input:focus { border-bottom-color: #00f0ff; }

        /* 🎭 لوحة اختيار الشخصيات والإطارات الفخمة */
        .customizer-box {
            display: flex;
            gap: 40px;
            background: rgba(10, 10, 15, 0.75);
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            max-width: 800px;
            width: 90%;
        }

        .selection-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 50%;
        }

        .grid-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .opt-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 10px;
            font-family: 'Orbitron', 'Cairo', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .opt-item:hover, .opt-item.selected {
            border-color: #00f0ff;
            background: rgba(0, 240, 255, 0.15);
            box-shadow: 0 0 10px rgba(0,240,255,0.3);
        }

        /* 👑 ستايل الإطارات الدائرية والزخارف (Overwatch Style) */
        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .inner-avatar {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            z-index: 2;
        }

        /* زخارف حواف الطرازات الفخمة */
        .tier-border {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            z-index: 3;
            pointer-events: none;
            transition: all 0.3s;
        }

        /* 🟫 1. طراز زخارف خشبية */
        .border-wood {
            border: 6px double #8B4513;
            box-shadow: inset 0 0 10px #5c2c0b, 0 0 8px rgba(0,0,0,0.8);
        }

        /* 🥉 2. طراز برونزي حاد */
        .border-bronze {
            border: 5px solid #CD7F32;
            box-shadow: 0 0 12px rgba(205,127,50,0.5), inset 0 0 8px rgba(0,0,0,0.5);
        }

        /* 🥈 3. طراز فضي متوهج */
        .border-silver {
            border: 4px solid #d1d5db;
            outline: 2px dashed #9ca3af;
            outline-offset: -6px;
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
        }

        /* 🥇 4. طراز ذهبي أسطوري متوهج بالكامل بنجوم سفلية */
        .border-gold {
            border: 5px solid #FFD700;
            background: linear-gradient(45deg, transparent 40%, rgba(255,215,0,0.3) 50%, transparent 60%);
            background-size: 200% 200%;
            animation: goldShine 3s infinite linear;
            box-shadow: 0 0 25px rgba(255,215,0,0.5), inset 0 0 10px rgba(255,215,0,0.3);
        }

        .preview-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 50%;
            border-left: 1px solid rgba(255,255,255,0.1);
            gap: 15px;
        }

        /* شبكة اللوبي المركزية الفخمة */
        .central-lobby {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px;
            width: 100%;
        }

        .central-player-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            flex-wrap: wrap;
            width: 85%;
        }

        .player-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .player-name-tag {
            font-family: 'Cairo', sans-serif;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.5);
            padding: 3px 15px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .host-indicator {
            position: absolute;
            top: -15px;
            background: #00f0ff;
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            font-weight: 900;
            padding: 2px 7px;
            border-radius: 3px;
            box-shadow: 0 0 8px #00f0ff;
            z-index: 10;
        }

        .back-mini-btn { font-size: 1.3rem; color: rgba(255, 255, 255, 0.4); }
        .back-mini-btn:hover { color: #ff4a4a; }
        .back-mini-btn:hover::after { background-color: #ff4a4a; }

        @keyframes goldShine {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        
        <div id="screen-start" class="screen">
            <button class="sony-btn start-title" onclick="switchScreen('screen-identity')">START</button>
        </div>

        <div id="screen-identity" class="screen hidden">
            <div class="customizer-box">
                
                <div class="selection-panel">
                    <div class="input-group" style="align-items: flex-start;">
                        <span class="input-label">PLAYER NAME</span>
                        <input type="text" id="player-name" class="sony-input" placeholder="ENTER NAME..." maxlength="12" style="text-align: left; width: 100%;">
                    </div>
                    
                    <span class="input-label" style="margin-top:10px;">SELECT HERO AVATAR</span>
                    <div class="grid-options" id="hero-grid">
                        </div>

                    <span class="input-label" style="margin-top:10px;">SELECT BORDER TIER</span>
                    <div class="grid-options" id="tier-grid">
                        <div class="opt-item selected" onclick="selectTier('wood')">WOODEN</div>
                        <div class="opt-item" onclick="selectTier('bronze')">BRONZE</div>
                        <div class="opt-item" onclick="selectTier('silver')">SILVER</div>
                        <div class="opt-item" onclick="selectTier('gold')">MYTHIC GOLD</div>
                    </div>
                </div>

                <div class="preview-zone">
                    <span class="input-label">HERO PREVIEW</span>
                    <div class="avatar-container">
                        <div id="tier-preview" class="tier-border border-wood"></div>
                        <div id="avatar-preview" class="inner-avatar"></div>
                    </div>
                    <button class="sony-btn" onclick="confirmIdentity()" style="font-size:1.4rem; margin-top:20px;">CONFIRM</button>
                </div>

            </div>
            <button class="sony-btn back-mini-btn" onclick="switchScreen('screen-start')">BACK</button>
        </div>

        <div id="screen-choice" class="screen hidden">
            <div class="input-group">
                <span class="input-label">JOIN EXISTING LOBBY</span>
                <input type="text" id="join-code" class="sony-input" placeholder="ENTER ROOM CODE..." style="font-family:'Orbitron'; letter-spacing:2px;">
            </div>
            <button class="sony-btn" onclick="initNetwork('join')"><i class="fa-solid fa-right-to-bracket"></i> JOIN LOBBY</button>
            <div style="color: rgba(255,255,255,0.1); font-family:'Orbitron'; font-size:0.9rem;">— OR —</div>
            <button class="sony-btn" onclick="initNetwork('host')"><i class="fa-solid fa-plus"></i> CREATE LOBBY</button>
            <button class="sony-btn back-mini-btn" onclick="switchScreen('screen-identity')">BACK</button>
        </div>

        <div id="screen-lobby" class="screen hidden">
            <div class="central-lobby">
                <div style="text-align: center;">
                    <span class="input-label" style="opacity:0.5;">MULTIPLAYER MATCHMAKING</span>
                    <div id="room-id-display" class="room-badge" onclick="copyCode()">ROOM-0000</div>
                </div>

                <div class="central-player-grid" id="player-mesh">
                    </div>

                <div class="lobby-buttons">
                    <button class="sony-btn" style="color: #00ff88;" id="host-start-trigger" onclick="alert('Launching Match...')">LAUNCH MATCH</button>
                    <button class="sony-btn back-mini-btn" onclick="disconnectLobby()">LEAVE LOBBY</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // 6 شخصيات أنمي مبتكرة ومولدة بألوان فخمة وعناصر حادة تناسب اللعبة
        const animeHeroes = {
            'shadow': { name: 'Shadow Ninja', url: 'https://api.dicebear.com/7.x/bottts-neutral/svg?seed=shadow&backgroundColor=312e81' },
            'blaze': { name: 'Blaze Samurai', url: 'https://api.dicebear.com/7.x/bottts-neutral/svg?seed=blaze&backgroundColor=991b1b' },
            'frost': { name: 'Frost Mage', url: 'https://api.dicebear.com/7.x/bottts-neutral/svg?seed=frost&backgroundColor=065f46' },
            'volt': { name: 'Volt Striker', url: 'https://api.dicebear.com/7.x/bottts-neutral/svg?seed=volt&backgroundColor=854d0e' },
            'phantom': { name: 'Phantom Assassin', url: 'https://api.dicebear.com/7.x/bottts-neutral/svg?seed=phantom&backgroundColor=581c87' },
            'sakura': { name: 'Sakura Ronin', url: 'https://api.dicebear.com/7.x/bottts-neutral/svg?seed=sakura&backgroundColor=9d174d' }
        };

        let selectedHero = 'shadow';
        let selectedTier = 'wood';
        let peer = null, connections = [], pName = "", globalPlayers = [];

        const iceConfig = { config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] } };

        // بناء قائمة اختيار الشخصيات
        const heroGrid = document.getElementById('hero-grid');
        Object.keys(animeHeroes).forEach((key, index) => {
            const activeClass = index === 0 ? 'selected' : '';
            heroGrid.innerHTML += `<div class="opt-item ${activeClass}" id="hero-${key}" onclick="selectHero('${key}')">${animeHeroes[key].name}</div>`;
        });

        function selectHero(key) {
            document.querySelectorAll('#hero-grid .opt-item').forEach(el => el.classList.remove('selected'));
            document.getElementById(`hero-${key}`).classList.add('selected');
            selectedHero = key;
            document.getElementById('avatar-preview').style.backgroundImage = `url('${animeHeroes[key].url}')`;
        }

        function selectTier(tier) {
            document.querySelectorAll('#tier-grid .opt-item').forEach(el => el.classList.remove('selected'));
            event.target.classList.add('selected');
            selectedTier = tier;
            
            const preview = document.getElementById('tier-preview');
            preview.className = 'tier-border';
            preview.classList.add(`border-${tier}`);
        }

        // تعيين البداية الافتراضية للمعاينه
        selectHero('shadow');

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
        }

        function confirmIdentity() {
            pName = document.getElementById('player-name').value.trim();
            if(!pName) { alert("Please declare your name identity!"); return; }
            switchScreen('screen-choice');
        }

        function initNetwork(mode) {
            if(mode === 'host') {
                const generatedRoom = 'ROOM-' + Math.floor(1000 + Math.random() * 9000);
                document.getElementById('room-id-display').innerText = generatedRoom;
                document.getElementById('host-start-trigger').style.display = 'block';

                peer = new Peer(generatedRoom, iceConfig);
                peer.on('open', () => {
                    switchScreen('screen-lobby');
                    syncLobbyArray(pName, selectedHero, selectedTier, true);
                });

                peer.on('connection', (conn) => {
                    connections.push(conn);
                    conn.on('data', (data) => {
                        if(data.type === 'register') {
                            syncLobbyArray(data.name, data.hero, data.tier, false);
                            broadcastData({type: 'sync', list: globalPlayers});
                        }
                    });
                });
            } else {
                const enteredCode = document.getElementById('join-code').value.trim().toUpperCase();
                if(!enteredCode) { alert("Room code field is required!"); return; }

                document.getElementById('host-start-trigger').style.display = 'none';
                peer = new Peer(iceConfig);

                peer.on('open', () => {
                    const conn = peer.connect(enteredCode);
                    conn.on('open', () => {
                        connections.push(conn);
                        conn.send({type: 'register', name: pName, hero: selectedHero, tier: selectedTier});
                        document.getElementById('room-id-display').innerText = enteredCode;
                        switchScreen('screen-lobby');
                    });

                    conn.on('data', (data) => {
                        if(data.type === 'sync') drawCentralGrid(data.list);
                    });
                });
            }
        }

        function syncLobbyArray(name, hero, tier, isHost) {
            globalPlayers.push({name: name, hero: hero, tier: tier, isHost: isHost});
            drawCentralGrid(globalPlayers);
        }

        // رسم بطاقات اللاعبين الفخمة في المنتصف تماماً (Overwatch Style)
        function drawCentralGrid(list) {
            const grid = document.getElementById('player-mesh');
            grid.innerHTML = "";
            list.forEach(player => {
                grid.innerHTML += `
                    <div class="player-card">
                        ${player.isHost ? '<span class="host-indicator">HOST</span>' : ''}
                        <div class="avatar-container">
                            <div class="tier-border border-${player.tier}"></div>
                            <div class="inner-avatar" style="background-image: url('${animeHeroes[player.hero].url}')"></div>
                        </div>
                        <div class="player-name-tag">${player.name}</div>
                    </div>
                `;
            });
        }

        function broadcastData(payload) {
            connections.forEach(c => { if(c.open) c.send(payload); });
        }

        function disconnectLobby() {
            if(peer) peer.destroy();
            connections = []; globalPlayers = [];
            switchScreen('screen-choice');
        }

        function copyCode() {
            const c = document.getElementById('room-id-display').innerText;
            navigator.clipboard.writeText(c);
            alert("Lobby ID Copied: " + c);
        }
    </script>
</body>
</html>
