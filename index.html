<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Mayo Bet - احترافية المراهنة</title>
    <style>
        body { background: #1a1a1a; color: #fff; font-family: 'Cairo', sans-serif; margin: 0; overflow: hidden; }
        .screen { width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* تصميم الواجهة */
        .card { background: #2f3640; padding: 30px; border-radius: 20px; border: 2px solid #7f8c8d; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 400px; text-align: center; }
        .input-pro { width: 80%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: #dcdde1; }
        .btn-pro { background: #e84118; color: white; padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; margin: 5px; }
        
        /* الطاولة والشخصيات */
        .table-3d { width: 700px; height: 350px; background: #2f3640; margin: 50px auto; border-radius: 50px; transform: perspective(800px) rotateX(40deg); border: 15px solid #7f8c8d; }
        .host-model { width: 100px; position: absolute; top: 100px; left: 50%; transform: translateX(-50%); }
    </style>
</head>
<body>

<div id="setup" class="screen">
    <div class="card">
        <h1>Mayo Bet 🎮</h1>
        <input id="playerName" class="input-pro" placeholder="اكتب اسمك هنا...">
        <div id="emojiPicker" style="margin: 15px;">
            <span onclick="setEmoji('😎')" style="cursor:pointer; font-size: 2rem;">😎</span>
            <span onclick="setEmoji('🤖')" style="cursor:pointer; font-size: 2rem;">🤖</span>
            <span onclick="setEmoji('🦁')" style="cursor:pointer; font-size: 2rem;">🦁</span>
        </div>
        <button class="btn-pro" onclick="createRoom()">إنشاء غرفه</button>
        <button class="btn-pro" onclick="joinRoom()">انضمام لغرفه</button>
    </div>
</div>

<div id="game" class="screen" style="display:none;">
    <div class="table-3d"></div>
    <div id="hostControls" style="display:none;">
        <button onclick="reveal()">إظهار الإجابة</button>
        <button onclick="nextQ()">السؤال التالي</button>
    </div>
    
    <div style="margin-top:20px;">
        <button onclick="bet(500)">+500</button>
        <button onclick="bet(-500)">-500</button>
        <span id="betAmount">رهانك: 0</span>
    </div>
</div>

<script>
    let myEmoji = '😎';
    let currentBet = 0;

    function setEmoji(e) { myEmoji = e; alert("تم اختيار: " + e); }

    function createRoom() {
        let name = document.getElementById('playerName').value;
        if(!name) return alert("اكتب اسمك!");
        localStorage.setItem('role', 'host');
        enterGame(true);
    }

    function joinRoom() {
        let code = prompt("أدخل كود الغرفة:");
        if(code) {
            localStorage.setItem('role', 'player');
            enterGame(false);
        }
    }

    function enterGame(isHost) {
        document.getElementById('setup').style.display = 'none';
        document.getElementById('game').style.display = 'flex';
        if(isHost) document.getElementById('hostControls').style.display = 'block';
    }

    function bet(val) {
        currentBet = Math.max(0, currentBet + val);
        document.getElementById('betAmount').innerText = "رهانك: " + currentBet;
    }

    function reveal() { alert("الإجابة الصحيحة هي: الرياض"); }
    function nextQ() { document.getElementById('q').innerText = "السؤال التالي..."; }
</script>

</body>
</html>
