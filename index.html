<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Clash - AAA Card Game</title>
    <style>
        /* --- التصميم العام والخطوط --- */
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body, html {
            width: 100%; height: 100%;
            background-color: #020204;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden; color: #fff;
        }

        /* --- خلفية الفضاء --- */
        #environment {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;
        }
        .stars {
            position: absolute; width: 2px; height: 2px; background: transparent;
            box-shadow: 100px 200px #fff, 300px 500px #fff, 800px 100px #fff, 1200px 400px #fff, 500px 800px #fff, 1500px 900px #fff, 200px 900px #fff, 1000px 600px #fff, 1700px 200px #fff;
            animation: twinkle 4s infinite alternate;
        }
        @keyframes twinkle { 0% { opacity: 0.3; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }

        /* --- الشاشات الأساسية --- */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .hidden { opacity: 0; pointer-events: none; transform: scale(1.02) translateY(-10px); }

        /* --- الأزرار والنصوص --- */
        .title-text { font-size: 4rem; font-weight: 700; letter-spacing: 15px; text-shadow: 0 0 20px rgba(255,255,255,0.3); margin-bottom: 30px;}
        .glow-text { background: transparent; border: none; color: #fff; font-family: inherit; font-size: 1.3rem; letter-spacing: 2px; outline: none; text-align: center; }
        
        input[type="text"] { border-bottom: 1px solid rgba(255,255,255,0.2); padding: 10px; width: 260px; text-transform: uppercase; transition: all 0.3s; margin-bottom: 15px;}
        input[type="text"]:focus { border-bottom: 1px solid #ff003c; text-shadow: 0 0 10px rgba(255, 0, 60, 0.5); }
        select { appearance: none; border-bottom: 1px solid rgba(255,255,255,0.2); padding: 5px 15px; cursor: pointer; text-align-last: center; margin-bottom: 20px;}
        select option { background: #0c0c12; color: #fff; }

        .action-btn {
            background: transparent; border: 1px solid rgba(255, 255, 255, 0.2); padding: 10px 30px;
            color: #fff; font-family: inherit; font-size: 1.4rem; font-weight: 700; letter-spacing: 2px;
            cursor: pointer; border-radius: 4px; transition: all 0.3s; margin: 10px;
        }
        .action-btn:hover { border-color: #fff; box-shadow: 0 0 20px rgba(255,255,255,0.2); transform: translateY(-2px); }
        .action-btn.red-glow { border-color: #ff003c; color: #ff003c; }
        .action-btn.red-glow:hover { background: #ff003c; color: #fff; box-shadow: 0 0 25px #ff003c; }

        /* --- اللوبي (ترتيب أفقي) --- */
        .players-row { display: flex; justify-content: center; align-items: center; gap: 20px; width: 95%; margin: 40px 0; }
        .player-slot { display: flex; flex-direction: column; align-items: center; width: 140px; animation: card-entry 0.5s ease forwards; }
        @keyframes card-entry { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        
        /* إطارات اللوبي مبسطة (بدون مربعات خلفية) */
        .frame-box { position: relative; width: 120px; height: 120px; display: flex; justify-content: center; align-items: center; }
        .avatar-box { position: absolute; width: 60px; height: 60px; border-radius: 50%; border: 2px solid #fff; overflow: hidden; z-index: 1; }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        .player-name { font-size: 1.1rem; font-weight: 700; letter-spacing: 1px; margin-top: 10px; text-shadow: 0 0 8px rgba(255,255,255,0.3); }

        /* --- ساحة اللعبة (Card Arena) --- */
        #game-arena {
            width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between;
            background: radial-gradient(circle at center, rgba(20,20,35,0.8) 0%, rgba(2,2,4,1) 100%);
        }
        
        /* طاولات اللاعبين */
        .opponents-table { display: flex; justify-content: center; align-items: center; gap: 30px; padding-top: 30px; }
        .center-table { flex-grow: 1; display: flex; justify-content: center; align-items: center; position: relative; }
        .my-table { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 30px; }

        /* --- تصميم البطاقة المذهل (3D Card) --- */
        .card-container { width: 100px; height: 140px; perspective: 1000px; margin: 0 10px; }
        .card { width: 100%; height: 100%; position: relative; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        .card.flipped { transform: rotateY(180deg); }
        .card.played { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(1.2); z-index: 50; }
        .card.played.flipped { transform: translate(-50%, -50%) scale(1.2) rotateY(180deg); }
        
        .card-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 10px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border: 2px solid rgba(255,255,255,0.2); box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        /* ظهر الورقة */
        .card-back { background: repeating-linear-gradient(45deg, #111, #111 10px, #222 10px, #222 20px); border-color: #555; }
        .card-back::after { content: 'NEON'; font-size: 1.5rem; font-weight: bold; color: rgba(255,255,255,0.2); letter-spacing: 5px; transform: rotate(-45deg); }
        
        /* وجه الورقة */
        .card-front { background: #0c0c14; transform: rotateY(180deg); position: relative; overflow: hidden; }
        .card-power { font-size: 3.5rem; font-weight: 700; z-index: 2; text-shadow: 0 0 15px currentColor; }
        .card-owner { position: absolute; bottom: 10px; font-size: 0.8rem; letter-spacing: 1px; color: #fff; z-index: 2; }
        
        /* تأثيرات الإشعاع للبطاقة حسب الرتبة */
        .card-front::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(transparent, currentColor, transparent 30%);
            animation: spin 3s linear infinite; z-index: 0; opacity: 0.3;
        }
        .card-front::after { content: ''; position: absolute; inset: 4px; background: #0c0c14; border-radius: 6px; z-index: 1; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* منطقة تسجيل النقاط */
        .score-board { font-size: 1.5rem; color: #a3e635; letter-spacing: 3px; text-shadow: 0 0 10px #a3e635; margin-bottom: 15px;}
        .hud-text { font-size: 1.2rem; color: rgba(255,255,255,0.6); letter-spacing: 2px; }

        /* الفائز بالجولة */
        .card.winner { transform: translate(-50%, -50%) scale(1.5) rotateY(180deg) !important; z-index: 100; filter: drop-shadow(0 0 30px currentColor); }
        #round-status { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); font-size: 3rem; font-weight: bold; letter-spacing: 5px; text-shadow: 0 0 20px #fff; z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none;}
    </style>
</head>
<body>

    <div id="environment"><div class="stars"></div></div>

    <!-- Phase 1: Start -->
    <div id="phase1" class="screen">
        <div class="title-text" style="color: #fff;">NEON <span style="color: #ff003c;">CLASH</span></div>
        <button id="start-btn" class="action-btn red-glow">ENTER CASINO</button>
    </div>

    <!-- Phase 2: Setup -->
    <div id="phase2" class="screen hidden">
        <h2 style="font-size: 2rem; letter-spacing: 5px; margin-bottom: 30px;">CREATE PROFILE</h2>
        <div class="frame-box" style="margin-bottom: 20px;">
            <div class="avatar-box"><img id="preview-img" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII="></div>
        </div>
        <select id="rank-select" class="glow-text">
            <option value="bronze">RANK: BRONZE</option>
            <option value="silver">RANK: SILVER</option>
            <option value="gold">RANK: GOLD</option>
            <option value="diamond">RANK: DIAMOND</option>
            <option value="solar">RANK: SOLAR</option>
        </select>
        <input type="text" id="player-name" class="glow-text" value="GAMBLER_7" autocomplete="off" maxlength="12">
        <button id="create-room-btn" class="action-btn red-glow">FIND MATCH</button>
    </div>

    <!-- Phase 3: Lobby (7 Players) -->
    <div id="phase3" class="screen hidden">
        <h1 style="font-size: 2.5rem; letter-spacing: 10px;">HIGH STAKES TABLE</h1>
        <p style="color: #ff003c; font-size: 1.2rem; letter-spacing: 3px; margin-top: 5px;">7 PLAYERS READY</p>
        
        <div id="players-row" class="players-row"></div>

        <div style="display: flex;">
            <button id="leave-btn" class="action-btn">LEAVE</button>
            <button id="launch-btn" class="action-btn red-glow">DEAL CARDS</button>
        </div>
    </div>

    <!-- Phase 4: The Card Game Arena -->
    <div id="phase4" class="screen hidden">
        <div id="game-arena">
            <!-- طاولة الخصوم (6 لاعبين) -->
            <div id="opponents-table" class="opponents-table"></div>
            
            <!-- الساحة المركزية لرمي الورق -->
            <div id="center-table" class="center-table">
                <div id="round-status">ROUND WINNER!</div>
            </div>
            
            <!-- منطقتك كلاعب -->
            <div class="my-table">
                <div class="score-board">SCORE: <span id="my-score">0</span> / 3</div>
                <div id="my-hand" style="display: flex; gap: 20px;"></div>
                <button id="play-card-btn" class="action-btn red-glow" style="margin-top: 20px; display: none;">PLAY CARD</button>
            </div>
        </div>
    </div>

    <script>
        // --- Navigation ---
        const phases = [document.getElementById('phase1'), document.getElementById('phase2'), document.getElementById('phase3'), document.getElementById('phase4')];
        function showPhase(index) { phases.forEach((p, i) => i === index ? p.classList.remove('hidden') : p.classList.add('hidden')); }

        document.getElementById('start-btn').addEventListener('click', () => showPhase(1));
        document.getElementById('leave-btn').addEventListener('click', () => showPhase(1));

        // --- Data & Colors ---
        const rankColors = { bronze: '#b87333', silver: '#9ca3af', gold: '#d97706', diamond: '#2563eb', solar: '#ea580c' };
        let myData = { name: "GAMBLER_7", rank: "bronze", score: 0 };
        const bots = [
            { id: 1, name: "CYPHER", rank: "solar", score: 0 }, { id: 2, name: "VORTEX", rank: "diamond", score: 0 },
            { id: 3, name: "KINETIC", rank: "gold", score: 0 }, { id: 4, name: "Z3RO", rank: "silver", score: 0 },
            { id: 5, name: "GHOST", rank: "diamond", score: 0 }, { id: 6, name: "TITAN", rank: "bronze", score: 0 }
        ];
        let allPlayers = []; // أنت + البوتات

        // --- Phase 3: Build Lobby ---
        document.getElementById('create-room-btn').addEventListener('click', () => {
            myData.name = document.getElementById('player-name').value || "PLAYER";
            myData.rank = document.getElementById('rank-select').value;
            
            const row = document.getElementById('players-row');
            row.innerHTML = '';
            
            allPlayers = [{ id: 0, name: myData.name, rank: myData.rank, score: 0, isHuman: true }, ...bots];
            
            allPlayers.forEach((p, index) => {
                setTimeout(() => {
                    row.innerHTML += `
                        <div class="player-slot">
                            <div class="frame-box">
                                <div class="avatar-box" style="border-color: ${rankColors[p.rank]}">
                                    <img src="https://picsum.photos/seed/${p.name}/100/100">
                                </div>
                            </div>
                            <div class="player-name" style="color: ${rankColors[p.rank]}">${p.name}</div>
                        </div>`;
                }, index * 200);
            });
            showPhase(2);
        });

        // --- Phase 4: Card Game Logic ---
        const oppTable = document.getElementById('opponents-table');
        const centerTable = document.getElementById('center-table');
        const myHand = document.getElementById('my-hand');
        const playBtn = document.getElementById('play-card-btn');
        const roundStatus = document.getElementById('round-status');

        document.getElementById('launch-btn').addEventListener('click', () => {
            showPhase(3);
            resetGame();
            setTimeout(dealCards, 1000);
        });

        function resetGame() {
            allPlayers.forEach(p => p.score = 0);
            document.getElementById('my-score').textContent = 0;
            centerTable.innerHTML = '<div id="round-status"></div>';
        }

        // توليد بطاقة HTML
        function createCardElement(playerId, color, power, ownerName) {
            const wrapper = document.createElement('div');
            wrapper.className = `card-container card-${playerId}`;
            wrapper.innerHTML = `
                <div class="card" id="card-inner-${playerId}" style="color: ${color};">
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front">
                        <div class="card-power">${power}</div>
                        <div class="card-owner">${ownerName}</div>
                    </div>
                </div>
            `;
            return wrapper;
        }

        function dealCards() {
            oppTable.innerHTML = ''; myHand.innerHTML = ''; centerTable.innerHTML = '<div id="round-status"></div>';
            
            allPlayers.forEach(p => {
                // توليد قوة عشوائية للبطاقة من 1 إلى 100
                p.currentPower = Math.floor(Math.random() * 100) + 1;
                const cardEl = createCardElement(p.id, rankColors[p.rank], p.currentPower, p.name);
                
                if (p.isHuman) {
                    myHand.appendChild(cardEl);
                    // كشف بطاقتك لك فوراً
                    setTimeout(() => document.getElementById(`card-inner-${p.id}`).classList.add('flipped'), 300);
                } else {
                    // بطاقات الخصوم مقلوبة للأعلى
                    const oppWrapper = document.createElement('div');
                    oppWrapper.innerHTML = `<div style="font-size: 0.8rem; color:${rankColors[p.rank]}; text-align:center; margin-bottom:5px;">${p.name}<br>(${p.score} pt)</div>`;
                    oppWrapper.appendChild(cardEl);
                    oppTable.appendChild(oppWrapper);
                }
            });

            playBtn.style.display = 'block';
        }

        playBtn.addEventListener('click', () => {
            playBtn.style.display = 'none';
            
            // نقل جميع البطاقات إلى المركز
            allPlayers.forEach((p, idx) => {
                const cardInner = document.getElementById(`card-inner-${p.id}`);
                // حركة ديناميكية لرمي الورق في النص بـ Layout جميل
                const angle = (idx * 360 / 7) * (Math.PI / 180);
                const radius = 100;
                const xOffset = Math.cos(angle) * radius;
                const yOffset = Math.sin(angle) * radius;

                cardInner.style.position = 'absolute';
                cardInner.style.left = `calc(50% + ${xOffset}px)`;
                cardInner.style.top = `calc(50% + ${yOffset}px)`;
                cardInner.style.transform = `translate(-50%, -50%) rotate(${idx * 15}deg)`;
                cardInner.style.zIndex = 10;
                
                centerTable.appendChild(cardInner.parentElement);
            });

            // بعد ثانية، اقلب بطاقات الخصوم للكشف عنها
            setTimeout(() => {
                allPlayers.forEach(p => {
                    const cardInner = document.getElementById(`card-inner-${p.id}`);
                    cardInner.style.transform = cardInner.style.transform.replace(/rotateY\(180deg\)/g, '') + ' rotateY(180deg)';
                });
                
                // حساب الفائز بالجولة
                setTimeout(resolveRound, 1200);
            }, 800);
        });

        function resolveRound() {
            // البحث عن أعلى طاقة
            let winner = allPlayers.reduce((max, p) => p.currentPower > max.currentPower ? p : max, allPlayers[0]);
            winner.score += 1;

            if (winner.isHuman) document.getElementById('my-score').textContent = winner.score;

            // تمييز بطاقة الفائز
            const winningCard = document.getElementById(`card-inner-${winner.id}`);
            winningCard.style.transform = `translate(-50%, -50%) scale(1.6) rotateY(180deg)`;
            winningCard.style.zIndex = 100;
            winningCard.style.boxShadow = `0 0 50px ${rankColors[winner.rank]}`;

            const status = document.getElementById('round-status');
            status.textContent = `${winner.name} WINS ROUND!`;
            status.style.color = rankColors[winner.rank];
            status.style.opacity = 1;

            // التحقق من نهاية المباراة
            setTimeout(() => {
                if (winner.score >= 3) {
                    status.textContent = `${winner.name} WINS THE MATCH!`;
                    setTimeout(() => showPhase(2), 3000); // العودة للوبي
                } else {
                    status.opacity = 0;
                    dealCards(); // جولة جديدة
                }
            }, 2500);
        }
    </script>
</body>
</html>
