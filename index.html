<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة حركة الدب التفاعلية 🧸🎮</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f4f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* فقاعة المحادثة المعلقة */
        .speech-bubble {
            background: white;
            border: 4px solid #2b1d12;
            border-radius: 25px;
            padding: 12px 25px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            max-width: 450px;
            margin-top: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
            direction: rtl;
            z-index: 10;
        }

        .speech-bubble.angry {
            background: #ffe6e6;
            border-color: #dc143c;
            color: #dc143c;
            animation: shake 0.2s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px); }
            50% { transform: translate(-2px, -1px); }
            100% { transform: translate(1px, -2px); }
        }

        /* منطقة اللعب / الأرضية */
        .game-stage {
            position: relative;
            width: 100%;
            height: 60vh;
            margin-top: 20px;
            background: linear-gradient(to bottom, #e6f0ff, #cce0ff);
            border-bottom: 15px solid #27ae60; /* الأرضية العشبية */
            overflow: hidden;
        }

        /* حاوية الدب الديناميكية القابلة للتحريك */
        .game-container {
            position: absolute;
            bottom: 0; /* يبدأ من الأرض */
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 380px;
            will-change: left, bottom;
            transition: transform 0.1s linear;
        }

        .teddy {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* 1. الأذنين */
        .ear {
            position: absolute;
            width: 65px;
            height: 65px;
            background: #a05a2c;
            border-radius: 50%;
            top: 20px;
        }
        .ear.left { left: 40px; }
        .ear.right { right: 40px; }
        .ear::after {
            content: '';
            position: absolute;
            width: 35px;
            height: 35px;
            background: #cca07a;
            border-radius: 50%;
            top: 15px;
            left: 15px;
        }

        /* 2. الجسم الكامل والبطن */
        .body-fur {
            position: absolute;
            bottom: 45px;
            left: 50%;
            transform: translateX(-50%);
            width: 190px;
            height: 180px;
            background: #a05a2c;
            border-radius: 50%;
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.15);
            z-index: 1;
        }

        .belly-patch {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 110px;
            background: #eadecc;
            border-radius: 50%;
        }

        /* 3. الأرجل */
        .leg {
            position: absolute;
            bottom: 20px;
            width: 70px;
            height: 55px;
            background: #a05a2c;
            border-radius: 40% 40% 50% 50%;
            z-index: 2;
        }
        .leg.left { left: 55px; }
        .leg.right { right: 55px; }
        .leg::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 35px;
            background: #cca07a;
            border-radius: 50%;
        }

        /* 4. الرأس والملامح */
        .head {
            position: absolute;
            top: 45px;
            left: 50%;
            transform: translateX(-50%);
            width: 210px;
            height: 180px;
            background: #a05a2c;
            border-radius: 50%;
            z-index: 3;
        }

        /* الشماغ الأزرق */
        .keffiyeh-hat {
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 214px;
            height: 65px;
            background: repeating-linear-gradient(45deg, #10629a, #10629a 6px, #052c4c 6px, #052c4c 12px);
            border-radius: 120px 120px 15px 15px;
            z-index: 5;
        }

        /* العيون */
        .eye {
            position: absolute;
            top: 80px;
            width: 16px;
            height: 16px;
            background: #050505;
            border-radius: 50%;
            z-index: 6;
        }
        .eye.left { left: 55px; }
        .eye.right { right: 55px; }
        .eye::after {
            content: '';
            position: absolute;
            width: 5px;
            height: 5px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 3px;
        }

        /* الحواجب الغاضبة */
        .eyebrow {
            position: absolute;
            top: 65px;
            width: 28px;
            height: 6px;
            background: #2b1d12;
            z-index: 7;
            opacity: 0;
        }
        .eyebrow.left { left: 48px; }
        .eyebrow.right { right: 48px; }

        /* منطقة الأنف والفم الدائرية الكبيرة */
        .muzzle {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 85px;
            background: #eadecc;
            border-radius: 50%;
            z-index: 6;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nose {
            width: 50px;
            height: 32px;
            background: #54311c;
            border-radius: 50% 50% 45% 45%;
            margin-top: 10px;
            position: relative;
        }
        .nose::after {
            content: '';
            position: absolute;
            width: 2px;
            height: 15px;
            background: #2b1d12;
            bottom: -14px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* الفم الضاحك واللسان */
        .mouth-container {
            width: 70px;
            height: 30px;
            position: relative;
            margin-top: 4px;
            overflow: hidden;
        }

        .mouth-happy {
            position: absolute;
            top: -20px;
            width: 70px;
            height: 45px;
            background: #802020;
            border: 3px solid #2b1d12;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .tongue {
            width: 35px;
            height: 14px;
            background: #ff7373;
            border-radius: 15px 15px 0 0;
        }

        /* اليد الطبيعية الـWaving */
        .hand-wave {
            position: absolute;
            right: 30px;
            top: 170px;
            width: 55px;
            height: 55px;
            background: #a05a2c;
            border-radius: 50%;
            z-index: 4;
            transform-origin: bottom center;
            animation: waveAction 1s infinite ease-in-out;
        }

        @keyframes waveAction {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(20deg); }
        }

        /* 🔫 يد المسدس السرية */
        .gun-hand {
            position: absolute;
            left: 20px;
            top: 190px;
            width: 55px;
            height: 55px;
            background: #a05a2c;
            border-radius: 50%;
            z-index: 8;
            opacity: 0;
            transform: scale(0) rotate(45deg);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .pistol {
            position: absolute;
            top: -10px;
            left: -25px;
            width: 65px;
            height: 22px;
            background: #3a3d40;
            border-radius: 3px;
            transform: rotate(-10deg);
        }
        .pistol::after {
            content: '';
            position: absolute;
            right: 5px;
            top: 18px;
            width: 20px;
            height: 35px;
            background: #1e2022;
            border-radius: 3px;
        }

        /* الفلاش اللامع عند إطلاق النار */
        .muzzle-flash {
            position: absolute;
            left: -45px;
            top: -15px;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, #fff, #ffcc00, transparent);
            border-radius: 50%;
            opacity: 0;
            z-index: 9;
        }

        /* 😡 الأنيميشن وحالة العصبية الكاملة */
        .game-container.is-angry .eye {
            background: #ff0033;
            transform: scaleY(0.6);
        }
        .game-container.is-angry .eye::after { display: none; }
        .game-container.is-angry .eyebrow.left { opacity: 1; transform: rotate(30deg); top: 72px; }
        .game-container.is-angry .eyebrow.right { opacity: 1; transform: rotate(-30deg); top: 72px; }
        .game-container.is-angry .mouth-container { height: 10px; margin-top: 10px; }
        .game-container.is-angry .mouth-happy { top: 8px; width: 60px; height: 30px; background: transparent; border: none; border-top: 4px solid #2b1d12; border-radius: 50%; }
        .game-container.is-angry .tongue { display: none; }
        .game-container.is-angry .hand-wave { display: none; }
        .game-container.is-angry .gun-hand { opacity: 1; transform: scale(1.3) rotate(0deg); }
        
        /* تأثير الفلاش الفعلي عند غضبه المستمر */
        .game-container.is-angry .muzzle-flash {
            animation: flash 0.1s infinite alternate;
        }
        @keyframes flash { 0% { opacity: 0; } 100% { opacity: 1; } }

        /* لوحة التحكم السفلية (للشاشات العادية وللجوال) */
        .controls-panel {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 20;
        }

        .keyboard-hint {
            color: #555;
            font-size: 14px;
            font-weight: bold;
            background: #e4e7eb;
            padding: 8px 15px;
            border-radius: 10px;
        }

        .mobile-buttons {
            display: flex;
            gap: 15px;
        }

        .btn {
            background: #34495e;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px #2c3e50;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        .btn.btn-danger {
            background: #e74c3c;
            box-shadow: 0 4px #c0392b;
        }
    </style>
</head>
<body>

    <div class="speech-bubble" id="dialogue">مرحباً يا صديقي! أنا أتحرك وأقفز، جرب الأزرار! هههههه 😂👋</div>

    <div class="game-stage">
        <div class="game-container" id="bear">
            <div class="teddy">
                <div class="ear left"></div>
                <div class="ear right"></div>
                <div class="leg left"></div>
                <div class="leg right"></div>
                <div class="body-fur">
                    <div class="belly-patch"></div>
                </div>
                <div class="head">
                    <div class="keffiyeh-hat"></div>
                    <div class="eyebrow left"></div>
                    <div class="eyebrow right"></div>
                    <div class="eye left"></div>
                    <div class="eye right"></div>
                    <div class="muzzle">
                        <div class="nose"></div>
                        <div class="mouth-container">
                            <div class="mouth-happy">
                                <div class="tongue"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="hand-wave"></div>
                <div class="gun-hand">
                    <div class="pistol"></div>
                    <div class="muzzle-flash"></div> </div>
            </div>
        </div>
    </div>

    <div class="controls-panel">
        <div class="keyboard-hint">⌨️ أزرار الكمبيوتر: الأسهم أو (A, D) للحركة | السهم فوق أو (Space) للقفز | زر (F) للهجوم!</div>
        
        <div class="mobile-buttons">
            <button class="btn" id="btn-left">⬅️ يسار</button>
            <button class="btn" id="btn-jump">🚀 قفز</button>
            <button class="btn" id="btn-right">يمين ➡️</button>
            <button class="btn btn-danger" id="btn-attack">🔥 هجوم</button>
        </div>
    </div>

    <script>
        const bear = document.getElementById('bear');
        const dialogueBox = document.getElementById('dialogue');

        // متغيرات الحالة الفيزيائية للعبة والتنقل
        let posX = window.innerWidth / 2 - 150; // الموضع الأفقي البدائي في المنتصف
        let posY = 0;       // الموضع العمودي (الأرضية)
        let isJumping = false;
        let gravity = 1.2;  // سرعة الجاذبية الأرضية
        let jumpSpeed = 22; // قوة دفعة القفزة للأعلى
        let currentVelocityY = 0;
        let moveSpeed = 15; // سرعة المشي يمين ويسار

        // تحديث الموضع الرسومي للدب فوراً في الشاشة
        function updateBearPosition() {
            // منع الدب من الخروج من حواف الشاشة
            if (posX < 0) posX = 0;
            if (posX > window.innerWidth - 250) posX = window.innerWidth - 250;
            
            bear.style.left = posX + 'px';
            bear.style.bottom = posY + 'px';
        }

        // دالة جعل الدب يقفز
        function jump() {
            if (!isJumping) {
                isJumping = true;
                currentVelocityY = jumpSpeed;
            }
        }

        // دالة جعل الدب يعصب ويطلق النار
        function startAttack() {
            bear.classList.add('is-angry');
            dialogueBox.classList.add('angry');
            dialogueBox.innerText = "لقد حذرتك!! خذ هذه الطلقات!! 😡🔫💥";
        }

        // دالة رجوع الدب لحالته السعيدة
        function stopAttack() {
            bear.classList.remove('is-angry');
            dialogueBox.classList.remove('angry');
            dialogueBox.innerText = "مرحباً يا صديقي! أنا أتحرك وأقفز، جرب الأزرار! هههههه 😂👋";
        }

        // حلقة التحديث المستمر للفيزياء (الجاذبية والقفز التلقائي)
        function gameLoop() {
            if (isJumping) {
                posY += currentVelocityY;
                currentVelocityY -= gravity; // تأثير الجاذبية تسحب لأسفل

                // التحقق من ملامسة الأرض بالأسفل
                if (posY <= 0) {
                    posY = 0;
                    isJumping = false;
                    currentVelocityY = 0;
                }
                updateBearPosition();
            }
            requestAnimationFrame(gameLoop);
        }

        // ربط أزرار لوحة المفاتيح بالكمبيوتر (KeyDown)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') {
                posX += moveSpeed;
            } else if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') {
                posX -= moveSpeed;
            } else if (e.key === 'ArrowUp' || e.key === ' ' || e.key.toLowerCase() === 'w') {
                jump();
            } else if (e.key.toLowerCase() === 'f') {
                startAttack();
            }
            updateBearPosition();
        });

        window.addEventListener('keyup', (e) => {
            if (e.key.toLowerCase() === 'f') {
                stopAttack();
            }
        });

        // ربط أزرار الجوال واللمس التفاعلي
        document.getElementById('btn-left').addEventListener('click', () => { posX -= moveSpeed * 1.5; updateBearPosition(); });
        document.getElementById('btn-right').addEventListener('click', () => { posX += moveSpeed * 1.5; updateBearPosition(); });
        document.getElementById('btn-jump').addEventListener('click', jump);

        // زر الهجوم يدعم الضغط المطول
        const attackBtn = document.getElementById('btn-attack');
        attackBtn.addEventListener('mousedown', startAttack);
        window.addEventListener('mouseup', stopAttack);
        
        attackBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startAttack(); });
        window.addEventListener('touchend', stopAttack);

        // تشغيل اللعبة وضبط الموقع الأولي
        updateBearPosition();
        gameLoop();
    </script>
</body>
</html>
