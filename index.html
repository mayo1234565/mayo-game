<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ascension - Premium Network Lobby</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Orbitron:wght@500;700;900&family=Cairo:wght@600;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030305;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: url('background2.png') no-repeat center center;
            background-size: cover;
            display: flex;
        }

        .game-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 20%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .screen {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            z-index: 2;
            width: 100%;
            height: 100%;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.98); 
        }

        #screen-start {
            align-items: flex-end;
            justify-content: flex-end;
            padding-bottom: 8%;
            padding-right: 10%;
        }

        .sony-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Orbitron', 'Cinzel', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
            padding: 5px 15px;
        }

        .sony-btn::after {
            content: '';
            width: 0;
            height: 3px;
            background-color: #00f0ff; 
            position: absolute;
            bottom: -5px;
            right: 0;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px #00f0ff;
        }

        .sony-btn:hover {
            color: #ffffff;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6), 2px 2px 4px rgba(0, 0, 0, 1);
            transform: translateX(-5px);
        }

        .sony-btn:hover::after { width: 100%; }
        .start-title { font-size: 3.5rem; letter-spacing: 8px; color: #ffffff; }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .input-label {
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .sony-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px;
            font-size: 1.6rem;
            font-family: 'Cairo', 'Orbitron', sans-serif;
            text-align: center;
            outline: none;
            width: 350px;
        }

        .sony-input:focus { border-bottom-color: #00f0ff; }

        /* 🎭 واجهة التخصيص الاحترافية المخفية والعائمة */
        .free-customizer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 100px; 
            width: 90%;
            max-width: 1000px;
        }

        .controls-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 45%;
        }

        /* ستايل أزرار فتح القوائم المنسدلة الاحترافية */
        .select-trigger-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 14px 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            letter-spacing: 2px;
            cursor: pointer;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .select-trigger-btn:hover {
            border-color: #00f0ff;
            background: rgba(0, 240, 255, 0.05);
            box-shadow: 0 0 10px rgba(0,240,255,0.2);
        }

        /* حاويات القوائم المخفية التي تظهر فقط عند الضغط */
        .pop-menu {
            display: none;
            flex-direction: column;
            gap: 8px;
            background: rgba(15, 15, 22, 0.95);
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 10px;
            position: absolute;
            width: 337px;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .pop-opt {
            padding: 10px;
            color: rgba(255,255,255,0.7);
            font-family: 'Orbitron', 'Cairo', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pop-opt:hover, .pop-opt.selected {
            background: rgba(0, 240, 255, 0.15);
            color: #fff;
        }

        .preview-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 45%;
            gap: 25px;
        }

        /* 👑 هندسة الزخارف اللاصقة تماماً بحواف الصورة */
        .avatar-frame-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .core-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            z-index: 2;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .ornament-border {
            position: absolute;
            width: 100px; /* نفس عرض الصورة بالظبط للالتصاق المثالي */
            height: 100px; /* نفس ارتفاع الصورة بالظبط */
            z-index: 3;
            pointer-events: none;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        /* 🟫 1. طراز زخارف خشبية مطورة لاصقة */
        .ornament-wood {
            border: 5px double #6b3e23;
            box-shadow: 0 0 0 3px #3a1e0e, 0 0 15px rgba(0,0,0,0.7);
        }

        /* 🥉 2. طراز برونزي بالأجنحة الممتدة من الحافة */
        .ornament-bronze {
            border: 4px solid #cd7f32;
        }
        .ornament-bronze::before, .ornament-bronze::after {
            content: ''; position: absolute; top: 30%; width: 16px; height: 35px; background: #cd7f32; clip-path: polygon(0 0, 100% 50%, 0 100%);
        }
        .ornament-bronze::before { left: -15px; transform: scaleX(-1); }
        .ornament-bronze::after { right: -15px; }

        /* 🥈 3. طراز فضي ملكي مع التاج المدمج بالحافة */
        .ornament-silver {
            border: 4px solid #e5e7eb;
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
        }
        .ornament-silver::before {
            content: '\f521'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
            font-size: 1.2rem; color: #e5e7eb; position: absolute; top: -18px; left: 39%;
            text-shadow: 0 0 8px rgba(255,255,255,0.4);
        }

        /* 🥇 4. طراز ذهبي أسطوري مليء بالزخارف (أجنحة لاصقة + 5 نجوم مدمجة أسفل الحافة) */
        .ornament-gold {
            border: 5px solid #ffd700;
            box-shadow: 0 0 20px rgba(255,215,0,0.3);
            background: linear-gradient(90deg, transparent, rgba(255,215,0,0.3), transparent);
            background-size: 200% 100%;
            animation: lightShine 2.5s infinite linear;
        }
        .ornament-gold::before {
            content: ''; position: absolute; top: 10%; left: -12px; right: -12px; bottom: 30%;
            border: 3px solid #ffd700; border-bottom: none; border-radius: 50px 50px 0 0; z-index: -1;
        }
        .ornament-gold::after {
            content: '\f005  \f005  \f005  \f005  \f005';
            font-family: 'Font Awesome 6 Free'; font-weight: 900;
            font-size: 0.65rem; color: #ffd700; position: absolute; bottom: -16px; left: 50%;
            transform: translateX(-50%); white-space: nowrap; letter-spacing: 1px;
            text-shadow: 0 0 6px #ffd700, 1px 1px 2px #000;
        }

        .player-tag-name {
            font-family: 'Cairo', sans-serif;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 800;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* اللوبي المركزي */
        .central-lobby {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            width: 100%;
        }

        .central-player-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 55px; 
            flex-wrap: wrap;
            width: 90%;
        }

        .lobby-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        .room-badge {
            font-family: 'Orbitron', sans-serif;
            color: #00f0ff;
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            cursor: pointer;
            margin-top: 5px;
        }

        .host-indicator {
            position: absolute;
            top: -22px;
            background: #00f0ff;
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 3px;
            box-shadow: 0 0 10px #00f0ff;
            z-index: 10;
        }

        .back-mini-btn { font-size: 1.3rem; color: rgba(255, 255, 255, 0.3); }
        .back-mini-btn:hover { color: #ff4a4a; }
        .back-mini-btn:hover::after { background-color: #ff4a4a; }

        @keyframes lightShine {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        
        <!-- صفحة 1: START الأصلي الحر -->
        <div id="screen-start" class="screen">
            <button class="sony-btn start-title" onclick="switchScreen('screen-identity')">START</button>
        </div>

        <!-- صفحة 2: التخصيص الغامض والمحترف (القوائم مخفية داخل أزرار اختيار) -->
        <div id="screen-identity" class="screen hidden">
            <div class="free-customizer">
                
                <div class="controls-column">
                    <div class="input-group" style="align-items: flex-start; width: 100%; margin-bottom: 10px;">
                        <span class="input-label">PLAYER NAME</span>
                        <input type="text" id="player-name" class="sony-input" placeholder="ENTER NAME..." maxlength="12" style="text-align: left; width: 100%;">
                    </div>
                    
                    <!-- خانة اختيار البطل المنسدلة المخفية بالداخل -->
                    <div style="position: relative;">
                        <button class="select-trigger-btn" onclick="toggleMenu('pop-hero')">
                            <span>CHOOSE HERO AVATAR</span> <i class="fa-solid fa-chevron-down"></i>
                        </button>
                        <div class="pop-menu" id="pop-hero">
                            <div class="pop-opt selected" onclick="changeHero('shadow')">SHADOW NINJA</div>
                            <div class="pop-opt" onclick="changeHero('blaze')">BLAZE SAMURAI</div>
                            <div class="pop-opt" onclick="changeHero('frost')">FROST MAGE</div>
                            <div class="pop-opt" onclick="changeHero('volt')">VOLT STRIKER</div>
                        </div>
                    </div>

                    <!-- خانة اختيار الزخرفة المنسدلة المخفية بالداخل -->
                    <div style="position: relative;">
                        <button class="select-trigger-btn" onclick="toggleMenu('pop-tier')">
                            <span>CHOOSE BORDER ORNAMENT</span> <i class="fa-solid fa-chevron-down"></i>
                        </button>
                        <div class="pop-menu" id="pop-tier">
                            <div class="pop-opt selected" onclick="changeOrnament('wood')">WOOD ROYAL</div>
                            <div class="pop-opt" onclick="changeOrnament('bronze')">BRONZE WINGS</div>
                            <div class="pop-opt" onclick="changeOrnament('silver')">SILVER CROWN</div>
                            <div class="pop-opt" onclick="changeOrnament('gold')">MYTHIC GOLD</div>
                        </div>
                    </div>
                </div>

                <div class="preview-column">
                    <span class="input-label">IDENTITY PREVIEW</span>
                    <div class="avatar-frame-wrapper">
                        <div id="ornament-live-border" class="ornament-border ornament-wood"></div>
                        <div id="avatar-live-core" class="core-avatar"></div>
                    </div>
                    <button class="sony-btn" onclick="confirmIdentity()" style="font-size:1.4rem; margin-top:20px;">CONFIRM</button>
                </div>

            </div>
            <button class="sony-btn back-mini-btn" onclick="switchScreen('screen-start')">BACK</button>
        </div>

        <!-- صفحة 3: شاشة الاتصال -->
        <div id="screen-choice" class="screen hidden">
            <div class="input-group">
                <span class="input-label">JOIN TARGET LOBBY</span>
                <input type="text" id="join-code" class="sony-input" placeholder="ENTER ROOM CODE..." style="font-family:'Orbitron'; letter-spacing:2px;">
            </div>
            <button class="sony-btn" id="btn-join-lobby" onclick="initNetwork('join')"><i class="fa-solid fa-right-to-bracket"></i> JOIN LOBBY</button>
            <div style="color: rgba(255,255,255,0.08); font-family:'Orbitron'; font-size:0.9rem;">— OR —</div>
            <button class="sony-btn" id="btn-create-lobby" onclick="initNetwork('host')"><i class="fa-solid fa-plus"></i> CREATE LOBBY</button>
            <button class="sony-btn back-mini-btn" onclick="switchScreen('screen-identity')">BACK</button>
        </div>

        <!-- صفحة 4: اللوبي المركزي بالزخارف الملتصقة في المنتصف -->
        <div id="screen-lobby" class="screen hidden">
            <div class="central-lobby">
                <div style="text-align: center;">
                    <span class="input-label" style="opacity:0.4;">MULTIPLAYER TOURNAMENT</span>
                    <div id="room-id-display" class="room-badge" onclick="copyCode()">ROOM-0000</div>
                </div>

                <div class="central-player-grid" id="player-mesh">
                    <!-- تظهر الشخصيات المزخرفة هنا بالكامل -->
                </div>

                <div class="lobby-buttons">
                    <button class="sony-btn" style="color: #00ff88;" id="host-start-trigger" onclick="alert('Launching Match Instance...')">LAUNCH MATCH</button>
                    <button class="sony-btn back-mini-btn" onclick="disconnectLobby()">LEAVE LOBBY</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const animeHeroes = {
            'shadow': { url: 'https://api.dicebear.com/7.x/bottts-neutral/svg?seed=shadow&backgroundColor=312e81' },
            'blaze': { url: 'https://api.dicebear.com/7.x/bottts-neutral/svg?seed=blaze&backgroundColor=991b1b' },
            'frost': { url: 'https://api.dicebear.com/7.x/bottts-neutral/svg?seed=frost&backgroundColor=065f46' },
            'volt': { url: 'https://api.dicebear.com/7.x/bottts-neutral/svg?seed=volt&backgroundColor=854d0e' }
        };

        let currentHero = 'shadow';
        let currentOrnament = 'wood';
        let peer = null, connections = [], pName = "", globalPlayers = [];

        const iceConfig = { config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] } };

        // دوال التحكم بفتح وإغلاق القوائم العائمة المخفية
        function toggleMenu(menuId) {
            const menu = document.getElementById(menuId);
            const isVisible = menu.style.display === 'flex';
            document.querySelectorAll('.pop-menu').forEach(m => m.style.display = 'none');
            menu.style.display = isVisible ? 'none' : 'flex';
            event.stopPropagation();
        }

        // إغلاق القوائم عند الضغط في أي مكان خارجها
        document.addEventListener('click', () => {
            document.querySelectorAll('.pop-menu').forEach(m => m.style.display = 'none');
        });

        function changeHero(key) {
            currentHero = key;
            document.getElementById('avatar-live-core').style.backgroundImage = `url('${animeHeroes[key].url}')`;
            document.querySelectorAll('#pop-hero .pop-opt').forEach(el => el.classList.remove('selected'));
            event.target.classList.add('selected');
        }

        function changeOrnament(tier) {
            currentOrnament = tier;
            const border = document.getElementById('ornament-live-border');
            border.className = 'ornament-border';
            border.classList.add(`ornament-${tier}`);
            document.querySelectorAll('#pop-tier .pop-opt').forEach(el => el.classList.remove('selected'));
            event.target.classList.add('selected');
        }

        // تعيين قيم المعاينة الافتراضية عند التشغيل
        document.getElementById('avatar-live-core').style.backgroundImage = `url('${animeHeroes['shadow'].url}')`;

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
        }

        function confirmIdentity() {
            pName = document.getElementById('player-name').value.trim();
            if(!pName) { alert("Identity validation required!"); return; }
            switchScreen('screen-choice');
        }

        // إعداد شبكة الأونلاين (تم إصلاح مشكلة الضغط المزدوج)
        function initNetwork(mode) {
            // تعطيل الأزرار مؤقتاً لمنع التكرار وضمان الاستجابة الفورية من أول ضغطة
            document.getElementById('btn-join-lobby').disabled = true;
            document.getElementById('btn-create-lobby').disabled = true;

            if(mode === 'host') {
                const roomCode = 'ROOM-' + Math.floor(1000 + Math.random() * 9000);
                document.getElementById('room-id-display').innerText = roomCode;
                document.getElementById('host-start-trigger').style.display = 'block';

                peer = new Peer(roomCode, iceConfig);
                
                peer.on('open', () => {
                    enableButtons();
                    switchScreen('screen-lobby');
                    syncLobbyData(pName, currentHero, currentOrnament, true);
                });

                peer.on('connection', (conn) => {
                    connections.push(conn);
                    conn.on('data', (data) => {
                        if(data.type === 'sync-req') {
                            syncLobbyData(data.name, data.hero, data.tier, false);
                            broadcastLobby({type: 'sync-resp', list: globalPlayers});
                        }
                    });
                });
            } else {
                const code = document.getElementById('join-code').value.trim().toUpperCase();
                if(!code) { 
                    alert("Please provide a lobby key!"); 
                    enableButtons();
                    return; 
                }

                document.getElementById('host-start-trigger').style.display = 'none';
                peer = new Peer(iceConfig);

                peer.on('open', () => {
                    const conn = peer.connect(code);
                    conn.on('open', () => {
                        enableButtons();
                        connections.push(conn);
                        conn.send({type: 'sync-req', name: pName, hero: currentHero, tier: currentOrnament});
                        document.getElementById('room-id-display').innerText = code;
                        switchScreen('screen-lobby');
                    });

                    conn.on('data', (data) => {
                        if(data.type === 'sync-resp') drawCentralGrid(data.list);
                    });
                });
            }
        }

        function enableButtons() {
            document.getElementById('btn-join-lobby').disabled = false;
            document.getElementById('btn-create-lobby').disabled = false;
        }

        function syncLobbyData(name, hero, tier, isHost) {
            globalPlayers.push({name: name, hero: hero, tier: tier, isHost: isHost});
            drawCentralGrid(globalPlayers);
        }

        function drawCentralGrid(list) {
            const grid = document.getElementById('player-mesh');
            grid.innerHTML = "";
            list.forEach(player => {
                grid.innerHTML += `
                    <div class="lobby-card">
                        ${player.isHost ? '<span class="host-indicator">HOST</span>' : ''}
                        <div class="avatar-frame-wrapper">
                            <div class="ornament-border ornament-${player.tier}"></div>
                            <div class="core-avatar" style="background-image: url('${animeHeroes[player.hero].url}')"></div>
                        </div>
                        <div class="player-tag-name">${player.name}</div>
                    </div>
                `;
            });
        }

        function broadcastLobby(payload) {
            connections.forEach(c => { if(c.open) c.send(payload); });
        }

        function disconnectLobby() {
            if(peer) peer.destroy();
            connections = []; globalPlayers = [];
            switchScreen('screen-choice');
        }

        function copyCode() {
            const code = document.getElementById('room-id-display').innerText;
            navigator.clipboard.writeText(code);
            alert("Lobby ID copied: " + code);
        }
    </script>
</body>
</html>
