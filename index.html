<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse Mafia | سفينة الظلام 🩸</title>
    
    <!-- خطوط عربية -->
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@300;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-night: #020205;
            --bg-day: #1a1a24;
            --glass-bg: rgba(10, 10, 15, 0.7);
            --neon-red: #ff003c;
            --blood-dark: #6e0015;
            --day-blue: #4a90e2;
            --text-main: #f4f4f9;
            --text-muted: #888899;
            --gold: #ffb703;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Changa', sans-serif; user-select: none; }

        body {
            background-color: var(--bg-night);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 1s ease;
        }

        body.day-mode { background-color: var(--bg-day); }

        /* --- التصميم الزجاجي --- */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 0, 60, 0.15);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        /* --- الأزرار --- */
        .btn {
            background: linear-gradient(135deg, var(--neon-red), var(--blood-dark));
            color: white; border: none; padding: 12px 25px; font-size: 18px; font-weight: 700;
            border-radius: 10px; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(255, 0, 60, 0.4);
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(255, 0, 60, 0.6); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
        
        .btn-day { background: linear-gradient(135deg, #2c3e50, #3498db); box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4); }
        .btn-day:hover { box-shadow: 0 8px 25px rgba(52, 152, 219, 0.6); }

        /* --- الشاشات --- */
        .screen { display: none; width: 100%; max-width: 1400px; padding: 20px; flex-direction: column; align-items: center; animation: fadeIn 0.5s; }
        .screen.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- الأفاتار المظلم (بدال الكيوت) --- */
        .avatar-icon {
            width: 80px; height: 80px; border-radius: 15px; background: #111; border: 2px solid #333;
            display: flex; align-items: center; justify-content: center; font-size: 40px; color: #fff;
            cursor: pointer; transition: 0.3s;
        }
        .avatar-icon:hover, .avatar-icon.selected { border-color: var(--neon-red); color: var(--neon-red); box-shadow: 0 0 20px rgba(255,0,60,0.5); transform: scale(1.1); }
        .target-avatar-icon { width: 60px; height: 60px; font-size: 30px; margin: 0 auto 10px; border-radius: 50%; background: #000; border: 2px solid #444; display: flex; align-items: center; justify-content: center; }

        /* --- تصميم داخل اللعبة --- */
        .game-layout { display: flex; gap: 20px; width: 100%; align-items: stretch; margin-top: 20px; height: 85vh; }
        
        /* 1. قسم الدردشة */
        .chat-section { flex: 1; display: flex; flex-direction: column; padding: 15px; border-color: rgba(255,255,255,0.1); }
        .chat-box { flex: 1; overflow-y: auto; background: rgba(0,0,0,0.5); border-radius: 10px; padding: 15px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 8px 12px; border-radius: 8px; font-size: 14px; max-width: 85%; width: fit-content; }
        .msg.sys { background: transparent; color: var(--gold); text-align: center; width: 100%; font-weight: bold; max-width: 100%; border-bottom: 1px dashed #555; border-radius: 0; }
        .msg.other { background: #222; border-left: 3px solid #555; }
        .msg.me { background: #3a0010; border-right: 3px solid var(--neon-red); align-self: flex-end; }
        .chat-input-area { display: flex; gap: 10px; }
        .chat-input-area input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #111; color: white; outline: none; }

        /* 2. قسم الساحة */
        .arena-section { flex: 2; padding: 20px; display: flex; flex-direction: column; text-align: center; }
        .phase-banner { padding: 15px; border-radius: 10px; font-size: 24px; font-weight: bold; margin-bottom: 20px; background: rgba(0,0,0,0.8); border: 1px solid var(--neon-red); box-shadow: 0 0 20px rgba(255,0,60,0.3); }
        body.day-mode .phase-banner { border-color: var(--day-blue); box-shadow: 0 0 20px rgba(52, 152, 219, 0.3); color: var(--day-blue); }
        
        .arena-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; }
        .target-card { background: rgba(20,20,25,0.8); border: 2px solid #333; border-radius: 15px; padding: 15px 10px; cursor: pointer; transition: 0.3s; position: relative; }
        .target-card:hover { transform: translateY(-5px); border-color: #666; }
        .target-card.selected { border-color: var(--neon-red); box-shadow: 0 0 15px rgba(255,0,60,0.5); }
        body.day-mode .target-card.selected { border-color: var(--day-blue); box-shadow: 0 0 15px rgba(52, 152, 219, 0.5); }
        .target-card.dead { filter: grayscale(100%) opacity(0.5); pointer-events: none; border-color: #000; }
        .vote-badge { position: absolute; top: -10px; right: -10px; background: var(--neon-red); color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; display: none; }

        /* 3. قسم بطاقتي */
        .my-section { flex: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; border-color: var(--neon-red); }
        .role-icon { font-size: 80px; color: var(--neon-red); text-shadow: 0 0 30px rgba(255,0,60,0.6); margin-bottom: 10px; }
        .role-title { color: var(--neon-red); font-size: 28px; }

        /* شاشة النهاية */
        #end-screen h1 { font-size: 60px; margin-bottom: 20px; }
        .win-mafia { color: var(--neon-red); text-shadow: 0 0 20px var(--neon-red); }
        .win-town { color: var(--day-blue); text-shadow: 0 0 20px var(--day-blue); }

        @media (max-width: 1000px) {
            .game-layout { flex-direction: column; height: auto; }
            .chat-section { height: 300px; }
        }
    </style>
</head>
<body>

    <!-- 1. شاشة التسجيل -->
    <div id="screen-setup" class="screen active">
        <div class="glass-panel" style="padding: 40px; width: 100%; max-width: 500px; text-align: center;">
            <h1 style="color: var(--neon-red); margin-bottom: 30px; font-size: 40px;">المافيا العكسية</h1>
            
            <input type="text" id="p-name" placeholder="أدخل اسمك..." style="width: 100%; padding: 15px; border-radius: 10px; background: #111; border: 1px solid #444; color: white; font-size: 18px; margin-bottom: 20px;">
            
            <p style="text-align: right; margin-bottom: 10px; color: #aaa;">اختر قناعك:</p>
            <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 30px;" id="avatar-grid">
                <!-- الأيقونات المظلمة -->
                <div class="avatar-icon selected" data-icon="fa-user-secret"><i class="fa-solid fa-user-secret"></i></div>
                <div class="avatar-icon" data-icon="fa-user-ninja"><i class="fa-solid fa-user-ninja"></i></div>
                <div class="avatar-icon" data-icon="fa-mask"><i class="fa-solid fa-mask"></i></div>
                <div class="avatar-icon" data-icon="fa-crow"><i class="fa-solid fa-crow"></i></div>
                <div class="avatar-icon" data-icon="fa-skull"><i class="fa-solid fa-skull"></i></div>
            </div>

            <button class="btn" onclick="startGame()" style="width: 100%;">صعود السفينة <i class="fa-solid fa-ship"></i></button>
        </div>
    </div>

    <!-- 2. ساحة اللعب الرئيسية -->
    <div id="screen-game" class="screen">
        <div class="game-layout">
            
            <!-- الدردشة -->
            <div class="chat-section glass-panel">
                <h3 style="margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 10px;"><i class="fa-solid fa-comments"></i> الساحة العامة</h3>
                <div class="chat-box" id="chat-messages">
                    <div class="msg sys">مرحباً بك في سفينة الظلام. لا تثق بأحد.</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="اكتب رسالتك..." onkeypress="handleChat(event)">
                    <button class="btn" style="padding: 10px;" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>

            <!-- الساحة وحالة الوقت -->
            <div class="arena-section glass-panel">
                <div class="phase-banner" id="phase-display">
                    🌙 الليل: المافيا تختار ضحيتها (<span id="timer">15</span>ث)
                </div>
                <div class="arena-grid" id="arena-players">
                    <!-- سيتم إضافة اللاعبين هنا -->
                </div>
            </div>

            <!-- بطاقتي وقدراتي -->
            <div class="my-section glass-panel">
                <div class="role-icon"><i class="fa-solid fa-user-secret"></i></div>
                <h2 class="role-title">أنت المافيا</h2>
                <p style="color: #ccc; text-align: center; font-size: 14px;">
                    اقتل المواطنين في الليل، واكذب في النهار لتبعد الشبهات عنك.
                </p>
                <div style="width: 100%; margin-top: 20px; display: flex; flex-direction: column; gap: 10px;">
                    <button class="btn" id="btn-action" onclick="confirmAction()">
                        <i class="fa-solid fa-khanda"></i> اغتيال الهدف
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- 3. شاشة النهاية -->
    <div id="screen-end" class="screen">
        <div class="glass-panel" style="padding: 50px; text-align: center;" id="end-content">
            <!-- رسالة الفوز -->
        </div>
        <button class="btn" style="margin-top: 20px;" onclick="location.reload()">لعب مرة أخرى</button>
    </div>

    <script>
        // المتغيرات
        let myName = "مجهول";
        let myIcon = "fa-user-secret";
        let phase = "night"; // night, day, vote
        let timeLeft = 15;
        let timerInterval;
        let currentTarget = null;
        let actionDone = false;

        // اللاعبين (1 مافيا "أنت" و 4 مواطنين)
        let players = [
            { id: 0, name: "أنت", icon: "", role: "mafia", isDead: false, votes: 0 },
            { id: 1, name: "Ghost", icon: "fa-ghost", role: "town", isDead: false, votes: 0 },
            { id: 2, name: "Viper", icon: "fa-mask", role: "town", isDead: false, votes: 0 },
            { id: 3, name: "Reaper", icon: "fa-skull", role: "town", isDead: false, votes: 0 },
            { id: 4, name: "Shadow", icon: "fa-crow", role: "town", isDead: false, votes: 0 }
        ];

        // اختيار القناع
        document.querySelectorAll('.avatar-icon').forEach(el => {
            el.onclick = () => {
                document.querySelectorAll('.avatar-icon').forEach(i => i.classList.remove('selected'));
                el.classList.add('selected');
                myIcon = el.getAttribute('data-icon');
            };
        });

        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // بدء اللعبة
        function startGame() {
            myName = document.getElementById('p-name').value.trim() || "شبح";
            players[0].name = myName;
            players[0].icon = myIcon;
            
            switchScreen('screen-game');
            startNight();
        }

        // رسم الساحة
        function renderArena() {
            const arena = document.getElementById('arena-players');
            arena.innerHTML = '';
            
            players.forEach(p => {
                if(p.id === 0) return; // لا تظهر نفسك في قائمة الأهداف

                const isDead = p.isDead ? 'dead' : '';
                const isSelected = currentTarget === p.id ? 'selected' : '';
                
                arena.innerHTML += `
                    <div class="target-card ${isDead} ${isSelected}" onclick="selectTarget(${p.id})">
                        <div class="vote-badge" id="vote-${p.id}">${p.votes}</div>
                        <div class="target-avatar-icon"><i class="fa-solid ${p.icon}"></i></div>
                        <h3 style="color: white; font-size: 16px;">${p.name}</h3>
                        ${p.isDead ? '<p style="color:red; font-size:12px; font-weight:bold;">ميت 💀</p>' : ''}
                    </div>
                `;
            });
        }

        function selectTarget(id) {
            if(players[id].isDead || actionDone) return;
            currentTarget = id;
            renderArena();
        }

        // --- نظام الدردشة ---
        function handleChat(e) { if(e.key === 'Enter') sendMessage(); }
        function sendMessage(msgText = null, sender = 'me', senderName = '') {
            const input = document.getElementById('chat-input');
            const text = msgText || input.value.trim();
            if(!text && sender === 'me') return;
            if(players[0].isDead && sender === 'me') { sysMsg("لا يمكن للموتى التحدث!"); return; }

            const chat = document.getElementById('chat-messages');
            if(sender === 'me') {
                chat.innerHTML += `<div class="msg me"><strong>أنت:</strong> ${text}</div>`;
                input.value = '';
            } else if(sender === 'sys') {
                chat.innerHTML += `<div class="msg sys">${text}</div>`;
            } else {
                chat.innerHTML += `<div class="msg other"><strong>${senderName}:</strong> ${text}</div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }
        function sysMsg(text) { sendMessage(text, 'sys'); }

        // --- محرك اللعبة (Game Loop) ---

        function startNight() {
            phase = "night";
            timeLeft = 15;
            actionDone = false;
            currentTarget = null;
            document.body.classList.remove('day-mode');
            
            document.getElementById('phase-display').innerHTML = `🌙 الليل: المافيا تختار ضحيتها (<span id="timer">${timeLeft}</span>ث)`;
            
            const btn = document.getElementById('btn-action');
            btn.className = 'btn';
            btn.innerHTML = '<i class="fa-solid fa-khanda"></i> اغتيال الهدف';
            btn.disabled = false;

            sysMsg("المدينة تنام... المافيا تستيقظ للقتل.");
            renderArena();
            runTimer(endNight);
        }

        function confirmAction() {
            if(currentTarget === null) { alert("حدد هدفاً أولاً!"); return; }
            if(actionDone) return;

            if(phase === 'night') {
                // المافيا تقتل
                players[currentTarget].isDead = true;
                actionDone = true;
                document.getElementById('btn-action').disabled = true;
                sysMsg(`قمت بتحديد ${players[currentTarget].name} للاغتيال.`);
            } else if(phase === 'vote') {
                // المافيا تصوت
                players[currentTarget].votes++;
                actionDone = true;
                document.getElementById('btn-action').disabled = true;
                sysMsg(`قمت بالتصويت ضد ${players[currentTarget].name}.`);
                renderArena();
            }
        }

        function endNight() {
            if(!checkWin()) startDay();
        }

        function startDay() {
            phase = "day";
            timeLeft = 20; // 20 ثانية للنقاش
            document.body.classList.add('day-mode');
            
            document.getElementById('phase-display').innerHTML = `☀️ النهار: نقاش واتهامات (<span id="timer">${timeLeft}</span>ث)`;
            document.getElementById('btn-action').disabled = true;

            sysMsg("أشرقت الشمس... تم العثور على جثة!");
            renderArena();

            // محاكاة بوتات تتحدث في الدردشة
            setTimeout(() => { simulateBotChat(); }, 2000);
            
            runTimer(startVote);
        }

        function simulateBotChat() {
            const aliveBots = players.filter(p => !p.isDead && p.id !== 0);
            if(aliveBots.length === 0) return;
            
            const bot1 = aliveBots[Math.floor(Math.random() * aliveBots.length)];
            sendMessage("أنا شاك في هذا اللاعب الجديد 🧐", 'other', bot1.name);
            
            setTimeout(() => {
                const bot2 = aliveBots[Math.floor(Math.random() * aliveBots.length)];
                if(bot2) sendMessage("والله ما أدري، بس نحتاج نصوت على أحد!", 'other', bot2.name);
            }, 5000);
        }

        function startVote() {
            phase = "vote";
            timeLeft = 15;
            actionDone = false;
            currentTarget = null;
            players.forEach(p => p.votes = 0); // تصفير الأصوات
            
            document.getElementById('phase-display').innerHTML = `⚖️ التصويت: من هو الخائن؟ (<span id="timer">${timeLeft}</span>ث)`;
            
            const btn = document.getElementById('btn-action');
            btn.className = 'btn btn-day';
            btn.innerHTML = '<i class="fa-solid fa-gavel"></i> تصويت للإعدام';
            btn.disabled = players[0].isDead; // إذا كنت ميت ما تصوت

            sysMsg("حان وقت التصويت! حدد المشتبه به.");
            renderArena();
            
            // محاكاة تصويت البوتات (تصويت عشوائي)
            setTimeout(() => { simulateBotVotes(); }, 5000);

            runTimer(endVote);
        }

        function simulateBotVotes() {
            const aliveBots = players.filter(p => !p.isDead && p.id !== 0);
            const allAlive = players.filter(p => !p.isDead);
            
            aliveBots.forEach(bot => {
                // البوت يصوت لشخص عشوائي حي
                const randomTarget = allAlive[Math.floor(Math.random() * allAlive.length)];
                randomTarget.votes++;
            });
            renderArena();
            // إظهار البادج
            document.querySelectorAll('.vote-badge').forEach(b => {
                if(b.innerText !== "0") b.style.display = 'flex';
            });
        }

        function endVote() {
            // حساب من حصل على أعلى أصوات
            let highestVotes = -1;
            let executedPlayer = null;
            let tie = false;

            players.forEach(p => {
                if(p.votes > highestVotes) {
                    highestVotes = p.votes;
                    executedPlayer = p;
                    tie = false;
                } else if (p.votes === highestVotes && highestVotes > 0) {
                    tie = true;
                }
            });

            if(executedPlayer && !tie && highestVotes > 0) {
                executedPlayer.isDead = true;
                sysMsg(`⚖️ تم إعدام [ ${executedPlayer.name} ] بالأغلبية!`);
                if(executedPlayer.id === 0) {
                    sysMsg("لقد تم إعدامك! المافيا سقطت.");
                } else {
                    sysMsg(`${executedPlayer.name} كان مواطناً بريئاً...`);
                }
            } else {
                sysMsg("⚖️ لم يتم الاتفاق على إعدام أحد (تعادل أو لا يوجد تصويت).");
            }

            renderArena();
            setTimeout(() => {
                document.querySelectorAll('.vote-badge').forEach(b => b.style.display = 'none');
                if(!checkWin()) startNight();
            }, 3000);
        }

        function checkWin() {
            const aliveTown = players.filter(p => p.role === 'town' && !p.isDead).length;
            const mafiaDead = players[0].isDead; // لأنك أنت المافيا الوحيدة حالياً

            if(mafiaDead) {
                showEndScreen('town'); return true;
            } else if (aliveTown === 0) {
                showEndScreen('mafia'); return true;
            }
            return false;
        }

        function showEndScreen(winner) {
            clearInterval(timerInterval);
            switchScreen('screen-end');
            const box = document.getElementById('end-content');
            
            if(winner === 'mafia') {
                box.innerHTML = `
                    <h1 class="win-mafia"><i class="fa-solid fa-skull"></i> المافيا تنتصر</h1>
                    <p style="font-size:20px;">نجحت في القضاء على جميع المواطنين وتضليل العدالة.</p>
                `;
            } else {
                box.innerHTML = `
                    <h1 class="win-town"><i class="fa-solid fa-dove"></i> المواطنون ينتصرون</h1>
                    <p style="font-size:20px;">تم كشفك وإعدامك. العدالة أخذت مجراها.</p>
                `;
            }
        }

        function runTimer(callback) {
            clearInterval(timerInterval);
            const tDisplay = document.getElementById('timer');
            timerInterval = setInterval(() => {
                timeLeft--;
                tDisplay.innerText = timeLeft;
                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    callback();
                }
            }, 1000);
        }
    </script>
</body>
</html>
