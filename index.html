<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ascension - Mythic Custom Lobby</title>
    <!-- استدعاء الأيقونات الفخمة والخطوط السينمائية -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Orbitron:wght@500;700;900&family=Cairo:wght@600;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030305;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: url('background2.png') no-repeat center center;
            background-size: cover;
            display: flex;
        }

        .game-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 20%, rgba(0,0,0,0.85) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .screen {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            z-index: 2;
            width: 100%;
            height: 100%;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.98); 
        }

        /* شاشة START الأصلية الحرة أسفل اليمين */
        #screen-start {
            align-items: flex-end;
            justify-content: flex-end;
            padding-bottom: 8%;
            padding-right: 10%;
        }

        .sony-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Orbitron', 'Cinzel', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
            padding: 5px 15px;
        }

        .sony-btn::after {
            content: '';
            width: 0;
            height: 3px;
            background-color: #00f0ff; 
            position: absolute;
            bottom: -5px;
            right: 0;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px #00f0ff;
        }

        .sony-btn:hover {
            color: #ffffff;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6), 2px 2px 4px rgba(0, 0, 0, 1);
            transform: translateX(-5px);
        }

        .sony-btn:hover::after { width: 100%; }
        .start-title { font-size: 3.5rem; letter-spacing: 8px; color: #ffffff; }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .input-label {
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .sony-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px;
            font-size: 1.6rem;
            font-family: 'Cairo', 'Orbitron', sans-serif;
            text-align: center;
            outline: none;
            width: 350px;
        }

        .sony-input:focus { border-bottom-color: #00f0ff; }

        /* 🎭 واجهة التخصيص الاحترافية الغامضة بدون مربعات شفافة */
        .free-customizer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 100px; 
            width: 90%;
            max-width: 1000px;
        }

        .controls-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 45%;
        }

        .select-trigger-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 14px 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            letter-spacing: 2px;
            cursor: pointer;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .select-trigger-btn:hover {
            border-color: #00f0ff;
            background: rgba(0, 240, 255, 0.05);
        }

        .pop-menu {
            display: none;
            flex-direction: column;
            gap: 8px;
            background: rgba(15, 15, 22, 0.98);
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 10px;
            position: absolute;
            width: 337px;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .pop-opt {
            padding: 10px;
            color: rgba(255,255,255,0.7);
            font-family: 'Orbitron', 'Cairo', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pop-opt:hover, .pop-opt.selected {
            background: rgba(0, 240, 255, 0.15);
            color: #fff;
        }

        .preview-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 45%;
            gap: 25px;
        }

        /* 👑 هندسة وهيكلة الإطارات الجديدة واللاصقة */
        .avatar-frame-wrapper {
            position: relative;
            width: 150px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .core-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            z-index: 2;
            box-shadow: 0 0 15px rgba(0,0,0,0.6);
        }

        .ornament-border {
            position: absolute;
            width: 100px; 
            height: 100px; 
            z-index: 3;
            pointer-events: none;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        /* 💎 1. طراز الدايموند المشع والملمع */
        .ornament-diamond {
            border: 4px solid #b9f2ff;
            box-shadow: 0 0 20px #00f0ff, inset 0 0 15px rgba(0, 240, 255, 0.5);
            background: linear-gradient(135deg, transparent 35%, rgba(255,255,255,0.7) 50%, transparent 65%);
            background-size: 300% 300%;
            animation: diamondGlow 2.5s infinite linear;
        }

        /* 🌌 2. طراز الجلاكسي المحاط بزخارف وفروع الشجر الحادة */
        .ornament-galaxy {
            border: 4px solid #a855f7;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.6), inset 0 0 10px rgba(0,0,0,0.8);
            background: radial-gradient(circle, transparent 50%, #2e1065 100%);
        }
        /* زخرفة فروع شجر يمين ويسار منبثقة وملتصقة بالحافة */
        .ornament-galaxy::before, .ornament-galaxy::after {
            content: '\f1bb'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
            font-size: 1.4rem; color: #d8b4fe; position: absolute; top: 25%;
            text-shadow: 0 0 12px #a855f7;
        }
        .ornament-galaxy::before { left: -18px; transform: rotate(-45deg); }
        .ornament-galaxy::after { right: -18px; transform: rotate(45deg) scaleX(-1); }

        /* 🥉 3. طراز برونزي بالأجنحة */
        .ornament-bronze { border: 4px solid #cd7f32; }
        .ornament-bronze::before, .ornament-bronze::after {
            content: ''; position: absolute; top: 30%; width: 16px; height: 35px; background: #cd7f32; clip-path: polygon(0 0, 100% 50%, 0 100%);
        }
        .ornament-bronze::before { left: -15px; transform: scaleX(-1); }
        .ornament-bronze::after { right: -15px; }

        /* 🥇 4. طراز ذهبي أسطوري بالنجوم الخمسة المتراصة */
        .ornament-gold {
            border: 5px solid #ffd700;
            box-shadow: 0 0 20px rgba(255,215,0,0.3);
        }
        .ornament-gold::before {
            content: ''; position: absolute; top: 10%; left: -12px; right: -12px; bottom: 30%;
            border: 3px solid #ffd700; border-bottom: none; border-radius: 50px 50px 0 0; z-index: -1;
        }
        .ornament-gold::after {
            content: '\f005  \f005  \f005  \f005  \f005';
            font-family: 'Font Awesome 6 Free'; font-weight: 900;
            font-size: 0.65rem; color: #ffd700; position: absolute; bottom: -16px; left: 50%;
            transform: translateX(-50%); white-space: nowrap; letter-spacing: 1px;
            text-shadow: 0 0 6px #ffd700, 1px 1px 2px #000;
        }

        .player-tag-name {
            font-family: 'Cairo', sans-serif;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 800;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* اللوبي المركزي المشابه لألعاب الاونلاين */
        .central-lobby {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            width: 100%;
        }

        .central-player-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 65px; /* مسافة لحماية أوراق الشجر والأجنحة من التداخل */
            flex-wrap: wrap;
            width: 90%;
        }

        .lobby-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        /* 👑 تعديل رقم الغرفة بلون ذهبي بلاتيني فخم بدلاً من الأزرق القبيح */
        .room-badge {
            font-family: 'Orbitron', sans-serif;
            color: #ffdf00; /* لون ذهبي بلاتيني ساطع ودافئ */
            font-size: 2.6rem;
            font-weight: 900;
            letter-spacing: 5px;
            text-shadow: 0 0 20px rgba(255, 223, 0, 0.6), 2px 2px 4px #000;
            margin-top: 5px;
        }

        .host-indicator {
            position: absolute;
            top: -22px;
            background: #ffdf00;
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 3px;
            box-shadow: 0 0 10px #ffdf00;
            z-index: 10;
        }

        .back-mini-btn { font-size: 1.3rem; color: rgba(255, 255, 255, 0.3); }
        .back-mini-btn:hover { color: #ff4a4a; }
        .back-mini-btn:hover::after { background-color: #ff4a4a; }

        .lobby-action-row {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        @keyframes diamondGlow {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        
        <!-- صفحة 1: شاشة البدء النظيفة -->
        <div id="screen-start" class="screen">
            <button class="sony-btn start-title" onclick="switchScreen('screen-identity')">START</button>
        </div>

        <!-- صفحة 2: التخصيص الاحترافي الغامض (Dropdown Style) -->
        <div id="screen-identity" class="screen hidden">
            <div class="free-customizer">
                <div class="controls-column">
                    <div class="input-group" style="align-items: flex-start; width: 100%; margin-bottom: 10px;">
                        <span class="input-label">PLAYER NAME</span>
                        <input type="text" id="player-name" class="sony-input" placeholder="ENTER NAME..." maxlength="12" style="text-align: left; width: 100%;">
                    </div>
                    
                    <!-- منسدلة اختيار الصورة -->
                    <div style="position: relative;">
                        <button class="select-trigger-btn" onclick="toggleMenu('pop-hero')">
                            <span>CHOOSE HERO AVATAR</span> <i class="fa-solid fa-chevron-down"></i>
                        </button>
                        <div class="pop-menu" id="pop-hero">
                            <div class="pop-opt selected" onclick="changeHero('shadow')">SHADOW NINJA</div>
                            <div class="pop-opt" onclick="changeHero('blaze')">BLAZE SAMURAI</div>
                            <div class="pop-opt" onclick="changeHero('frost')">FROST MAGE</div>
                            <div class="pop-opt" onclick="changeHero('volt')">VOLT STRIKER</div>
                        </div>
                    </div>

                    <!-- منسدلة اختيار الإطارات الجديدة الفخمة واللاصقة -->
                    <div style="position: relative;">
                        <button class="select-trigger-btn" onclick="toggleMenu('pop-tier')">
                            <span>CHOOSE BORDER ORNAMENT</span> <i class="fa-solid fa-chevron-down"></i>
                        </button>
                        <div class="pop-menu" id="pop-tier">
                            <div class="pop-opt selected" onclick="changeOrnament('diamond')">DIAMOND SHINE 💎</div>
                            <div class="pop-opt" onclick="changeOrnament('galaxy')">GALAXY & TREES 🌌</div>
                            <div class="pop-opt" onclick="changeOrnament('bronze')">BRONZE WINGS</div>
                            <div class="pop-opt" onclick="changeOrnament('gold')">MYTHIC GOLD ★</div>
                        </div>
                    </div>
                </div>

                <div class="preview-column">
                    <span class="input-label">IDENTITY PREVIEW</span>
                    <div class="avatar-frame-wrapper">
                        <div id="ornament-live-border" class="ornament-border ornament-diamond"></div>
                        <div id="avatar-live-core" class="core-avatar"></div>
                    </div>
                    
                    <!-- صف الأزرار الجديد: إنشاء أو انضمام مباشرة وبضغطة واحدة -->
                    <div class="lobby-action-row">
                        <button class="sony-btn" onclick="buildLobby('create')" style="font-size:1.3rem; color: #00f0ff;">CREATE ROOM</button>
                        <button class="sony-btn" onclick="buildLobby('join')" style="font-size:1.3rem;">JOIN ROOM</button>
                    </div>
                </div>
            </div>
            <button class="sony-btn back-mini-btn" onclick="switchScreen('screen-start')">BACK</button>
        </div>

        <!-- صفحة 3: شاشة اللوبي المركزي الفخم (الرقم الذهبي واللاعبين بالمنتصف) -->
        <div id="screen-lobby" class="screen hidden">
            <div class="central-lobby">
                <div style="text-align: center;">
                    <span class="input-label" style="opacity:0.4;">MULTIPLAYER MATCHMAKING</span>
                    <!-- رقم الغرفة باللون الفخم الجديد -->
                    <div class="room-badge" id="lobby-room-number">ROOM-7749</div>
                </div>

                <!-- تظهر هنا الهويات في المنتصف بجانب بعضها بالزخارف والأشجار والدايموند -->
                <div class="central-player-grid" id="player-mesh"></div>

                <div class="lobby-buttons">
                    <button class="sony-btn" style="color: #00ff88;" onclick="alert('Launching Match Instance...')">LAUNCH MATCH</button>
                    <button class="sony-btn back-mini-btn" onclick="switchScreen('screen-identity')">LEAVE LOBBY</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const animeHeroes = {
            'shadow': { url: 'https://api.dicebear.com/7.x/bottts-neutral/svg?seed=shadow&backgroundColor=312e81' },
            'blaze': { url: 'https://api.dicebear.com/7.x/bottts-neutral/svg?seed=blaze&backgroundColor=991b1b' },
            'frost': { url: 'https://api.dicebear.com/7.x/bottts-neutral/svg?seed=frost&backgroundColor=065f46' },
            'volt': { url: 'https://api.dicebear.com/7.x/bottts-neutral/svg?seed=volt&backgroundColor=854d0e' }
        };

        let currentHero = 'shadow';
        let currentOrnament = 'diamond';
        let pName = "";

        function toggleMenu(menuId) {
            const menu = document.getElementById(menuId);
            const isVisible = menu.style.display === 'flex';
            document.querySelectorAll('.pop-menu').forEach(m => m.style.display = 'none');
            menu.style.display = isVisible ? 'none' : 'flex';
            event.stopPropagation();
        }

        document.addEventListener('click', () => {
            document.querySelectorAll('.pop-menu').forEach(m => m.style.display = 'none');
        });

        function changeHero(key) {
            currentHero = key;
            document.getElementById('avatar-live-core').style.backgroundImage = `url('${animeHeroes[key].url}')`;
            document.querySelectorAll('#pop-hero .pop-opt').forEach(el => el.classList.remove('selected'));
            event.target.classList.add('selected');
        }

        function changeOrnament(tier) {
            currentOrnament = tier;
            const border = document.getElementById('ornament-live-border');
            border.className = 'ornament-border';
            border.classList.add(`ornament-${tier}`);
            document.querySelectorAll('#pop-tier .pop-opt').forEach(el => el.classList.remove('selected'));
            event.target.classList.add('selected');
        }

        // تفعيل المعاينة الافتراضية للدايموند والشادو نينجا
        document.getElementById('avatar-live-core').style.backgroundImage = `url('${animeHeroes['shadow'].url}')`;

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
        }

        // 🚀 نظام محاكاة الغرف الفوري والمحترف من أول ضغطة
        function buildLobby(actionType) {
            pName = document.getElementById('player-name').value.trim();
            if(!pName) { alert("Please type your profile name first!"); return; }
            
            const grid = document.getElementById('player-mesh');
            const roomText = document.getElementById('lobby-room-number');
            
            if(actionType === 'create') {
                roomText.innerText = "ROOM-" + Math.floor(1000 + Math.random() * 9000);
                
                // إنشاء غرفة: يظهر اسمك كـ HOST في المنتصف
                grid.innerHTML = `
                    <div class="lobby-card">
                        <span class="host-indicator">HOST</span>
                        <div class="avatar-frame-wrapper">
                            <div class="ornament-border ornament-${currentOrnament}"></div>
                            <div class="core-avatar" style="background-image: url('${animeHeroes[currentHero].url}')"></div>
                        </div>
                        <div class="player-tag-name">${pName}</div>
                    </div>
                `;
            } else {
                // انضمام لغرفة: محاكاة دخول اللوبي مع أخيك أو أصدقائك الافتراضيين
                roomText.innerText = "ROOM-5521";
                grid.innerHTML = `
                    <!-- بطاقة صديقك أو أخيك المتصل معك -->
                    <div class="lobby-card">
                        <span class="host-indicator" style="background:#cd7f32; color:#fff;">PARTY</span>
                        <div class="avatar-frame-wrapper">
                            <div class="ornament-border ornament-galaxy"></div>
                            <div class="core-avatar" style="background-image: url('${animeHeroes['blaze'].url}')"></div>
                        </div>
                        <div class="player-tag-name">Bro_Player</div>
                    </div>
                    
                    <!-- بطاقتك أنت بالزخرفة التي اخترتها في المنتصف -->
                    <div class="lobby-card">
                        <div class="avatar-frame-wrapper">
                            <div class="ornament-border ornament-${currentOrnament}"></div>
                            <div class="core-avatar" style="background-image: url('${animeHeroes[currentHero].url}')"></div>
                        </div>
                        <div class="player-tag-name">${pName}</div>
                    </div>
                `;
            }
            
            // الانتقال الفوري والمضمون للوبي المركزي
            switchScreen('screen-lobby');
        }
    </script>
</body>
</html>
