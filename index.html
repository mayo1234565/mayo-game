<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏎️ NEON RALLY: MULTIPLAYER 7 🏎️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Orbitron:wght@700;900&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #0a0a12; font-family: 'Cairo', 'Orbitron', sans-serif; color: #fff; }
        
        canvas { display: block; width: 100vw; height: calc(100vh - 120px); background: #11111e; }

        /* واجهة قائمة الدخول */
        .overlay { position: absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; background: rgba(10,10,18,0.95); z-index:100; padding: 20px; }
        .setup-box { background: rgba(255,255,255,0.03); border: 2px solid #00f0ff; padding: 30px; border-radius: 15px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 0 30px rgba(0,240,255,0.2); }
        input { width: 100%; padding: 12px; background: #000; border: 1px solid #ff0055; color: #fff; text-align: center; font-size: 1.2rem; margin-bottom: 15px; border-radius: 8px; }
        
        .neon-btn { background: transparent; border: 2px solid #00f0ff; color: #00f0ff; padding: 15px; font-size: 1.2rem; font-weight: bold; cursor: pointer; border-radius: 8px; width: 100%; text-shadow: 0 0 10px #00f0ff; box-shadow: 0 0 15px rgba(0,240,255,0.2); transition: 0.2s; }
        .neon-btn:active { background: #00f0ff; color: #000; transform: scale(0.98); }

        /* شاشة التحكم السفلية المريحة للجوال */
        .controls-container { height: 120px; width: 100%; background: #07070d; display: grid; grid-template-columns: 1fr 1.2fr 1fr; border-top: 2px solid #222; }
        .ctrl-btn { display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 900; background: rgba(255,255,255,0.02); color: #888; }
        .ctrl-btn:active { background: rgba(0, 240, 255, 0.1); color: #00f0ff; }
        .btn-gas { background: rgba(0, 255, 136, 0.05); color: #00ff88; font-size: 1.5rem; border-left: 1px solid #222; border-right: 1px solid #222; }
        .btn-gas:active { background: #00ff88; color: #000; }

        #hud { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 20px; font-size: 0.9rem; border: 1px solid #333; pointer-events: none; }
    </style>
</head>
<body>

    <div id="hud">اللاعبين في الغرفة: <span id="p-count" style="color:#00f0ff;">1</span>/7</div>

    <div id="lobby-menu" class="overlay">
        <h1 style="font-size: 2.5rem; color: #ff0055; text-shadow: 0 0 15px #ff0055; margin-bottom: 20px;">🏎️ NEON RALLY 7</h1>
        <div class="setup-box">
            <input type="text" id="username-input" placeholder="أدخل اسم السائق..." maxlength="10">
            <button class="neon-btn" onclick="joinRace()">دخول حلبة السباق 🏁</button>
        </div>
    </div>

    <canvas id="raceCanvas"></canvas>

    <div class="controls-container">
        <div class="ctrl-btn" id="btn-left">◀</div>
        <div class="ctrl-btn btn-gas" id="btn-gas">اضغط للسرعة ⚡</div>
        <div class="ctrl-btn" id="btn-right">▶</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        // إعداد الاتصال بـ Firebase (تلقائي للتجربة المحلية أو ضع مفاتيحك الخاصة)
        let db;
        const roomCode = "RACE-777"; 
        let myPlayerId = "p_" + Math.floor(Math.random() * 100000);
        let myName = "";

        try {
            const firebaseConfig = {
                apiKey: "AIzaSyCOGGmv-bjlZlBLr1T8tAvBtALAcp-7HEw",
                authDomain: "mayo-game.firebaseapp.com",
                databaseURL: "https://mayo-game-default-rtdb.europe-west1.firebasedatabase.app",
                projectId: "mayo-game"
            };
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        } catch (e) { console.error("Firebase info missing, running offline demo mode."); }

        const canvas = document.getElementById('raceCanvas');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight - 120;

        // الألوان المخصصة للسيارات السبعة لتمييزها
        const carColors = ['#00f0ff', '#ff0055', '#00ff88', '#ffdf00', '#ff00ff', '#ffffff', '#ff9900'];
        
        let localPlayers = {};
        let myInput = { left: false, right: false, gas: false };

        // دالة الدخول وتوليد السيارة
        function joinRace() {
            let inputName = document.getElementById('username-input').value.trim();
            myName = inputName ? inputName : "سائق_" + Math.floor(Math.random()*90);
            
            document.getElementById('lobby-menu').style.display = 'none';

            let startX = w / 2 + (Math.random() - 0.5) * 100;
            let randomColor = carColors[Math.floor(Math.random() * carColors.length)];

            let initialData = {
                id: myPlayerId,
                name: myName,
                x: startX,
                y: h - 100,
                angle: -Math.PI / 2,
                color: randomColor,
                score: 0
            };

            if (db) {
                // رفع بيانات سيارتك فوراً للسيرفر ليراها اللاعبون الآخرون
                db.ref(`rooms/${roomCode}/players/${myPlayerId}`).set(initialData);
                // الاستماع لتحركات بقية الـ 7 لاعبين ومزامنتهم
                db.ref(`rooms/${roomCode}/players`).on('value', snap => {
                    if (snap.exists()) {
                        localPlayers = snap.val();
                        document.getElementById('p-count').innerText = Object.keys(localPlayers).length;
                    }
                });
                // عند إغلاق الصفحة، تُحذف السيارة تلقائياً
                db.ref(`rooms/${roomCode}/players/${myPlayerId}`).onDisconnect().remove();
            } else {
                // نمط تجريبي محلي في حال عدم ربط الفايربيس
                localPlayers[myPlayerId] = initialData;
            }

            setupControls();
            requestAnimationFrame(gameLoop);
        }

        // إعداد أحداث اللمس الفورية للجوال
        function setupControls() {
            const bindBtn = (id, property) => {
                let el = document.getElementById(id);
                el.addEventListener('touchstart', (e) => { e.preventDefault(); myInput[property] = true; });
                el.addEventListener('touchend', (e) => { e.preventDefault(); myInput[property] = false; });
                el.addEventListener('mousedown', () => myInput[property] = true);
                el.addEventListener('mouseup', () => myInput[property] = false);
            };

            bindBtn('btn-left', 'left');
            bindBtn('btn-right', 'right');
            bindBtn('btn-gas', 'gas');
        }

        // المحرك الرسومي وحلقة التحديث (60 إطار في الثانية)
        function gameLoop() {
            // تنظيف الحلبة ورسم أرضية الطريق
            ctx.fillStyle = '#11111e';
            ctx.fillRect(0, 0, w, h);

            // رسم خطوط الطريق السريعة (المضمار النيوني)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 6;
            for(let i=1; i<4; i++) {
                ctx.beginPath();
                ctx.moveTo((w/4)*i, 0);
                ctx.lineTo((w/4)*i, h);
                ctx.stroke();
            }

            // تحديث سيارة اللاعب المحلي
            if (localPlayers[myPlayerId]) {
                let me = localPlayers[myPlayerId];

                if (myInput.left) me.angle -= 0.04;
                if (myInput.right) me.angle += 0.04;
                
                if (myInput.gas) {
                    me.x += Math.cos(me.angle) * 5;
                    me.y += Math.sin(me.angle) * 5;
                }

                // الحماية من الخروج من الشاشة
                if (me.x < 0) me.x = w; if (me.x > w) me.x = 0;
                if (me.y < 0) me.y = h; if (me.y > h) me.y = 0;

                // إرسال الإحداثيات الجديدة فوراً للفايربيس ليراها الـ 6 الآخرين على شاشاتهم
                if (db) {
                    db.ref(`rooms/${roomCode}/players/${myPlayerId}`).update({ x: me.x, y: me.y, angle: me.angle });
                }
            }

            // رسم جميع سيارات اللاعبين المتصلين حالياً (حتى 7 لاعبين)
            Object.keys(localPlayers).forEach(id => {
                let p = localPlayers[id];

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);

                // رسم مجسم السيارة النيوني المتألق
                ctx.shadowBlur = 12;
                ctx.shadowColor = p.color;
                ctx.fillStyle = p.color;
                
                // هيكل السيارة المستقبلي
                ctx.fillRect(-20, -10, 40, 20); 
                // الإطارات البارزة
                ctx.fillStyle = '#000';
                ctx.fillRect(-18, -13, 8, 3);
                ctx.fillRect(10, -13, 8, 3);
                ctx.fillRect(-18, 10, 8, 3);
                ctx.fillRect(10, 10, 8, 3);

                ctx.restore();
                ctx.shadowBlur = 0;

                // كتابة اسم السائق فوق سيارته مباشرة لمتابعته
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px Cairo';
                ctx.textAlign = 'center';
                ctx.fillText(p.name, p.x, p.y - 25);
            });

            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight - 120;
        });
    </script>
</body>
</html>
