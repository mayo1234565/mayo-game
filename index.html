<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة لعبة 7 لاعبين</title>
    <!-- استدعاء خط Cairo المميز من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f0c1b;
            --primary-glow: #3a1c71;
            --accent-color: #ffaf7b;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle, #1a103c 0%, var(--bg-color) 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
        }

        /* --- تصميم اللابتوب (شاشة عريضة) --- */
        .desktop-menu {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 30px;
        }

        .avatar-section {
            flex: 1;
            text-align: center;
            animation: float 3s ease-in-out infinite;
        }

        .avatar-placeholder {
            width: 150px;
            height: 150px;
            background: linear-gradient(45deg, #d76d77, #3a1c71);
            border-radius: 50%;
            margin: 0 auto 15px;
            box-shadow: 0 0 20px rgba(215, 109, 119, 0.5);
        }

        .main-navigation {
            flex: 2;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .menu-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* تأثير الارتداد والتوهج عند التمرير (Hover Effects) */
        .menu-btn:hover {
            transform: scale(1.05) translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-color);
            box-shadow: 0 0 25px rgba(255, 175, 123, 0.4);
        }

        .menu-btn:active {
            transform: scale(0.98);
        }

        .lobby-section {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .players-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .player-bubble {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.02);
            padding: 10px;
            border-radius: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 8px #2ecc71;
        }

        /* --- تصميم الجوال (مخفي افتراضياً ويظهر بالشاشات الصغيرة) --- */
        .mobile-menu {
            display: none;
        }

        /* أنيميشن التنفس والطفو للأفاتار */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- شاشات الجوال والتطوير التجاوبي (Responsive) --- */
        @media (max-width: 768px) {
            .desktop-menu {
                display: none; /* إخفاء قائمة اللابتوب */
            }

            .mobile-menu {
                display: flex;
                flex-direction: column;
                height: 90vh;
                justify-content: space-between;
                align-items: center;
            }

            /* الـ 7 لاعبين بشكل شبكة في الأعلى للجوال */
            .mobile-lobby {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
                width: 100%;
                justify-items: center;
                padding: 10px;
            }

            .mobile-player {
                width: 55px;
                height: 55px;
                background: #3a1c71;
                border-radius: 50%;
                border: 2px solid var(--accent-color);
                position: relative;
            }

            .mobile-player .status-dot {
                position: absolute;
                bottom: 2px;
                right: 2px;
            }

            /* محاكاة العجلة الديناميكية في الأسفل */
            .mobile-wheel-container {
                position: relative;
                width: 300px;
                height: 150px;
                overflow: hidden;
                margin-bottom: -20px;
            }

            .wheel-arc {
                width: 300px;
                height: 300px;
                border-radius: 50%;
                background: radial-gradient(circle, #241445 40%, #110727 100%);
                border: 4px solid rgba(255, 175, 123, 0.3);
                position: absolute;
                top: 0;
                display: flex;
                justify-content: center;
                align-items: flex-start;
                padding-top: 20px;
            }

            .wheel-center-btn {
                background: var(--accent-color);
                color: #000;
                border: none;
                padding: 15px 35px;
                border-radius: 30px;
                font-weight: bold;
                font-size: 18px;
                box-shadow: 0 0 20px var(--accent-color);
                cursor: pointer;
            }
        }
    </style>
</head>
<body>

    <div class="game-container">
        
        <!-- ================= نسخة اللابتوب ================= -->
        <div class="desktop-menu">
            <!-- اليمين: الأفاتار متحرك -->
            <div class="avatar-section">
                <div class="avatar-placeholder"></div>
                <h3>لاعب 1</h3>
            </div>

            <!-- المنتصف: أزرار القائمة -->
            <div class="main-navigation">
                <button class="menu-btn">البداية</button>
                <button class="menu-btn">المتجر</button>
                <button class="menu-btn">الإعدادات</button>
                <button class="menu-btn">خروج</button>
            </div>

            <!-- اليسار: قائمة الـ 7 لاعبين -->
            <div class="lobby-section">
                <h3>غرفة الانتظار (7)</h3>
                <div class="players-list">
                    <div class="player-bubble"><div class="status-dot"></div> أحمد</div>
                    <div class="player-bubble"><div class="status-dot"></div> سارة</div>
                    <div class="player-bubble"><div class="status-dot"></div> خالد</div>
                    <div class="player-bubble"><div class="status-dot"></div> ريم</div>
                    <div class="player-bubble"><div class="status-dot"></div> محمد</div>
                    <div class="player-bubble"><div class="status-dot"></div> فاطمة</div>
                    <div class="player-bubble"><div class="status-dot"></div> أنت</div>
                </div>
            </div>
        </div>

        <!-- ================= نسخة الجوال ================= -->
        <div class="mobile-menu">
            <h2>لعبة الـ 7 لاعبين</h2>
            
            <!-- توزيع اللاعبين السبعة في الأعلى -->
            <div class="mobile-lobby">
                <div class="mobile-player"><div class="status-dot"></div></div>
                <div class="mobile-player"><div class="status-dot"></div></div>
                <div class="mobile-player"><div class="status-dot"></div></div>
                <div class="mobile-player"><div class="status-dot"></div></div>
                <div class="mobile-player"><div class="status-dot"></div></div>
                <div class="mobile-player"><div class="status-dot"></div></div>
                <div class="mobile-player"><div class="status-dot"></div></div>
            </div>

            <!-- العجلة الديناميكية للتنقل بالإبهام في الأسفل -->
            <div class="mobile-wheel-container">
                <div class="wheel-arc">
                    <button class="wheel-center-btn">البداية</button>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
