<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Mayo Quiz - Ascension Tournament</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Orbitron:wght@500;700;900&family=Cairo:wght@600;800&display=swap');

        * { 
            box-sizing: border-box; margin: 0; padding: 0; user-select: none; 
            -webkit-touch-callout: none; -webkit-user-select: none; 
            touch-action: manipulation;
        }
        
        body, html { 
            width: 100%; height: 100%; overflow-x: hidden; overflow-y: auto;
            background-color: #030305; 
            background-image: url('./background2.png'); 
            background-size: cover; background-position: center; background-repeat: no-repeat;
            font-family: 'Orbitron', 'Cairo', sans-serif; 
            color: #fff;
        }

        .game-container { position: relative; width: 100%; min-height: 100%; background: rgba(3, 3, 5, 0.65); display: flex; flex-direction: column; }

        .screen { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 25px; z-index: 20; width: 100%; min-height: 100%; transition: opacity 0.3s ease; padding: 20px; }
        .hidden { opacity: 0 !important; pointer-events: none !important; display: none !important; }

        #screen-start { align-items: flex-end; justify-content: flex-end; padding-bottom: 8%; padding-right: 10%; }

        .sony-btn { background: none; border: none; color: rgba(255, 255, 255, 0.8); font-family: 'Orbitron', 'Cinzel', sans-serif; font-size: 1.4rem; font-weight: 800; text-transform: uppercase; letter-spacing: 4px; cursor: pointer; position: relative; transition: all 0.3s ease; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9); padding: 8px 20px; }
        .sony-btn::after { content: ''; width: 0; height: 3px; background-color: #00f0ff; position: absolute; bottom: -5px; right: 0; transition: width 0.3s ease; box-shadow: 0 0 10px #00f0ff; }
        .sony-btn:hover { color: #ffffff; text-shadow: 0 0 15px rgba(0, 240, 255, 0.6), 2px 2px 4px rgba(0, 0, 0, 1); transform: translateX(-5px); }
        .sony-btn:hover::after { width: 100%; }
        
        .start-title { font-size: 3.5rem; letter-spacing: 8px; color: #ffffff; }
        .input-group { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
        .input-label { color: rgba(255, 255, 255, 0.5); font-size: 0.85rem; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
        
        .sony-input { background: rgba(0,0,0,0.6); border: none; border-bottom: 2px solid rgba(255, 255, 255, 0.2); color: #fff; padding: 10px; font-size: 1.3rem; font-family: 'Cairo', sans-serif; text-align: center; outline: none; width: 100%; max-width: 350px; transition: border-color 0.3s; }
        .sony-input:focus { border-bottom-color: #00f0ff; }

        .free-customizer { display: flex; align-items: center; justify-content: center; gap: 60px; width: 90%; max-width: 1000px; }
        .controls-column { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 400px; }
        .select-trigger-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: #ffffff; padding: 14px 20px; font-size: 0.9rem; letter-spacing: 2px; cursor: pointer; text-align: left; display: flex; justify-content: space-between; align-items: center; transition: all 0.3s; }
        .select-trigger-btn:hover { border-color: #00f0ff; background: rgba(0, 240, 255, 0.1); }
        
        .pop-menu { display: none; flex-direction: column; gap: 8px; background: rgba(15, 15, 22, 0.98); border: 1px solid rgba(0, 240, 255, 0.3); padding: 10px; position: absolute; width: 100%; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .pop-opt { padding: 10px; color: rgba(255,255,255,0.7); font-size: 0.9rem; cursor: pointer; transition: all 0.2s; }
        .pop-opt:hover, .pop-opt.selected { background: rgba(0, 240, 255, 0.2); color: #fff; }

        .preview-column { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 400px; gap: 25px; }
        .avatar-frame-wrapper { position: relative; width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; }
        
        .core-avatar { width: 80px; height: 80px; border-radius: 50%; background-color: #1a1a2e; z-index: 2; box-shadow: 0 0 15px rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #00f0ff; }
        .ornament-border { position: absolute; width: 85px; height: 85px; z-index: 3; pointer-events: none; border-radius: 50%; }
        .ornament-diamond { border: 4px solid #b9f2ff; box-shadow: 0 0 20px #00f0ff; }
        .ornament-galaxy { border: 4px solid #a855f7; box-shadow: 0 0 25px rgba(168, 85, 247, 0.6); }
        .ornament-bronze { border: 4px solid #cd7f32; }
        .ornament-gold { border: 5px solid #ffd700; box-shadow: 0 0 20px rgba(255,215,0,0.3); }

        .lobby-action-row { display: flex; gap: 20px; margin-top: 10px; width: 100%; justify-content: center; flex-wrap: wrap; }
        #join-input-area { flex-direction: column; align-items: center; gap: 15px; }

        .central-lobby { display: flex; flex-direction: column; align-items: center; gap: 40px; width: 100%; }
        .central-player-grid { display: flex; justify-content: center; align-items: center; gap: 40px; flex-wrap: wrap; width: 90%; }
        .lobby-card { display: flex; flex-direction: column; align-items: center; gap: 15px; position: relative; }
        .room-badge { color: #ffdf00; font-size: 2.2rem; font-weight: 900; letter-spacing: 5px; text-shadow: 0 0 20px rgba(255, 223, 0, 0.6); text-align: center;}
        .host-indicator { position: absolute; top: -22px; background: #ffdf00; color: #000; font-size: 0.65rem; font-weight: 900; padding: 2px 8px; border-radius: 3px; box-shadow: 0 0 10px #ffdf00; z-index: 10; }
        
        .back-mini-btn { font-size: 1.1rem; color: rgba(255, 255, 255, 0.4); }
        .player-tag-name { color: #ffffff; font-size: 1.1rem; font-weight: 800; background: rgba(0, 0, 0, 0.6); padding: 4px 18px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }

        .quiz-card { background: rgba(10, 10, 18, 0.9); border: 2px solid #00f0ff; border-radius: 20px; padding: 30px; width: 100%; max-width: 700px; box-shadow: 0 0 30px rgba(0, 240, 255, 0.2); display: flex; flex-direction: column; gap: 20px; align-items: center; text-align: center; }
        .quiz-header { width: 100%; display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        .timer-badge { background: #ff3333; color: white; padding: 5px 15px; border-radius: 20px; font-weight: 900; animation: pulse 1s infinite alternate; }
        .question-img { width: 100%; max-width: 400px; height: 180px; object-fit: cover; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: #111; }
        .question-text { font-family: 'Cairo'; font-size: 1.5rem; font-weight: 800; color: #fff; margin: 10px 0; }
        .options-grid { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .option-btn { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 15px; color: #fff; font-family: 'Cairo'; font-size: 1.1rem; cursor: pointer; transition: all 0.2s; text-align: center; }
        .option-btn:hover { background: rgba(0, 240, 255, 0.15); border-color: #00f0ff; transform: translateY(-2px); }
        .option-btn.selected { background: #00f0ff !important; color: #000 !important; font-weight: bold; }

        .bracket-container { display: flex; justify-content: center; align-items: center; gap: 20px; width: 100%; max-width: 1100px; overflow-x: auto; padding: 20px; background: rgba(0,0,0,0.4); border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .bracket-column { display: flex; flex-direction: column; justify-content: space-around; gap: 30px; height: 500px; min-width: 180px; }
        .match-box { display: flex; flex-direction: column; background: rgba(20,20,30,0.9); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; width: 100%; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .match-box.active-match { border-color: #00f0ff; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }
        .bracket-player { display: flex; justify-content: space-between; align-items: center; padding: 10px; font-size: 0.9rem; font-family: 'Cairo'; border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.02); }
        .bracket-player:last-child { border-bottom: none; }
        .bracket-player.winner { color: #00ff88; font-weight: bold; background: rgba(0, 255, 136, 0.08); }
        .bracket-player.eliminated { color: #ff4a4a; text-decoration: line-through; opacity: 0.6; }
        .champion-box { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-width: 200px; text-align: center; }
        .cup-icon { font-size: 4rem; color: #ffd700; text-shadow: 0 0 30px #ffd700; animation: float 2.5s infinite ease-in-out; }

        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>

    <div class="game-container">
        
        <div id="screen-start" class="screen">
            <button class="sony-btn start-title" onclick="switchScreen('screen-identity')">START</button>
        </div>

        <div id="screen-identity" class="screen hidden">
            <div class="free-customizer">
                <div class="controls-column">
                    <div class="input-group">
                        <span class="input-label">PLAYER NAME</span>
                        <input type="text" id="player-name" class="sony-input" placeholder="ENTER NAME..." maxlength="12">
                    </div>
                    
                    <div style="position: relative;">
                        <button class="select-trigger-btn" onclick="toggleMenu(event, 'pop-hero')">
                            <span>CHOOSE HERO AVATAR</span> <i class="fa-solid fa-chevron-down"></i>
                        </button>
                        <div class="pop-menu" id="pop-hero">
                            <div class="pop-opt selected" onclick="changeHero('shadow', this)">SHADOW NINJA</div>
                            <div class="pop-opt" onclick="changeHero('blaze', this)">BLAZE SAMURAI</div>
                            <div class="pop-opt" onclick="changeHero('frost', this)">FROST MAGE</div>
                            <div class="pop-opt" onclick="changeHero('volt', this)">VOLT STRIKER</div>
                        </div>
                    </div>

                    <div style="position: relative;">
                        <button class="select-trigger-btn" onclick="toggleMenu(event, 'pop-tier')">
                            <span>CHOOSE BORDER ORNAMENT</span> <i class="fa-solid fa-chevron-down"></i>
                        </button>
                        <div class="pop-menu" id="pop-tier">
                            <div class="pop-opt selected" onclick="changeOrnament('diamond', this)">DIAMOND SHINE 💎</div>
                            <div class="pop-opt" onclick="changeOrnament('galaxy', this)">GALAXY & TREES 🌌</div>
                            <div class="pop-opt" onclick="changeOrnament('bronze', this)">BRONZE WINGS</div>
                            <div class="pop-opt" onclick="changeOrnament('gold', this)">MYTHIC GOLD ★</div>
                        </div>
                    </div>
                </div>

                <div class="preview-column">
                    <span class="input-label">IDENTITY PREVIEW</span>
                    <div class="avatar-frame-wrapper">
                        <div id="ornament-live-border" class="ornament-border ornament-diamond"></div>
                        <div id="avatar-live-core" class="core-avatar"><i class="fa-solid fa-user-ninja"></i></div>
                    </div>
                    
                    <div class="lobby-action-row" id="action-buttons-area">
                        <button id="btn-create" class="sony-btn" onclick="buildLobby('create')" style="color: #00f0ff;">CREATE ROOM</button>
                        <button class="sony-btn" onclick="showJoinInput()">JOIN ROOM</button>
                    </div>

                    <div class="lobby-action-row hidden" id="join-input-area">
                        <input type="text" id="join-room-code" class="sony-input" placeholder="CODE: XXXXX">
                        <div style="display:flex; gap:10px;">
                            <button id="btn-join" class="sony-btn" onclick="buildLobby('join')" style="color:#00ff88;">ENTER</button>
                            <button class="sony-btn back-mini-btn" onclick="hideJoinInput()">CANCEL</button>
                        </div>
                    </div>
                </div>
            </div>
            <button class="sony-btn back-mini-btn" onclick="switchScreen('screen-start')">BACK</button>
        </div>

        <div id="screen-lobby" class="screen hidden">
            <div class="central-lobby">
                <div style="text-align: center;">
                    <span class="input-label" style="opacity:0.4;">MATCHMAKING LOBBY</span>
                    <div class="room-badge" id="lobby-room-number">ROOM-XXXX</div>
                </div>
                <div class="central-player-grid" id="player-mesh"></div>
                <div class="lobby-buttons" style="display:flex; flex-direction:column; align-items:center; gap:15px;">
                    <button class="sony-btn" id="btn-launch-match" style="color: #00ff88; display:none;" onclick="triggerGameStart()">LAUNCH TOURNAMENT</button>
                    <button class="sony-btn back-mini-btn" onclick="location.reload()">LEAVE LOBBY</button>
                </div>
            </div>
        </div>

        <div id="screen-bracket" class="screen hidden">
            <h2 id="bracket-stage-title" style="color: #ffdf00; letter-spacing: 4px;">TOURNAMENT BRACKET - دور الـ 8</h2>
            
            <div class="bracket-container">
                <div class="bracket-column" id="col-round8"></div>
                <div class="bracket-column" id="col-round4"></div>
                <div class="bracket-column" id="col-final"></div>
                <div class="champion-box">
                    <i class="fa-solid fa-trophy cup-icon"></i>
                    <div class="input-label" style="color: #ffd700;">CHAMPION</div>
                    <div id="bracket-winner-name" class="player-tag-name" style="border-color: #ffd700; color: #ffd700;">???</div>
                </div>
            </div>

            <button id="btn-start-quiz-round" class="sony-btn" style="color: #00f0ff;" onclick="startActualQuizRound()">START ROUND ⚔️</button>
        </div>

        <div id="screen-gameplay" class="screen hidden">
            <div class="quiz-card">
                <div class="quiz-header">
                    <span id="quiz-category" style="color: #00f0ff; font-weight: bold;">تصنيف السؤال</span>
                    <div class="timer-badge"><i class="fa-solid fa-clock"></i> <span id="quiz-timer">20</span>s</div>
                    <span id="quiz-question-number" style="opacity: 0.7;">السؤال 1 / 15</span>
                </div>
                
                <img id="quiz-image" class="question-img" src="" alt="Question Image">
                <div id="quiz-text" class="question-text">جاري تحميل السؤال الحماسي...</div>
                
                <div class="options-grid" id="quiz-options-container"></div>
                
                <div style="width: 100%; display: flex; justify-content: space-between; margin-top: 15px;">
                    <span style="font-size: 0.9rem; opacity: 0.6; padding-top: 10px;">إجاباتك الصحيحة: <span id="my-live-score" style="color: #00ff88; font-weight: bold;">0</span></span>
                    <button class="sony-btn" style="font-size: 1rem; color: #ff4a4a;" onclick="skipQuestion()">SKIP / سكب ➡️</button>
                </div>
            </div>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>

                { q: "ما هي أطول سورة في القرآن الكريم؟", o: ["سورة البقرة", "سورة آل عمران", "سورة النساء", "سورة المائدة"], a: 0, img: "https://images.unsplash.com/photo-1609599006353-e629f1d50668?w=500" },

            ],

                { q: "من هو القائد المسلم الذي فتح الأندلس؟", o: ["خالد بن الوليد", "طارق بن زياد", "صلاح الدين الأيوبي", "عمرو بن العاص"], a: 1, img: "https://images.unsplash.com/photo-1546955121-d10433008557?w=500" },
                { q: "بناة الأهرامات الثلاثة هم من حضارة أي بلد؟", o: ["العراق", "مصر", "اليونان", "إيطاليا"], a: 1, img: "https://images.unsplash.com/photo-1539650116574-8efeb43e2750?w=500" },
                { q: "من هو مكتشف أمريكا عام 1492؟", o: ["فاسكو دا غاما", "كريستوفر كولومبوس", "ماجلان", "ابن بطوطة"], a: 1, img: "https://images.unsplash.com/photo-1506973035872-a4ec16b8e8d9?w=500" },
                { q: "ما هي المدينة التي كانت عاصمة الدولة الأموية؟", o: ["بغداد", "القاهرة", "دمشق", "المدينة المنورة"], a: 2, img: "https://images.unsplash.com/photo-1543731068-7e0f5beff43a?w=500" }
            ]
        };

        let db;
        let currentRoomId = null, myPlayerId = null;
        let pName = "", currentHero = "shadow", currentOrnament = "diamond";
        let activeTournamentQuestions = [];
        let currentQuestionIndex = 0;
        let quizTimerInterval;
        let timeLeft = 20;
        let myCorrectAnswersCount = 0;

        let tournamentData = {

        const botNames = ["AlphaBot", "ZetaStriker", "FrostByte", "VoltMech", "BlazeCore", "ShadowX", "OmegaPro", "PixelHero"];
        
        // الأيقونات الجديدة بدلاً من الروابط المعطوبة
        const heroIcons = {
            'shadow': 'fa-user-ninja',
            'blaze': 'fa-user-shield',
            'frost': 'fa-wand-magic-sparkles',
            'volt': 'fa-bolt'
        };

        try {
            const firebaseConfig = {
                apiKey: "AIzaSyCOGGmv-bjlZlBLr1T8tAvBtALAcp-7HEw",
                authDomain: "mayo-game.firebaseapp.com",
                databaseURL: "https://mayo-game-default-rtdb.europe-west1.firebasedatabase.app",
                projectId: "mayo-game",
                storageBucket: "mayo-game.firebasestorage.app",
                messagingSenderId: "153594840301",
                appId: "1:153594840301:web:17e64f7ae8a1d7825a38e4"

            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        } catch (e) { console.error(e); }

        function toggleMenu(event, menuId) {
            event.stopPropagation();
            const menu = document.getElementById(menuId);
            const isVisible = menu.style.display === 'flex';
            document.querySelectorAll('.pop-menu').forEach(m => m.style.display = 'none');
            if(!isVisible) menu.style.display = 'flex';
        }
        document.addEventListener('click', () => document.querySelectorAll('.pop-menu').forEach(m => m.style.display = 'none'));

        function changeHero(key, el) { 
            currentHero = key; 
            document.getElementById('avatar-live-core').innerHTML = `<i class="fa-solid ${heroIcons[key]}"></i>`; 
            document.querySelectorAll('#pop-hero .pop-opt').forEach(o => o.classList.remove('selected')); 
            el.classList.add('selected'); 
        }
        function changeOrnament(tier, el) { currentOrnament = tier; document.getElementById('ornament-live-border').className = 'ornament-border ornament-' + tier; document.querySelectorAll('#pop-tier .pop-opt').forEach(o => o.classList.remove('selected')); el.classList.add('selected'); }
        function switchScreen(screenId) { document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden')); document.getElementById(screenId).classList.remove('hidden'); }
        function showJoinInput() { document.getElementById('action-buttons-area').classList.add('hidden'); document.getElementById('join-input-area').classList.remove('hidden'); }
        function hideJoinInput() { document.getElementById('action-buttons-area').classList.remove('hidden'); document.getElementById('join-input-area').classList.add('hidden'); }

        function buildLobby(actionType) {
            const inputName = document.getElementById('player-name').value.trim();
            if(!inputName) return alert("الرجاء إدخال اسمك أولاً!");
            pName = inputName;
            const myData = { name: pName, hero: currentHero, ornament: currentOrnament, score: 0, currentRoundScore: 0, eliminated: false };

            if(actionType === 'create') {
                currentRoomId = Math.random().toString(36).substring(2,7).toUpperCase();
                myPlayerId = "p1";
                db.ref('rooms/' + currentRoomId).set({ status: "waiting", players: { p1: myData } }).then(() => {
                    document.getElementById('btn-launch-match').style.display = 'block';
                    document.getElementById('lobby-room-number').innerText = currentRoomId;
                    switchScreen('screen-lobby'); listenToRoomChanges();
                }).catch(err => alert("حدث خطأ بقاعدة البيانات: " + err.message));
            } else if(actionType === 'join') {
                let code = document.getElementById('join-room-code').value.trim().toUpperCase();
                if(!code) return;
                myPlayerId = "p2"; currentRoomId = code;
                db.ref('rooms/' + currentRoomId).once('value').then(snap => {
                    if(snap.exists() && snap.val().status === "waiting") {
                        db.ref('rooms/' + currentRoomId + '/players/p2').set(myData);
                        db.ref('rooms/' + currentRoomId).update({ status: "full" });
                        document.getElementById('lobby-room-number').innerText = currentRoomId;
                        switchScreen('screen-lobby'); listenToRoomChanges();
                    } else alert("الغرفة ممتلئة أو غير موجودة!");
                });
            }
        }

        function listenToRoomChanges() {
            db.ref('rooms/' + currentRoomId).on('value', snap => {
                const room = snap.val();
                if(!room) return;
                if(room.status === "waiting" || room.status === "full") {
                    document.getElementById('player-mesh').innerHTML = (room.players.p1 ? generateLobbyCard("HOST", room.players.p1) : '') + (room.players.p2 ? generateLobbyCard("PARTY", room.players.p2) : '');
                }
                if(room.status === "playing" && !isGameStartedLocally) {
                    isGameStartedLocally = true;
                    setupTournamentTree(room.players);
                }
                if(room.tournamentTree) {
                    tournamentData = room.tournamentTree;
                    renderBracketUI();
                }
                if(room.status === "quiz_round" && document.getElementById('screen-gameplay').classList.contains('hidden')) {
                    activeTournamentQuestions = room.currentQuestions;
                    startQuizCountdown();
                }
            });
        }

        function generateLobbyCard(label, data) { 
            const iconClass = heroIcons[data.hero] || 'fa-user';
            return `<div class="lobby-card"><span class="host-indicator">${label}</span><div class="avatar-frame-wrapper"><div class="ornament-border ornament-${data.ornament}"></div><div class="core-avatar"><i class="fa-solid ${iconClass}"></i></div></div><div class="player-tag-name">${data.name}</div></div>`; 
        }
        function triggerGameStart() { if(myPlayerId !== 'p1') return; db.ref('rooms/' + currentRoomId).update({ status: "playing" }); }

        function setupTournamentTree(playersList) {
            if(myPlayerId !== 'p1') { switchScreen('screen-bracket'); return; }

            let pool = [];
            if(playersList.p1) pool.push({ name: playersList.p1.name, id: "p1", score: 0, eliminated: false });
            if(playersList.p2) pool.push({ name: playersList.p2.name, id: "p2", score: 0, eliminated: false });

            let shadowBots = [...botNames];
            while(pool.length < 8) {
                let rIdx = Math.floor(Math.random() * shadowBots.length);
                pool.push({ name: shadowBots.splice(rIdx, 1)[0], id: "bot_" + pool.length, score: 0, eliminated: false });
            }

            pool.sort(() => Math.random() - 0.5);

            tournamentData.round8 = [
                { p1: pool[0], p2: pool[1], winner: null },
                { p1: pool[2], p2: pool[3], winner: null },
                { p1: pool[4], p2: pool[5], winner: null },
                { p1: pool[6], p2: pool[7], winner: null }
            ];
            tournamentData.round4 = [
                { p1: { name: "???", id: null }, p2: { name: "???", id: null }, winner: null },
                { p1: { name: "???", id: null }, p2: { name: "???", id: null }, winner: null }
            ];
            tournamentData.final = [
                { p1: { name: "???", id: null }, p2: { name: "???", id: null }, winner: null }
            ];
            tournamentData.currentRoundIndex = 8;
            tournamentData.winner = null;

            db.ref('rooms/' + currentRoomId).update({ tournamentTree: tournamentData });
            switchScreen('screen-bracket');
        }

        function renderBracketUI() {
            switchScreen('screen-bracket');
            document.getElementById('bracket-stage-title').innerText = `TOURNAMENT BRACKET - دور الـ ${tournamentData.currentRoundIndex}`;
            document.getElementById('btn-start-quiz-round').style.display = (myPlayerId === 'p1' && !tournamentData.winner) ? 'block' : 'none';

            let r8Html = "";
            tournamentData.round8.forEach(m => {
                r8Html += `<div class="match-box">
                    <div class="bracket-player ${m.winner?.id===m.p1.id?'winner':(m.winner?'eliminated':'')}"><span>${m.p1.name}</span><strong>${m.p1.score}</strong></div>
                    <div class="bracket-player ${m.winner?.id===m.p2.id?'winner':(m.winner?'eliminated':'')}"><span>${m.p2.name}</span><strong>${m.p2.score}</strong></div>
                </div>`;
            });
            document.getElementById('col-round8').innerHTML = r8Html;

            let r4Html = "";
            tournamentData.round4.forEach(m => {
                r4Html += `<div class="match-box">
                    <div class="bracket-player ${m.winner?.id===m.p1.id?'winner':(m.winner?'eliminated':'')}"><span>${m.p1.name}</span><strong>${m.p1.score || 0}</strong></div>
                    <div class="bracket-player ${m.winner?.id===m.p2.id?'winner':(m.winner?'eliminated':'')}"><span>${m.p2.name}</span><strong>${m.p2.score || 0}</strong></div>
                </div>`;
            });
            document.getElementById('col-round4').innerHTML = r4Html;

            let f = tournamentData.final[0];
            let fHtml = `<div class="match-box">
                <div class="bracket-player ${f.winner?.id===f.p1.id?'winner':(f.winner?'eliminated':'')}"><span>${f.p1.name}</span><strong>${f.f1?.score || 0}</strong></div>
                <div class="bracket-player ${f.winner?.id===f.p2.id?'winner':(f.winner?'eliminated':'')}"><span>${f.p2.name}</span><strong>${f.p2.score || 0}</strong></div>
            </div>`;
            document.getElementById('col-final').innerHTML = fHtml;

            if(tournamentData.winner) {
                document.getElementById('bracket-winner-name').innerText = tournamentData.winner.name;
            }
        }

        function generateMixedQuiz() {
            let selected = [];
            const gather = (arr) => {
                let copy = [...arr].sort(() => Math.random() - 0.5);
                return copy.slice(0, 5);
            };
            selected.push(...gather(questionsBank.religious));
            selected.push(...gather(questionsBank.general));
            selected.push(...gather(questionsBank.history));
            return selected.sort(() => Math.random() - 0.5);
        }

        function startActualQuizRound() {
            if(myPlayerId !== 'p1') return;
            let currentQuestions = generateMixedQuiz();
            db.ref('rooms/' + currentRoomId).update({
                status: "quiz_round",
                currentQuestions: currentQuestions
            });
        }

        function startQuizCountdown() {
            switchScreen('screen-gameplay');
            currentQuestionIndex = 0;
            myCorrectAnswersCount = 0;
            document.getElementById('my-live-score').innerText = "0";
            showQuestion();
        }

        function showQuestion() {
            clearInterval(quizTimerInterval);
            if(currentQuestionIndex >= 15) {
                endQuizRoundLocally();
                return;
            }

            let qData = activeTournamentQuestions[currentQuestionIndex];
            document.getElementById('quiz-question-number').innerText = `السؤال ${currentQuestionIndex + 1} / 15`;
            document.getElementById('quiz-text').innerText = qData.q;
            document.getElementById('quiz-image').src = qData.img;
            
            let catName = "معلومات عامة 🧠";
            if(questionsBank.religious.some(x => x.q === qData.q)) catName = "مسابقة دينية 🕋";
            if(questionsBank.history.some(x => x.q === qData.q)) catName = "تاريخ وأحداث ⏳";
            document.getElementById('quiz-category').innerText = catName;

            let optContainer = document.getElementById('quiz-options-container');
            optContainer.innerHTML = "";
            qData.o.forEach((opt, idx) => {
                let btn = document.createElement('button');
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => submitAnswer(idx, btn);
                optContainer.appendChild(btn);
            });

            timeLeft = 15;
            document.getElementById('quiz-timer').innerText = timeLeft;
            quizTimerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('quiz-timer').innerText = timeLeft;
                if(timeLeft <= 0) {
                    currentQuestionIndex++;
                    showQuestion();
                }
            }, 1000);
        }

        function submitAnswer(idx, btnElement) {
            clearInterval(quizTimerInterval);
            let qData = activeTournamentQuestions[currentQuestionIndex];
            document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

            if(idx === qData.a) {
                btnElement.style.background = "#00ff88";
                btnElement.style.color = "#000";
                myCorrectAnswersCount++;
                document.getElementById('my-live-score').innerText = myCorrectAnswersCount;
            } else {
                btnElement.style.background = "#ff4a4a";
                document.querySelectorAll('.option-btn')[qData.a].style.background = "#00ff88";
                document.querySelectorAll('.option-btn')[qData.a].style.color = "#000";
            }

            setTimeout(() => {
                currentQuestionIndex++;
                showQuestion();
            }, 1200);
        }

        function skipQuestion() {
            currentQuestionIndex++;
            showQuestion();
        }

        function endQuizRoundLocally() {
            clearInterval(quizTimerInterval);
            switchScreen('screen-bracket');
            document.getElementById('bracket-stage-title').innerText = "جاري احتساب النتائج وتحديث الشجرة...⏳";

            if(myPlayerId === 'p1') {
                const simulateBotScore = () => Math.floor(Math.random() * 8) + 6;

                db.ref('rooms/' + currentRoomId + '/players').once('value').then(snap => {
                    let playersData = snap.val();
                    let p1Score = playersData.p1 ? playersData.p1.currentRoundScore : 0;
                    let p2Score = playersData.p2 ? playersData.p2.currentRoundScore : 0;

                    if(myPlayerId === 'p1') p1Score = myCorrectAnswersCount;

                    if(tournamentData.currentRoundIndex === 8) {
                        tournamentData.round8.forEach(m => {
                            let s1 = m.p1.id === "p1" ? p1Score : (m.p1.id === "p2" ? p2Score : simulateBotScore());
                            let s2 = m.p2.id === "p1" ? p1Score : (m.p2.id === "p2" ? p2Score : simulateBotScore());
                            m.p1.score = s1; m.p2.score = s2;
                            m.winner = s1 >= s2 ? m.p1 : m.p2;
                        });
                        tournamentData.round4[0].p1 = tournamentData.round8[0].winner;
                        tournamentData.round4[0].p2 = tournamentData.round8[1].winner;
                        tournamentData.round4[1].p1 = tournamentData.round8[2].winner;
                        tournamentData.round4[1].p2 = tournamentData.round8[3].winner;
                        tournamentData.currentRoundIndex = 4;
                    } 
                    else if(tournamentData.currentRoundIndex === 4) {
                        tournamentData.round4.forEach(m => {
                            let s1 = m.p1.id === "p1" ? p1Score : (m.p1.id === "p2" ? p2Score : simulateBotScore());
                            let s2 = m.p2.id === "p1" ? p1Score : (m.p2.id === "p2" ? p2Score : simulateBotScore());
                            m.p1.score = s1; m.p2.score = s2;
                            m.winner = s1 >= s2 ? m.p1 : m.p2;
                        });
                        tournamentData.final[0].p1 = tournamentData.round4[0].winner;
                        tournamentData.final[0].p2 = tournamentData.round4[1].winner;
                        tournamentData.currentRoundIndex = 2;
                    } 
                    else if(tournamentData.currentRoundIndex === 2) {
                        let m = tournamentData.final[0];
                        let s1 = m.p1.id === "p1" ? p1Score : (m.p1.id === "p2" ? p2Score : simulateBotScore());
                        let s2 = m.p2.id === "p1" ? p1Score : (m.p2.id === "p2" ? p2Score : simulateBotScore());
                        m.p1.score = s1; m.p2.score = s2;
                        m.winner = s1 >= s2 ? m.p1 : m.p2;
                        tournamentData.winner = m.winner;
                    }

                    db.ref('rooms/' + currentRoomId).update({
                        status: "playing",
                        tournamentTree: tournamentData
                    });
                });
            } else {
                db.ref(`rooms/${currentRoomId}/players/${myPlayerId}`).update({ currentRoundScore: myCorrectAnswersCount });
            }
        }
    </script>
</body>
</html>
