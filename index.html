<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The 7 Infiltrators</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    /* ========================================= */
    /* الإعدادات الأساسية والثيم البنفسجي */
    /* ========================================= */
    :root {
      --bg-color: #170b2b;
      --text-white: #ffffff;
      --title-cyan: #66ccff;
      --btn-red-bg: #6e0000;
      --btn-red-border: #ff1c1c;
      --box-border: #4a3b69;
      --highlight-pink: #d966ff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }

    body {
      background-color: var(--bg-color);
      /* تم تغيير مسار الخلفية إلى FOFO.PNG حسب طلبك */
      background-image: url('FOFO.PNG'); 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: var(--text-white);
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      padding: 40px 20px;
    }

    /* إطار الشاشة (الخطوط المحيطة باللعبة) */
    .game-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* ========================================= */
    /* العنوان (أساتذة الـ 7) */
    /* ========================================= */
    .header-section {
      text-align: center;
      margin-bottom: 40px;
      margin-top: 20px;
    }

    .main-title {
      font-size: 3.5rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      text-shadow: 0 0 10px rgba(102, 204, 255, 0.5);
    }

    .main-title .number {
      color: var(--title-cyan);
      font-family: 'Press Start 2P', cursive;
      font-size: 4rem;
      text-shadow: 0 0 15px var(--title-cyan);
    }

    .sub-title {
      font-family: 'Press Start 2P', cursive;
      font-size: 14px;
      letter-spacing: 2px;
      margin-top: 5px;
      color: #e0e0e0;
    }

    /* ========================================= */
    /* الأزرار (ابدأ - خيارات - خروج) */
    /* ========================================= */
    .buttons-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
    }

    /* زر ابدأ (أحمر ومتوهج بحدود بكسل) */
    .btn-start {
      background-color: var(--btn-red-bg);
      color: white;
      font-family: 'Cairo', sans-serif;
      font-weight: 800;
      font-size: 2.5rem;
      padding: 10px 80px;
      cursor: pointer;
      border: 3px solid var(--btn-red-border);
      box-shadow: 
        0 0 15px var(--btn-red-border),
        inset 0 0 15px rgba(255, 0, 0, 0.8);
      border-radius: 8px;
      transition: transform 0.1s, filter 0.2s;
    }

    .btn-start:hover { filter: brightness(1.2); }
    .btn-start:active { transform: scale(0.95); }

    .sub-buttons {
      display: flex;
      gap: 20px;
    }

    /* أزرار الخيارات والخروج */
    .btn-small {
      background-color: rgba(30, 20, 50, 0.8);
      color: #ccc;
      font-family: 'Cairo', sans-serif;
      font-size: 1.2rem;
      padding: 5px 30px;
      border: 2px solid var(--box-border);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-small:hover { border-color: #fff; color: #fff; }

    /* ========================================= */
    /* الخط الفاصل (Divider) */
    /* ========================================= */
    .pixel-divider {
      width: 100%;
      height: 2px;
      background-color: var(--box-border);
      position: relative;
      margin: 30px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pixel-divider::before, .pixel-divider::after {
      content: '';
      width: 10px; height: 10px;
      background-color: var(--highlight-pink);
      transform: rotate(45deg);
      box-shadow: 0 0 8px var(--highlight-pink);
      position: absolute;
    }
    .pixel-divider::before { right: -5px; }
    .pixel-divider::after { left: -5px; }

    /* ========================================= */
    /* إدخال الاسم (Enter Name) */
    /* ========================================= */
    .name-input-container {
      text-align: center;
      margin-bottom: 30px;
    }

    .name-input-container label {
      display: block;
      color: #999;
      font-size: 0.9rem;
      margin-bottom: 5px;
      font-family: 'Press Start 2P', 'Cairo', sans-serif;
    }

    .name-input-box {
      background-color: rgba(20, 10, 30, 0.6);
      border: 2px solid var(--box-border);
      border-radius: 6px;
      padding: 10px 20px;
      width: 300px;
      color: white;
      font-family: 'Cairo', sans-serif;
      font-size: 1.2rem;
      text-align: center;
    }

    .name-input-box:focus { border-color: var(--title-cyan); }

    /* ========================================= */
    /* الشخصيات (Character Roster) */
    /* ========================================= */
    .characters-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    .char-box {
      width: 80px;
      height: 80px;
      background-color: rgba(0, 0, 0, 0.5);
      border: 2px solid var(--box-border);
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s;
    }

    .char-box.selected {
      border: 3px solid var(--highlight-pink);
      box-shadow: 0 0 15px var(--highlight-pink);
      transform: scale(1.1);
    }

    .char-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: pixelated; 
    }

    /* ========================================= */
    /* الرتب (Rank Badges) */
    /* ========================================= */
    .badges-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .badge-box {
      width: 100px;
      height: 100px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .badge-box img {
      width: 100%;
      height: auto;
      image-rendering: pixelated;
    }

    /* استجابة الشاشة للجوال */
    @media (max-width: 768px) {
      .main-title { font-size: 2.5rem; }
      .main-title .number { font-size: 3rem; }
      .sub-title { font-size: 10px; }
      .btn-start { font-size: 2rem; padding: 10px 50px; }
      .char-box { width: 60px; height: 60px; }
      .badge-box { width: 70px; height: 70px; }
    }
  </style>
</head>
<body>

  <div class="game-container">

    <div class="header-section">
      <h1 class="main-title"><span class="number">7</span> أساتذة</h1>
      <div class="sub-title">THE 7 INFILTRATORS</div>
    </div>

    <div class="buttons-section">
      <button class="btn-start">ابدأ</button>
      <div class="sub-buttons">
        <button class="btn-small" style="font-family: 'Press Start 2P', cursive; font-size: 10px;">Options</button>
        <button class="btn-small" style="font-family: 'Press Start 2P', cursive; font-size: 10px;">Quit</button>
      </div>
    </div>

    <div class="pixel-divider"></div>

    <div class="name-input-container">
      <label>Enter Name</label>
      <input type="text" class="name-input-box" placeholder="أدخل الاسم">
    </div>

    <div class="characters-row">
      <div class="char-box"><img src="char1.png" alt="C1"></div>
      <div class="char-box"><img src="char2.png" alt="C2"></div>
      <div class="char-box"><img src="char3.png" alt="C3"></div>
      <div class="char-box"><img src="char4.png" alt="C4"></div>
      <div class="char-box"><img src="char5.png" alt="C5"></div>
      <div class="char-box"><img src="char6.png" alt="C6"></div>
      <div class="char-box selected"><img src="char7.png" alt="C7"></div>
    </div>

    <div class="pixel-divider"></div>

    <div class="badges-row">
      <div class="badge-box"><img src="badge_gold.png" alt="Gold"></div>
      <div class="badge-box"><img src="badge_purple.png" alt="Purple"></div>
      <div class="badge-box"><img src="badge_red.png" alt="Red"></div>
      <div class="badge-box"><img src="badge_silver.png" alt="Silver"></div>
      <div class="badge-box"><img src="badge_bronze.png" alt="Bronze"></div>
    </div>

  </div>

</body>
</html>
