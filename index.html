<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Mayo Bet - 5 Rounds Battle</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Cairo', sans-serif; text-align: center; margin: 0; }
        .arena { display: flex; justify-content: center; gap: 20px; margin: 50px; }
        .bet-box { background: #2c3e50; padding: 20px; border-radius: 15px; width: 150px; border: 2px solid #3498db; }
        .host-panel { background: #8e44ad; padding: 20px; margin: 20px; border-radius: 10px; }
        .model { width: 60px; height: 100px; background: gold; margin: 10px auto; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="setup">
        <h1>Mayo Bet - 5 جولات</h1>
        <input id="name" placeholder="اسمك">
        <button onclick="createGame()">إنشاء غرفة</button>
        <button onclick="joinGame()">انضمام</button>
    </div>

    <div id="game" style="display:none;">
        <h2 id="qText">انتظار بداية اللعبة...</h2>
        <div id="host-ctrl" class="host-panel" style="display:none;">
            <button onclick="sendNextQ()">السؤال التالي</button>
            <button onclick="reveal()">إظهار الإجابة</button>
        </div>
        <div class="arena">
            <div class="bet-box" onclick="placeBet('A')">خيار أ<br><span id="bA">0$</span></div>
            <div class="bet-box" onclick="placeBet('B')">خيار ب<br><span id="bB">0$</span></div>
            <div class="bet-box" onclick="placeBet('C')">خيار ج<br><span id="bC">0$</span></div>
        </div>
        <div>
            <button onclick="updateBet(-500)">-500</button>
            <span id="myBet">رهانك: 0</span>
            <button onclick="updateBet(500)">+500</button>
            <button onclick="confirmBet()">تأكيد الرهان</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = { /* ضع مفاتيحك هنا */ };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let roomId, isHost, myName, round = 1;
        const questions = [
            "عاصمة السعودية؟", "عدد أضلاع المربع؟", "لون السماء؟", "أكبر كوكب؟", "كم جولة انتهت؟"
        ];

        function createGame() {
            roomId = "ROOM-" + Math.floor(Math.random()*1000);
            isHost = true;
            myName = document.getElementById('name').value;
            db.ref('games/' + roomId).set({ status: 'waiting', round: 1, question: questions[0] });
            start();
        }

        function joinGame() {
            roomId = prompt("أدخل كود الغرفة:");
            isHost = false;
            myName = document.getElementById('name').value;
            start();
        }

        function start() {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            if(isHost) document.getElementById('host-ctrl').style.display = 'block';
            
            db.ref('games/' + roomId).on('value', (s) => {
                let data = s.val();
                document.getElementById('qText').innerText = data.question;
            });
        }

        function sendNextQ() {
            round++;
            if(round > 5) return alert("انتهت الجولات!");
            db.ref('games/' + roomId).update({ question: questions[round-1], round: round });
        }

        let myBet = 0;
        function updateBet(v) { myBet = Math.max(0, myBet + v); document.getElementById('myBet').innerText = "رهانك: " + myBet; }
        
        function confirmBet() {
            db.ref('games/' + roomId + '/bets/' + myName).set(myBet);
            alert("تم إرسال رهانك!");
        }
    </script>
</body>
</html>
