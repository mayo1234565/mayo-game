<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mayo Ascension - Full Version</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        /* CSS مخصص للتجاوب ومنع الزووم */
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #030305; background-image: url('./background2.png'); background-size: cover; font-family: 'Cairo', sans-serif; touch-action: none; }
        .game-container { width: 100%; height: 100%; position: relative; }
        
        /* زر التعليمات في اللوبي */
        .btn-ui { background: #00f0ff; color: #000; padding: 15px 30px; border-radius: 25px; font-weight: bold; cursor: pointer; border: none; font-size: 1.1rem; }
        
        /* شاشة التعليمات */
        #instructions-panel { position: absolute; z-index: 100; background: rgba(0,0,0,0.95); border: 2px solid #00f0ff; color: #fff; padding: 20px; text-align: center; border-radius: 20px; top: 10%; width: 80%; max-width: 400px; }
        
        /* التحكم باللمس */
        .mobile-controls { position: absolute; bottom: 20px; display: flex; gap: 15px; width: 100%; justify-content: center; z-index: 50; }
        .ctrl-btn { width: 60px; height: 60px; border-radius: 50%; background: rgba(0,240,255,0.3); color: white; border: none; font-size: 1.5rem; }
    </style>
</head>
<body>

    <div class="game-container" id="game-canvas-container">
        <canvas id="physics-canvas"></canvas>

        <div id="instructions-panel" class="hidden">
            <h2>تعليمات اللعبة</h2>
            <p>الهدف: ابنِ برجك ولا تدع القطع تطيح!</p>
            <p>لديك 3 أرواح فقط.</p>
            <button class="btn-ui" onclick="hideInstructions()">فهمت، ابدأ اللعبة!</button>
        </div>

        <div class="mobile-controls">
            <button class="ctrl-btn" onclick="moveActive(-1)"><i class="fa-solid fa-arrow-left"></i></button>
            <button class="ctrl-btn" onclick="rotateActive()"><i class="fa-solid fa-rotate-right"></i></button>
            <button class="ctrl-btn" onclick="dropActive()"><i class="fa-solid fa-arrow-down"></i></button>
            <button class="ctrl-btn" onclick="moveActive(1)"><i class="fa-solid fa-arrow-right"></i></button>
        </div>
    </div>

    <script>
        const { Engine, Render, Runner, Bodies, Composite, Body } = Matter;
        let engine, render, runner, activeBlock;
        let lives = 3;

        function showInstructions() { document.getElementById('instructions-panel').classList.remove('hidden'); }
        function hideInstructions() { document.getElementById('instructions-panel').classList.add('hidden'); }

        function initGame() {
            engine = Engine.create();
            render = Render.create({
                element: document.getElementById('game-canvas-container'),
                canvas: document.getElementById('physics-canvas'),
                engine: engine,
                options: { width: window.innerWidth, height: window.innerHeight, wireframes: false, background: 'transparent' }
            });

            // الأرضية
            const ground = Bodies.rectangle(window.innerWidth/2, window.innerHeight - 20, window.innerWidth, 40, { isStatic: true });
            Composite.add(engine.world, ground);

            Render.run(render);
            runner = Runner.create();
            Runner.run(runner, engine);
            
            spawnBlock();
        }

        function spawnBlock() {
            const size = 30;
            activeBlock = Bodies.rectangle(window.innerWidth/2, 50, size, size, { 
                restitution: 0.1, friction: 0.8 
            });
            Composite.add(engine.world, activeBlock);
        }

        function moveActive(dir) { if(activeBlock) Body.setPosition(activeBlock, {x: activeBlock.position.x + (dir * 30), y: activeBlock.position.y}); }
        function rotateActive() { if(activeBlock) Body.setAngle(activeBlock, activeBlock.angle + Math.PI/2); }
        function dropActive() { if(activeBlock) Body.applyForce(activeBlock, activeBlock.position, {x: 0, y: 0.1}); }

        // تشغيل اللعبة
        initGame();
    </script>
</body>
</html>
