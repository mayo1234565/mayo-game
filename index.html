<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mayo Quiz - Bet & Win</title>
    <style>
        body { background: #0f172a; color: white; font-family: 'Cairo', sans-serif; margin: 0; overflow: hidden; }
        .game-screen { width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* شكل الطاولة 3D */
        .table-3d { 
            width: 600px; height: 300px; background: #334155; 
            transform: perspective(600px) rotateX(45deg); 
            display: flex; justify-content: space-around; align-items: center;
            border: 10px solid #1e293b; border-radius: 20px;
        }
        .bet-box { width: 150px; height: 150px; background: #475569; border: 4px dashed #94a3b8; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* شخصيات اللاعبين */
        .player { width: 50px; height: 50px; border-radius: 50%; position: absolute; transition: 0.3s; border: 3px solid white; }
    </style>
</head>
<body>

<div class="game-screen" id="lobby">
    <h1>Mayo Quiz: The Show</h1>
    <div id="controls">
        <input type="text" id="name" placeholder="Enter Name">
        <button onclick="joinGame('host')">Host Game</button>
        <button onclick="joinGame('player')">Join as Player</button>
    </div>
</div>

<div class="game-screen hidden" id="gameplay">
    <h2 id="question-text">Waiting for host...</h2>
    <div class="table-3d">
        <div class="bet-box" id="box-1">Option A</div>
        <div class="bet-box" id="box-2">Option B</div>
        <div class="bet-box" id="box-3">Option C</div>
    </div>
    <div id="players-area"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = { /* ضع مفاتيحك هنا */ };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let roomId = "GAME_001";
    let myRole = ""; // 'host' or 'player'
    let myName = "";

    function joinGame(role) {
        myName = document.getElementById('name').value;
        myRole = role;
        
        // إضافة اللاعب للسيرفر
        db.ref('games/' + roomId + '/players/' + myName).set({
            role: role,
            money: 10000,
            x: 0, y: 0
        });

        document.getElementById('lobby').classList.add('hidden');
        document.getElementById('gameplay').classList.remove('hidden');
    }

    // نظام الحركة
    document.onkeydown = (e) => {
        let step = 10;
        if(e.key === 'ArrowLeft') move(-step, 0);
        if(e.key === 'ArrowRight') move(step, 0);
    };

    function move(dx, dy) {
        db.ref('games/' + roomId + '/players/' + myName).transaction(p => {
            if(p) { p.x += dx; return p; }
        });
    }

    // الاستماع لتحركات الآخرين
    db.ref('games/' + roomId + '/players').on('value', (snap) => {
        const players = snap.val();
        for(let name in players) {
            let p = players[name];
            let el = document.getElementById('p-' + name) || createPlayer(name);
            el.style.left = p.x + 'px';
        }
    });

    function createPlayer(name) {
        let div = document.createElement('div');
        div.id = 'p-' + name;
        div.className = 'player';
        div.style.background = myRole === 'host' ? 'gold' : 'blue';
        document.body.appendChild(div);
        return div;
    }
</script>
</body>
</html>
