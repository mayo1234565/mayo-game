<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبتي</title>
    <style>
        /* إعدادات عامة والخطوط */
        @import url('https://fonts.googleapis.com/css2?family=Changa:wght@400;700&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            color: white;
            font-family: 'Changa', sans-serif; /* خط مناسب للألعاب */
            overflow: hidden;
        }

        /* خلفية النجوم (موجودة في الشاشتين) */
        .stars-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat top center;
            z-index: 0;
            animation: moveStars 50s linear infinite;
        }

        @keyframes moveStars {
            from { background-position: 0 0; }
            to { background-position: -10000px 5000px; }
        }

        /* الكوكب (في الشاشة الأولى فقط) */
        .planet {
            position: absolute;
            top: 20%;
            left: 10%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle at 30% 30%, #4a4a5a, #1a1a25);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(74, 74, 90, 0.3);
            z-index: 1;
            animation: float 10s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* الشاشات */
        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        #setup-screen {
            display: none; /* مخفية في البداية */
            opacity: 0;
            flex-direction: column;
        }

        /* زر البداية (ستايل بكسل/ريترو) */
        .start-btn {
            background-color: transparent;
            color: #fff;
            border: 4px solid #fff;
            padding: 15px 50px;
            font-size: 2rem;
            font-family: 'Changa', sans-serif;
            font-weight: bold;
            cursor: pointer;
            text-shadow: 2px 2px 0px #ff003c;
            box-shadow: 4px 4px 0px #ff003c;
            transition: all 0.2s;
        }

        .start-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #ff003c;
        }

        /* واجهة البلايستيشن (الشاشة الثانية) */
        .ps-panel {
            background: rgba(20, 20, 30, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 40px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .ps-panel h2 {
            margin-top: 0;
            font-size: 1.8rem;
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        /* إعدادات الأفاتار والإطار */
        .avatar-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 20px auto;
        }

        .avatar-img {
            width: 120px;
            height: 120px;
            border-radius: 10px; /* أو 50% لو تبيها دائرية */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 1;
        }

        .frame-img {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: none; /* عشان ما يأثر على الكليك */
        }

        /* حقل إدخال الاسم */
        .name-input {
            width: 80%;
            padding: 12px;
            margin: 20px 0;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-family: 'Changa', sans-serif;
            font-size: 1.2rem;
            text-align: center;
            border-radius: 5px;
            outline: none;
            transition: border-color 0.3s;
        }

        .name-input:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }

        /* أزرار الغرف */
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .action-btn {
            background: transparent;
            color: white;
            border: 2px solid #00d2ff;
            padding: 10px 25px;
            font-size: 1.2rem;
            font-family: 'Changa', sans-serif;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
        }

        .action-btn:hover {
            background: #00d2ff;
            color: black;
            box-shadow: 0 0 15px #00d2ff;
        }
    </style>
</head>
<body>

    <div class="stars-bg"></div>

    <div id="start-screen" class="screen">
        <div class="planet"></div>
        <button class="start-btn" onclick="goToSetup()">ابــــدأ</button>
    </div>

    <div id="setup-screen" class="screen">
        <div class="ps-panel">
            <h2>تجهيز اللاعب</h2>
            
            <div class="avatar-container">
                <img src="https://i.pinimg.com/736x/21/df/b7/21dfb731dd5da68832c3cb16a49fa7e5.jpg" alt="Avatar" class="avatar-img" id="user-avatar">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Hexagon_border.svg/1024px-Hexagon_border.svg.png" alt="Frame" class="frame-img" id="user-frame">
            </div>

            <input type="text" class="name-input" placeholder="أدخل اسمك هنا...">

            <div class="action-buttons">
                <button class="action-btn">إنشاء غرفة</button>
                <button class="action-btn">انضمام لغرفة</button>
            </div>
        </div>
    </div>

    <script>
        function goToSetup() {
            const startScreen = document.getElementById('start-screen');
            const setupScreen = document.getElementById('setup-screen');
            
            // إخفاء شاشة البداية
            startScreen.style.opacity = '0';
            
            setTimeout(() => {
                startScreen.style.display = 'none';
                
                // إظهار شاشة الإعدادات (بدون الكوكب)
                setupScreen.style.display = 'flex';
                // تأخير بسيط عشان يشتغل الـ transition صح
                setTimeout(() => {
                    setupScreen.style.opacity = '1';
                }, 50);
            }, 500); // نفس مدة الـ transition في الـ CSS
        }
    </script>

</body>
</html>
