<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبتي</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Changa:wght@400;700&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            color: white;
            font-family: 'Changa', sans-serif;
            overflow: hidden;
        }

        /* خلفية النجوم (حركة هادئة جداً ومريحة) */
        .stars-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat top center;
            z-index: 0;
            animation: moveStars 150s linear infinite; 
        }

        @keyframes moveStars {
            from { background-position: 0 0; }
            to { background-position: -2000px 1000px; }
        }

        /* الكوكب المتحرك ببطء (في الشاشة الأولى) */
        .planet {
            position: absolute;
            top: 20%;
            left: 20%;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 30% 30%, #3b3b4f, #0d0d14);
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(59, 59, 79, 0.3);
            z-index: 1;
            animation: rotatePlanet 60s linear infinite;
        }

        @keyframes rotatePlanet {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* إعدادات الشاشات للتنقل */
        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.8s ease;
        }

        #setup-screen {
            display: none;
            opacity: 0;
            flex-direction: column;
        }

        /* زر البداية بستايل بكسل */
        .start-btn {
            background-color: transparent;
            color: #fff;
            border: 4px solid #fff;
            padding: 15px 50px;
            font-size: 2.5rem;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 4px 4px 0px rgba(200, 0, 40, 0.8);
            text-shadow: 2px 2px 0px rgba(200, 0, 40, 0.8);
            transition: all 0.2s;
            z-index: 2;
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 6px 6px 0px rgba(200, 0, 40, 0.8);
        }

        /* واجهة البلايستيشن */
        .ps-panel {
            background: rgba(15, 15, 20, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        /* -------------------------------------- */
        /* منطقة الأفاتار والإطار (نظام أوفرواتش) */
        /* -------------------------------------- */
        .avatar-wrapper {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 10px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* صورة الأنمي (الأساس) */
        .avatar-img {
            width: 100px;
            height: 100px;
            border-radius: 5px; /* حواف ناعمة لتناسب الشكل السداسي */
            object-fit: cover;
            z-index: 1;
        }

        /* الإطار (فوق الأنمي) */
        .frame-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180px; 
            height: 180px;
            /* استخدمنا الصورة اللي أرسلتها */
            background-image: url('give-us-back-this-right-now-ranks-and-level-portraits-v0-t9ciyfkjjl5d1.webp');
            background-size: 750% auto; /* تكبير الصورة عشان نركز على إطار واحد */
            background-position: 81.5% center; /* هذا الرقم يحدد الإطار الأحمر (Ruby) بالضبط */
            mix-blend-mode: screen; /* 🔥 السر هنا: يخفي الخلفية السوداء ويخلي الإطار يضوي 🔥 */
            z-index: 2;
            pointer-events: none;
        }

        /* أزرار التعديل الصغار */
        .edit-btns {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .edit-btn {
            background: rgba(255,255,255,0.1);
            color: #ccc;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Changa', sans-serif;
        }

        .edit-btn:hover {
            background: rgba(255,255,255,0.3);
            color: #fff;
        }

        /* حقل إدخال الاسم (خط ناعم فقط) */
        .name-input {
            width: 70%;
            padding: 10px;
            margin-bottom: 40px;
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-family: 'Changa', sans-serif;
            font-size: 1.5rem;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        .name-input:focus {
            border-bottom: 2px solid #e60039; 
        }

        /* أزرار الغرف */
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .action-btn {
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 25px;
            font-size: 1.2rem;
            font-family: 'Changa', sans-serif;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
        }

        .action-btn:hover {
            background: #e60039;
            border-color: #e60039;
            box-shadow: 0 0 15px rgba(230, 0, 57, 0.5);
        }
    </style>
</head>
<body>

    <div class="stars-bg"></div>

    <div id="start-screen" class="screen">
        <div class="planet"></div>
        <button class="start-btn" onclick="goToSetup()">ابــــدأ</button>
    </div>

    <div id="setup-screen" class="screen">
        <div class="ps-panel">
            
            <div class="avatar-wrapper">
                <img src="dark-anime-pictures-iwmu3b0sun9r6789.webp" alt="Avatar" class="avatar-img">
                <div class="frame-overlay"></div>
            </div>

            <div class="edit-btns">
                <button class="edit-btn">تغيير الصورة</button>
                <button class="edit-btn">تغيير الإطار</button>
            </div>

            <input type="text" class="name-input" placeholder="اسمك...">

            <div class="action-buttons">
                <button class="action-btn" onclick="createRoom()">إنشاء غرفة</button>
                <button class="action-btn">انضمام لغرفة</button>
            </div>
        </div>
    </div>

    <script>
        function goToSetup() {
            const startScreen = document.getElementById('start-screen');
            const setupScreen = document.getElementById('setup-screen');
            
            // إخفاء الشاشة الأولى
            startScreen.style.opacity = '0';
            
            setTimeout(() => {
                startScreen.style.display = 'none';
                
                // إظهار الشاشة الثانية
                setupScreen.style.display = 'flex';
                setTimeout(() => {
                    setupScreen.style.opacity = '1';
                }, 50);
            }, 800);
        }

        function createRoom() {
            alert("تم إنشاء الغرفة! بانتظار أصدقائك...");
        }
    </script>

</body>
</html>
