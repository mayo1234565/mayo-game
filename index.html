<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبتي</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Changa:wght@400;700&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #020202;
            color: white;
            font-family: 'Changa', sans-serif;
            overflow: hidden;
        }

        /* خلفية النجوم (حركة هادئة جداً ومريحة) */
        .stars-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat top center;
            z-index: 0;
            animation: moveStars 180s linear infinite; 
        }

        @keyframes moveStars {
            from { background-position: 0 0; }
            to { background-position: -2000px 1000px; }
        }

        /* الكوكب المتحرك ببطء في الخلفية */
        .planet {
            position: absolute;
            top: 20%;
            left: 15%;
            width: 140px;
            height: 140px;
            background: radial-gradient(circle at 30% 30%, #2c3e50, #000000);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(44, 62, 80, 0.4);
            z-index: 1;
            animation: rotatePlanet 100s linear infinite;
        }

        @keyframes rotatePlanet {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* إعدادات الشاشات للتنقل */
        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.6s ease;
        }

        #setup-screen {
            display: none;
            opacity: 0;
            flex-direction: column;
        }

        /* زر البداية بستايل بكسل */
        .start-btn {
            background-color: transparent;
            color: #fff;
            border: 4px solid #fff;
            padding: 15px 60px;
            font-size: 2.8rem;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 5px 5px 0px #e60039;
            text-shadow: 2px 2px 0px #e60039;
            transition: all 0.2s;
            z-index: 2;
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 7px 7px 0px #e60039;
        }

        /* واجهة قائمة الـ UI المستوحاة من البلايستيشن */
        .ps-panel {
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
        }

        /* حاوية الأفاتار والإطار مثل أوفرواتش */
        .avatar-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* صورة الأنمي المظلم */
        .avatar-img {
            width: 110px;
            height: 110px;
            border-radius: 6px;
            object-fit: cover;
            z-index: 1;
        }

        /* الإطار السداسي الياقوتي */
        .frame-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 230px; 
            height: 230px;
            /* تم استخدام رابط مباشر متاح للجميع من ريديت للـتأكد من عمله */
            background-image: url('https://preview.redd.it/give-us-back-this-right-now-ranks-and-level-portraits-v0-t9ciyfkjjl5d1.png?width=1080&crop=smart&auto=webp&s=87204f0525d8869b2d07519ba2a3286377777d13');
            background-size: 730% auto; 
            background-position: 81.3% center; 
            mix-blend-mode: screen; /* إخفاء الخلفية السوداء */
            z-index: 2;
            pointer-events: none;
        }

        /* أزرار التعديل */
        .edit-btns {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
        }

        .edit-btn {
            background: rgba(255,255,255,0.06);
            color: #b3b3b3;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Changa', sans-serif;
        }

        .edit-btn:hover {
            background: rgba(255,255,255,0.2);
            color: #fff;
            border-color: rgba(255,255,255,0.4);
        }

        /* حقل الاسم الاحترافي (خط سفلي فقط) */
        .name-input {
            width: 75%;
            padding: 8px;
            margin-bottom: 40px;
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-family: 'Changa', sans-serif;
            font-size: 1.6rem;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        .name-input:focus {
            border-bottom: 2px solid #e60039; 
        }

        /* أزرار الغرف */
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .action-btn {
            background: rgba(20, 20, 25, 0.6);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 14px 25px;
            font-size: 1.1rem;
            font-family: 'Changa', sans-serif;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
        }

        .action-btn:hover {
            background: #e60039;
            border-color: #e60039;
            box-shadow: 0 0 20px rgba(230, 0, 57, 0.6);
        }
    </style>
</head>
<body>

    <div class="stars-bg"></div>

    <div id="start-screen" class="screen">
        <div class="planet"></div>
        <button class="start-btn" onclick="goToSetup()">ابــــدأ</button>
    </div>

    <div id="setup-screen" class="screen">
        <div class="ps-panel">
            
            <div class="avatar-wrapper">
                <img src="https://i.pinimg.com/736x/21/df/b7/21dfb731dd5da68832c3cb16a49fa7e5.jpg" alt="Avatar" class="avatar-img">
                <div class="frame-overlay"></div>
            </div>

            <div class="edit-btns">
                <button class="edit-btn" onclick="alert('سيتم فتح ألبوم الصور قريباً!')">تغيير الصورة</button>
                <button class="edit-btn" onclick="alert('سيتم فتح قائمة الإطارات قريباً!')">تغيير الإطار</button>
            </div>

            <input type="text" class="name-input" placeholder="اسمك...">

            <div class="action-buttons">
                <button class="action-btn" onclick="createRoom()">إنشاء غرفة</button>
                <button class="action-btn" onclick="alert('جاري البحث عن غرف متاحة...')">انضمام لغرفة</button>
            </div>
        </div>
    </div>

    <script>
        function goToSetup() {
            const startScreen = document.getElementById('start-screen');
            const setupScreen = document.getElementById('setup-screen');
            
            startScreen.style.opacity = '0';
            
            setTimeout(() => {
                startScreen.style.display = 'none';
                setupScreen.style.display = 'flex';
                setTimeout(() => {
                    setupScreen.style.opacity = '1';
                }, 50);
            }, 600);
        }

        function createRoom() {
            // كود محاكاة لإنشاء غرفة حقيقية وإعطاء رقم عشوائي
            const roomId = Math.floor(100000 + Math.random() * 900000);
            alert("تم إنشاء الغرفة بنجاح! \nرقم الغرفة: " + roomId + "\nأرسل الرقم لأصدقائك ليدخلوا معك.");
        }
    </script>

</body>
</html>
