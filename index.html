<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚀 NEON OVERDRIVE: 7-PLAYER SHOWDOWN 🚀</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Cairo:wght@700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #050508; font-family: 'Orbitron', 'Cairo', sans-serif; color: #fff; }
        canvas { display: block; width: 100vw; height: 100vh; background: #020205; }
        
        /* واجهة القائمة الرئيسية */
        .overlay { position: absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; background: rgba(5,5,10,0.9); z-index:100; padding: 20px; transition: all 0.5s; }
        h1 { font-size: 3rem; color: #00f0ff; text-shadow: 0 0 20px #00f0ff; margin-bottom: 10px; text-align: center; }
        .setup-box { background: rgba(255,255,255,0.03); border: 2px solid #ff0055; padding: 30px; border-radius: 15px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 0 30px rgba(255,0,85,0.2); }
        input { width: 100%; padding: 12px; background: #000; border: 1px solid #00f0ff; color: #fff; text-align: center; font-size: 1.2rem; margin-bottom: 15px; border-radius: 5px; }
        .btn { width: 100%; padding: 15px; border: none; font-size: 1.2rem; font-weight: bold; cursor: pointer; border-radius: 5px; margin-bottom: 10px; transition: 0.3s; }
        .btn-host { background: #00f0ff; color: #000; box-shadow: 0 0 15px #00f0ff; }
        .btn-join { background: #ff0055; color: #fff; box-shadow: 0 0 15px #ff0055; }
        .btn:hover { transform: scale(1.02); filter: brightness(1.2); }
        
        /* شاشة التحكم للجوال */
        #controller-ui { display: none; position: absolute; top:0; left:0; width:100%; height:100%; background:#111; z-index:150; grid-template-columns: 1fr 1fr; }
        .ctrl-btn { display:flex; align-items:center; justify-content:center; font-size: 3rem; user-select:none; -webkit-user-select:none; }
        .ctrl-left { background: #ff005522; border-right: 1px solid #ff005555; color: #ff0055; }
        .ctrl-right { background: #00f0ff22; border-left: 1px solid #00f0ff55; color: #00f0ff; }
        
        #room-id-display { position: absolute; top: 15px; left: 15px; color: #00f0ff; font-size: 1.2rem; z-index: 50; text-shadow: 0 0 5px #00f0ff; }
        #player-count { position: absolute; top: 15px; right: 15px; color: #ff0055; font-size: 1.2rem; z-index: 50; }
    </style>
    <!-- مكتبة الـ Peer-to-Peer السحرية للربط الشبكي بدون سيرفر -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>

    <!-- عرض رقم الغرفة واللاعبين أثناء اللعب -->
    <div id="room-id-display"></div>
    <div id="player-count"></div>

    <!-- واجهة الدخول -->
    <div id="menu" class="overlay">
        <h1>NEON OVERDRIVE</h1>
        <p style="color: #888; margin-bottom: 25px;">سباق نيون جماعي مدمر يتسع لـ 7 لاعبين فما فوق</p>
        
        <div class="setup-box">
            <input type="text" id="username-input" placeholder="اكتب اسمك الكابتن..." maxlength="10">
            <button class="btn btn-host" onclick="initHost()">إنشاء غرفة جديدة (Host)</button>
            <hr style="border: 0; height: 1px; background: rgba(255,255,255,0.1); margin: 15px 0;">
            <input type="text" id="room-id-input" placeholder="أدخل رمز الغرفة للإنضمام...">
            <button class="btn btn-join" onclick="initJoin()">انضمام للسباق</button>
        </div>
    </div>

    <!-- واجهة التحكم عبر الجوال في حال انضمام اللاعب كـ يد تحكم -->
    <div id="controller-ui">
        <div class="ctrl-btn ctrl-left" id="left-touch">◀ لـف يسار</div>
        <div class="ctrl-btn ctrl-right" id="right-touch">لف يمين ▶</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        let peer = null;
        let connections = [];
        let isHost = false;
        let myId = "";
        let myName = "";
        
        // بيانات اللعبة والمحرك
        let players = {}; 
        const colors = ['#00f0ff', '#ff0055', '#00ff88', '#ffdf00', '#ff00ff', '#ffffff', '#ff9900'];
        let stars = [];

        // تهيئة النجوم في الخلفية لأثر السرعة
        for(let i=0; i<150; i++) {
            stars.push({ x: Math.random()*width, y: Math.random()*height, sz: Math.random()*2, spd: Math.random()*3 + 1 });
        }

        // --- كود الشبكة والـ Peer-to-Peer (القلب النابض) ---
        
        function getUsername() {
            let name = document.getElementById('username-input').value.trim();
            return name ? name : "لاعب_" + Math.floor(Math.random()*900 + 100);
        }

        // 1. صانع الغرفة (الـ Host المضيف)
        function initHost() {
            myName = getUsername();
            isHost = true;
            // توليد رمز غرفة عشوائي قصير سهل النقل
            let customRoomId = "NEON-" + Math.random().toString(36).substring(2,6).toUpperCase();
            
            peer = new Peer(customRoomId);
            
            peer.on('open', (id) => {
                myId = id;
                document.getElementById('menu').style.opacity = '0';
                setTimeout(() => document.getElementById('menu').style.display = 'none', 500);
                document.getElementById('room-id-display').innerText = `رمز الغرفة: ${id} (شارك الرمز مع الـ 6 لاعبين الآخرين)`;
                
                // إضافة المضيف كلاعب أول سفينته زرقاء
                addPlayer(myId, myName, 0);
                startEngine();
            });

            // استقبال اتصالات اللاعبين الآخرين تلقائياً وبسرعة البرق
            peer.on('connection', (conn) => {
                connections.push(conn);
                conn.on('data', (data) => {
                    if(data.type === 'join_request') {
                        let pCount = Object.keys(players).length;
                        if(pCount >= 7) {
                            conn.send({ type: 'rejected', reason: 'الغرفة ممتلئة بـ 7 لاعبين!' });
                            return;
                        }
                        addPlayer(conn.peer, data.name, pCount);
                        // نرسل لكل اللاعبين شجرة اللاعبين الحالية لتحديث الشاشات لديهم
                        broadcast({ type: 'sync', players: players });
                    }
                    if(data.type === 'control') {
                        if(players[conn.peer]) players[conn.peer].input = data.input;
                    }
                });
            });
        }

        // 2. المنضم للغرفة (اللاعبون من 2 إلى 7)
        function initJoin() {
            myName = getUsername();
            let targetRoomId = document.getElementById('room-id-input').value.trim().toUpperCase();
            if(!targetRoomId) return alert("الرجاء إدخال رمز الغرفة!");

            peer = new Peer();
            peer.on('open', (id) => {
                myId = id;
                let conn = peer.connect(targetRoomId);
                
                conn.on('open', () => {
                    conn.send({ type: 'join_request', name: myName });
                });

                conn.on('data', (data) => {
                    if(data.type === 'sync') {
                        players = data.players;
                        // تحويل واجهة المنضم إلى يد تحكم جبارة تملأ الجوال
                        document.getElementById('menu').style.display = 'none';
                        document.getElementById('controller-ui').style.display = 'grid';
                        setupControllerEvents(conn);
                    }
                    if(data.type === 'rejected') {
                        alert(data.reason);
                        location.reload();
                    }
                });
            });
        }

        function broadcast(data) {
            connections.forEach(conn => { if(conn.open) conn.send(data); });
        }

        // إرسال حركات اليد من الجوال إلى الـ Host
        function setupControllerEvents(conn) {
            let activeInput = { left: false, right: false };
            
            const sendInput = () => conn.send({ type: 'control', input: activeInput });

            document.getElementById('left-touch').onpointerdown = (e) => { activeInput.left = true; sendInput(); };
            document.getElementById('left-touch').onpointerup = (e) => { activeInput.left = false; sendInput(); };
            document.getElementById('right-touch').onpointerdown = (e) => { activeInput.right = true; sendInput(); };
            document.getElementById('right-touch').onpointerup = (e) => { activeInput.right = false; sendInput(); };
        }

        // --- محرك وقوانين حركة السفن السبعة ---

        function addPlayer(id, name, index) {
            players[id] = {
                name: name,
                x: width / 2 + (index - 3) * 50, // توزيع السفن جنباً إلى جنب في خط البداية
                y: height - 100,
                angle: -Math.PI / 2,
                speed: 4,
                color: colors[index % colors.length],
                input: { left: false, right: false },
                score: 0
            };
            document.getElementById('player-count').innerText = `اللاعبين في الحلبة: ${Object.keys(players).length} / 7`;
        }

        // التحكم عبر كيبورد الكمبيوتر للـ Host أيضاً للتجربة
        let hostKeys = { left: false, right: false };
        window.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowLeft') hostKeys.left = true;
            if(e.key === 'ArrowRight') hostKeys.right = true;
            if(players[myId]) players[myId].input = hostKeys;
        });
        window.addEventListener('keyup', (e) => {
            if(e.key === 'ArrowLeft') hostKeys.left = false;
            if(e.key === 'ArrowRight') hostKeys.right = false;
            if(players[myId]) players[myId].input = hostKeys;
        });

        // حلقة التحديث والرسم الرئيسية الـ 60 FPS
        function startEngine() {
            function loop() {
                // رسم الفضاء المعتم مع Motion Blur
                ctx.fillStyle = 'rgba(2, 2, 5, 0.3)';
                ctx.fillRect(0, 0, width, height);

                // رسم خلفية النجوم المتحركة بسرعة لأسفل الشاشة
                ctx.fillStyle = '#fff';
                stars.forEach(s => {
                    s.y += s.spd;
                    if(s.y > height) { s.y = 0; s.x = Math.random()*width; }
                    ctx.fillRect(s.x, s.y, s.sz, s.sz);
                });

                // معالجة حركة كل سفينة من السفن السبعة
                Object.keys(players).forEach(id => {
                    let p = players[id];
                    
                    // الدوران بناءً على الأزرار المضغوطة
                    if(p.input.left) p.angle -= 0.05;
                    if(p.input.right) p.angle += 0.05;

                    // فيزياء الحركة الموجهة بزاوية الدوران المتجهي
                    p.x += Math.cos(p.angle) * p.speed;
                    p.y += Math.sin(p.angle) * p.speed;

                    // منع الخروج من حواف الشاشة ومحاكاة الارتداد النيوني
                    if(p.x < 0) { p.x = 0; p.angle = Math.PI - p.angle; }
                    if(p.x > width) { p.x = width; p.angle = Math.PI - p.angle; }
                    if(p.y < 0) { p.y = height; p.score++; } // إذا تجاوز الأعلى يكسب نقطة ويلف مجدداً
                    if(p.y > height) p.y = height;

                    // --- رسم سفينة النيون ثلاثية الشكل ---
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.angle);
                    
                    // توهج النيون الخاص بالسفينة
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = p.color;
                    ctx.strokeStyle = p.color;
                    ctx.lineWidth = 3;
                    ctx.fillStyle = '#111';

                    ctx.beginPath();
                    ctx.moveTo(15, 0);
                    ctx.lineTo(-15, -10);
                    ctx.lineTo(-10, 0);
                    ctx.lineTo(-15, 10);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                    ctx.shadowBlur = 0;

                    // كتابة اسم اللاعب والسكور فوق سفينته
                    ctx.fillStyle = '#fff';
                    ctx.font = '12px Cairo';
                    ctx.textAlign = 'center';
                    ctx.fillText(`${p.name} [${p.score}]`, p.x, p.y - 20);
                });

                // في حال كان المضيف يغذي البقية، نقوم ببث الإحداثيات المحدثة بشكل مستمر
                if(isHost) {
                    broadcast({ type: 'sync', players: players });
                }

                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        }

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
