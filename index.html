<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic AAA Game Menu & Lobby</title>
    <style>
        /* --- GLOBAL STYLES --- */
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #030305;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            color: #fff;
        }

        /* --- BACKGROUND ENVIRONMENT --- */
        #environment {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .stars {
            position: absolute;
            width: 2px; height: 2px;
            background: transparent;
            box-shadow: 100px 200px #fff, 300px 500px #fff, 800px 100px #fff, 
                        1200px 400px #fff, 500px 800px #fff, 1500px 900px #fff, 
                        200px 900px #fff, 1000px 600px #fff, 1700px 200px #fff;
            animation: twinkle 4s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); box-shadow: 100px 200px #fff, 300px 500px #fff, 800px 100px #fff, 1200px 400px #fff, 500px 800px #fff, 1500px 900px #fff, 200px 900px #fff, 1000px 600px #fff, 1700px 200px #fff, 0 0 10px #fff; }
        }

        .planet {
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
        }
        .planet-1 {
            width: 300px; height: 300px;
            background: radial-gradient(circle at 30% 30%, #2a2a35, #000);
            top: 10%; left: -100px;
            animation: float 20s infinite ease-in-out alternate;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(40px) rotate(10deg); }
        }

        /* --- SCREENS --- */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), transform 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.05) translateY(-20px);
        }

        /* --- START SCREEN --- */
        #start-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 3rem;
            font-family: inherit;
            font-weight: 700;
            letter-spacing: 15px;
            cursor: pointer;
            outline: none;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
            transition: text-shadow 0.3s ease, transform 0.3s ease;
        }
        #start-btn:hover {
            text-shadow: 0 0 20px #ff003c, 0 0 40px #ff003c;
            transform: scale(1.05);
        }

        .particle {
            position: absolute;
            background-color: #ff003c;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff003c, 0 0 15px #ff003c;
            pointer-events: none;
            animation: particle-fade 1s ease-out forwards;
        }

        @keyframes particle-fade {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
        }

        /* --- INTERACTIVE PROFILE SETUP --- */
        .setup-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background: rgba(5, 5, 10, 0.75);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .glow-text {
            background: transparent;
            border: none;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 2px;
            outline: none;
            text-align: center;
        }

        input[type="text"] {
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding: 10px;
            width: 300px;
            text-transform: uppercase;
            transition: border-color 0.3s, text-shadow 0.3s;
        }
        input[type="text"]:focus {
            border-bottom: 1px solid #ff003c;
            text-shadow: 0 0 10px rgba(255, 0, 60, 0.5);
        }

        select {
            appearance: none;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding: 8px 20px;
            cursor: pointer;
            text-align-last: center;
        }
        select option { background: #050505; color: #fff; }

        .upload-lbl {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: color 0.3s;
        }
        .upload-lbl:hover { color: #fff; text-shadow: 0 0 5px #fff; }

        .multiplayer-btns { display: flex; gap: 30px; margin-top: 10px; }
        .action-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 25px;
            color: rgba(255,255,255,0.8);
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 3px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        .action-btn:hover { 
            color: #fff; 
            border-color: #fff;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }
        .action-btn.red-glow {
            border-color: rgba(255, 0, 60, 0.4);
            color: #ff003c;
        }
        .action-btn.red-glow:hover { 
            color: #fff;
            background: #ff003c;
            box-shadow: 0 0 20px #ff003c;
            border-color: #ff003c;
        }

        /* --- CINEMATIC MULTIPLAYER LOBBY SCREEN (PHASE 3) --- */
        .lobby-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .lobby-header h1 {
            font-size: 2.5rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255,255,255,0.4);
        }
        .room-id-tag {
            font-size: 1.2rem;
            color: #ff003c;
            letter-spacing: 4px;
            font-weight: 600;
            margin-top: 5px;
            text-shadow: 0 0 10px rgba(255,0,60,0.4);
        }

        /* طريقة العرض الجانبية الممتازة للاعبين */
        .players-showcase {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            width: 90%;
            max-width: 1400px;
            min-height: 400px;
            padding: 20px;
            background: radial-gradient(ellipse at center, rgba(15,15,25,0.6) 0%, rgba(0,0,0,0) 70%);
        }

        /* بطاقة اللاعب داخل اللوبي */
        .player-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(180deg, rgba(20,20,30,0.6) 0%, rgba(5,5,10,0.9) 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 30px 20px;
            border-radius: 12px;
            width: 240px;
            position: relative;
            animation: join-anim 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        @keyframes join-anim {
            0% { opacity: 0; transform: scale(0.7) translateY(50px); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        .player-card .player-name-tag {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-top: 15px;
            text-align: center;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-card .player-status {
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: #a3e635;
            text-shadow: 0 0 5px #a3e635;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .lobby-footer-btns {
            margin-top: 5px;
            display: flex;
            gap: 20px;
        }

        /* --- VECTOR FRAME SYSTEM --- */
        .frame-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .rank-svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            z-index: 2;
        }

        .avatar-container {
            position: absolute;
            width: 82px;
            height: 94px;
            top: 45px;
            left: 59px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            background: #111116;
            z-index: 1;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Dynamic Rank Colors & Glows */
        .rank-bronze .accent-fill { fill: url(#bronze-grad); }
        .rank-bronze .accent-stroke { stroke: url(#bronze-grad); }
        .rank-bronze .glow-effect { filter: drop-shadow(0 0 8px rgba(167,105,71,0.6)); }

        .rank-silver .accent-fill { fill: url(#silver-grad); }
        .rank-silver .accent-stroke { stroke: url(#silver-grad); }
        .rank-silver .glow-effect { filter: drop-shadow(0 0 8px rgba(200,200,210,0.6)); }

        .rank-gold .accent-fill { fill: url(#gold-grad); }
        .rank-gold .accent-stroke { stroke: url(#gold-grad); }
        .rank-gold .glow-effect { filter: drop-shadow(0 0 12px rgba(250,190,40,0.7)); }

        .rank-platinum .accent-fill { fill: url(#plat-grad); }
        .rank-platinum .accent-stroke { stroke: url(#plat-grad); }
        .rank-platinum .glow-effect { filter: drop-shadow(0 0 12px rgba(180,210,200,0.7)); }

        .rank-diamond .accent-fill { fill: url(#diamond-grad); }
        .rank-diamond .accent-stroke { stroke: url(#diamond-grad); }
        .rank-diamond .glow-effect { filter: drop-shadow(0 0 15px rgba(100,180,255,0.8)); }

        .rank-ruby .accent-fill { fill: url(#ruby-grad); }
        .rank-ruby .accent-stroke { stroke: url(#ruby-grad); }
        .rank-ruby .glow-effect { filter: drop-shadow(0 0 15px rgba(240,50,80,0.8)); }

        .rank-solar .accent-fill { fill: url(#solar-grad); }
        .rank-solar .accent-stroke { stroke: url(#solar-grad); }
        .rank-solar .glow-effect { filter: drop-shadow(0 0 20px rgba(250,130,20,0.9)); }

        .rank-title {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: -5px;
        }
    </style>
</head>
<body>

    <div id="environment">
        <div class="stars"></div>
        <div class="planet planet-1"></div>
    </div>

    <svg style="position: absolute; width: 0; height: 0;">
        <defs>
            <linearGradient id="bronze-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#b87333"/><stop offset="50%" stop-color="#ffd7b5"/><stop offset="100%" stop-color="#5c341a"/>
            </linearGradient>
            <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#9ca3af"/><stop offset="50%" stop-color="#f3f4f6"/><stop offset="100%" stop-color="#374151"/>
            </linearGradient>
            <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#d97706"/><stop offset="50%" stop-color="#fef08a"/><stop offset="100%" stop-color="#78350f"/>
            </linearGradient>
            <linearGradient id="plat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#475569"/><stop offset="30%" stop-color="#cbd5e1"/><stop offset="70%" stop-color="#fef08a"/><stop offset="100%" stop-color="#1e293b"/>
            </linearGradient>
            <linearGradient id="diamond-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#2563eb"/><stop offset="40%" stop-color="#93c5fd"/><stop offset="70%" stop-color="#fdf2e9"/><stop offset="100%" stop-color="#1d4ed8"/>
            </linearGradient>
            <linearGradient id="ruby-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#991b1b"/><stop offset="40%" stop-color="#f87171"/><stop offset="70%" stop-color="#ffe4e6"/><stop offset="100%" stop-color="#450a0a"/>
            </linearGradient>
            <linearGradient id="solar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ea580c"/><stop offset="50%" stop-color="#facc15"/><stop offset="100%" stop-color="#7c2d12"/>
            </linearGradient>
        </defs>
    </svg>

    <div id="phase1" class="screen">
        <button id="start-btn">START</button>
    </div>

    <div id="phase2" class="screen hidden">
        <div class="setup-container">
            <h2 style="letter-spacing: 5px; font-weight: 700; margin-bottom: 10px;">PLAYER PROFILE</h2>
            
            <label for="upload-pic" class="upload-lbl">CLICK TO UPLOAD AVATAR</label>
            <input type="file" id="upload-pic" accept="image/*" hidden>

            <select id="rank-select" class="glow-text">
                <option value="bronze">RANK: BRONZE</option>
                <option value="silver">RANK: SILVER</option>
                <option value="gold">RANK: GOLD</option>
                <option value="platinum">RANK: PLATINUM</option>
                <option value="diamond">RANK: DIAMOND</option>
                <option value="ruby">RANK: RUBY</option>
                <option value="solar">RANK: SOLAR</option>
            </select>

            <input type="text" id="player-name" class="glow-text" value="RECON_SOLDIER" placeholder="ENTER PLAYER NAME" autocomplete="off" maxlength="14">
            
            <div class="multiplayer-btns">
                <button id="join-room-btn" class="action-btn">JOIN ROOM</button>
                <button id="create-room-btn" class="action-btn red-glow">CREATE ROOM</button>
            </div>
        </div>
    </div>

    <div id="phase3" class="screen hidden">
        <div class="lobby-header">
            <h1 id="lobby-title">MULTIPLAYER LOBBY</h1>
            <div id="room-id-display" class="room-id-tag">ROOM ID: #0000</div>
        </div>

        <div id="players-showcase" class="players-showcase">
            </div>

        <div class="lobby-footer-btns">
            <button id="leave-lobby-btn" class="action-btn" style="font-size: 1.1rem; border-color: rgba(255,255,255,0.1)">LEAVE ROOM</button>
            <button id="start-game-btn" class="action-btn red-glow" style="font-size: 1.1rem;">START MATCH</button>
        </div>
    </div>

    <script>
        // --- DOM ELEMENTS ---
        const startBtn = document.getElementById('start-btn');
        const phase1 = document.getElementById('phase1');
        const phase2 = document.getElementById('phase2');
        const phase3 = document.getElementById('phase3');
        
        const rankSelect = document.getElementById('rank-select');
        const playerNameInput = document.getElementById('player-name');
        const uploadPic = document.getElementById('upload-pic');
        
        const createRoomBtn = document.getElementById('create-room-btn');
        const joinRoomBtn = document.getElementById('join-room-btn');
        const leaveLobbyBtn = document.getElementById('leave-lobby-btn');
        const playersShowcase = document.getElementById('players-showcase');
        const roomIdDisplay = document.getElementById('room-id-display');

        // --- STATE DATA ---
        let particleInterval;
        let myAvatarData = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";
        
        const rankColors = {
            bronze: '#cd7f32', silver: '#e5e4e2', gold: '#ffe600',
            platinum: '#a3e635', diamond: '#60a5fa', ruby: '#f43f5e', solar: '#f97316'
        };

        // مصفوفة وهمية للاعبين الآخرين لجعل اللوبي يبدو رائعاً ومليئاً باللاعبين عند الانضمام
        const mockPlayers = [
            { name: "VORTEX_GHOST", rank: "diamond", avatar: "https://picsum.photos/id/1025/100/100" },
            { name: "PHOENIX_N1", rank: "ruby", avatar: "https://picsum.photos/id/1074/100/100" }
        ];

        // --- AMBIENT PARTICLES SYSTEM ---
        function createParticles(e, burstCount = 1) {
            const rect = startBtn.getBoundingClientRect();
            const btnCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            for (let i = 0; i < burstCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                const size = Math.random() * 4 + 2;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                const startX = btnCenter.x + (Math.random() - 0.5) * rect.width;
                const startY = btnCenter.y + (Math.random() - 0.5) * rect.height;
                particle.style.left = `${startX}px`;
                particle.style.top = `${startY}px`;
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 100 + 50;
                particle.style.setProperty('--dx', `${Math.cos(angle) * velocity}px`);
                particle.style.setProperty('--dy', `${Math.sin(angle) * velocity}px`);
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 1000);
            }
        }

        startBtn.addEventListener('mouseenter', (e) => {
            createParticles(e, 5);
            particleInterval = setInterval(() => createParticles(e, 2), 100);
        });
        startBtn.addEventListener('mouseleave', () => clearInterval(particleInterval));

        startBtn.addEventListener('click', (e) => {
            clearInterval(particleInterval);
            createParticles(e, 30);
            setTimeout(() => {
                phase1.classList.add('hidden');
                setTimeout(() => phase2.classList.remove('hidden'), 500);
            }, 300);
        });

        // --- AVATAR UPLOAD ---
        uploadPic.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    myAvatarData = event.target.result;
                    alert("Avatar updated successfully!");
                };
                reader.readAsDataURL(file);
            }
        });

        // --- FUNCTION TO GENERATE VECTOR CARD HTML ---
        function generatePlayerCardHTML(name, rank, avatarUrl) {
            const color = rankColors[rank];
            return `
                <div class="player-card">
                    <div class="frame-wrapper rank-${rank}">
                        <div class="avatar-container">
                            <img src="${avatarUrl}" alt="Avatar">
                        </div>
                        <svg class="rank-svg glow-effect" viewBox="0 0 260 260" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <polygon points="130,42 200,77 200,163 130,198 60,163 60,77" class="accent-stroke" stroke-width="4" stroke-opacity="0.8"/>
                            <polygon points="130,48 192,80 192,160 130,192 68,160 68,80" class="accent-stroke" stroke-width="1" stroke-opacity="0.4"/>
                            <path d="M52,70 Q25,90 35,140 Q45,165 62,170" class="accent-stroke" stroke-width="5" stroke-linecap="round"/>
                            <path d="M42,85 C20,100 25,120 40,135" class="accent-stroke" stroke-width="3"/>
                            <path d="M48,60 L35,75" class="accent-stroke" stroke-width="4" stroke-linecap="round"/>
                            <path d="M208,70 Q235,90 225,140 Q215,165 198,170" class="accent-stroke" stroke-width="5" stroke-linecap="round"/>
                            <path d="M212,60 L225,75" class="accent-stroke" stroke-width="4" stroke-linecap="round"/>
                            <path d="M110,32 L130,18 L150,32 L130,26 Z" class="accent-fill"/>
                            <polygon points="130,218 134,226 143,226 136,231 139,240 130,234 121,240 124,231 117,226 126,226" class="accent-fill"/>
                        </svg>
                    </div>
                    <div class="rank-title" style="color: ${color};">${rank}</div>
                    <div class="player-name-tag">${name}</div>
                    <div class="player-status">READY</div>
                </div>
            `;
        }

        // --- LOBBY MANAGEMENT ---
        function renderLobby(roomId) {
            roomIdDisplay.textContent = `ROOM ID: #${roomId}`;
            playersShowcase.innerHTML = ''; // تفريغ اللوبي أولاً

            // 1. إضافة بطاقتك الخاصة أولاً كقائد للغرفة
            const myName = playerNameInput.value.trim() || "PLAYER";
            const myRank = rankSelect.value;
            const myCard = generatePlayerCardHTML(myName, myRank, myAvatarData);
            playersShowcase.innerHTML += myCard;

            // 2. محاكاة انضمام اللاعبين الآخرين بشكل سينمائي بجانبك بعد ثوانٍ قليلة
            mockPlayers.forEach((p, index) => {
                setTimeout(() => {
                    const otherCard = generatePlayerCardHTML(p.name, p.rank, p.avatar);
                    playersShowcase.innerHTML += otherCard;
                }, (index + 1) * 800); // يظهر كل لاعب بتأثير دخول زمني رائع
            });
        }

        // زر إنشاء الغرفة
        createRoomBtn.addEventListener('click', () => {
            const randomRoomId = Math.floor(1000 + Math.random() * 9000);
            phase2.classList.add('hidden');
            setTimeout(() => {
                phase3.classList.remove('hidden');
                renderLobby(randomRoomId);
            }, 500);
        });

        // زر الانضمام لغرفة
        joinRoomBtn.addEventListener('click', () => {
            const targetRoom = prompt("ENTER 4-DIGIT ROOM ID:", "4892");
            if (targetRoom && targetRoom.trim() !== "") {
                phase2.classList.add('hidden');
                setTimeout(() => {
                    phase3.classList.remove('hidden');
                    renderLobby(targetRoom);
                }, 500);
            }
        });

        // مغادرة اللوبي والعودة للقائمة
        leaveLobbyBtn.addEventListener('click', () => {
            phase3.classList.add('hidden');
            setTimeout(() => {
                phase2.classList.remove('hidden');
            }, 500);
        });
    </script>
</body>
</html>
