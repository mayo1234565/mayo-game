<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The 7 Infiltrators</title>
    <style>
        /* للحصول على نفس الخط، يجب تحميل خط عربي بنمط البكسل 
           (مثل خط 'LanaPixel' أو أي خط بكسل تجده مناسباً)
        */
        @font-face {
            font-family: 'PixelArabic';
            src: url('مسار_ملف_خط_البكسل_الخاص_بك.ttf'); 
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'PixelArabic', sans-serif; /* استخدام خط البكسل */
            color: white;
            overflow: hidden;
        }

        /* ---------------------------------- */
        /* السر هنا: منع ضبابية صور البكسل عند التكبير */
        /* ---------------------------------- */
        img, .pixel-bg {
            image-rendering: pixelated;
        }

        .background-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('صورة_السماء_والبحر.png'); 
            background-size: cover;
            background-repeat: repeat-x;
            animation: moveBackground 60s linear infinite;
            z-index: -2;
        }

        .ui-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            height: 100vh;
        }

        /* ---------------------------------- */
        /* تصميم الزر باستخدام صورتك المقصوصة */
        /* ---------------------------------- */
        .start-btn {
            /* ضع رابط صورة زر "ابدأ" الأحمر المقصوص هنا */
            background-image: url('صورة_الزر_الأحمر.png');
            background-size: 100% 100%; /* لملء المساحة بالصورة */
            background-color: transparent; /* إخفاء لون الخلفية الافتراضي */
            border: none; /* إزالة إطار المتصفح الافتراضي */
            width: 250px;
            height: 80px;
            color: white;
            font-size: 32px;
            font-family: 'PixelArabic', sans-serif;
            text-shadow: 2px 2px 0px #000; /* ظل للنص ليبرز */
            cursor: pointer;
            transition: transform 0.2s;
            image-rendering: pixelated; /* مهم جداً للـ Pixel Art */
        }

        .start-btn:hover {
            transform: scale(1.05); /* تكبير الزر قليلاً عند مرور الماوس */
            /* يمكنك هنا إضافة صورة لزر أحمر أفتح إذا أردت تأثيراً أقوى */
            /* background-image: url('صورة_الزر_الأحمر_المضيء.png'); */
        }

        .small-btn {
            background-image: url('صورة_الزر_الرصاصي.png');
            background-size: 100% 100%;
            background-color: transparent;
            border: none;
            width: 120px;
            height: 40px;
            color: #d1d1d1;
            font-family: 'PixelArabic', sans-serif;
            font-size: 18px;
            cursor: pointer;
            image-rendering: pixelated;
        }

        .small-btn:hover { color: white; }

        /* تصميم صندوق إدخال الاسم المعتمد على الصورة */
        .name-input {
            background-image: url('صورة_إطار_إدخال_الاسم.png');
            background-size: 100% 100%;
            background-color: transparent;
            border: none;
            color: white;
            padding: 10px;
            text-align: center;
            width: 280px;
            height: 40px;
            font-family: 'PixelArabic', sans-serif;
            outline: none;
        }

        @keyframes moveBackground {
            from { background-position: 0 0; }
            to { background-position: -2000px 0; }
        }
    </style>
</head>
<body>

    <div class="background-container pixel-bg"></div>

    <div class="ui-container">
        
        <img src="صورة_الشعار.png" alt="أساتميرامين 7" style="max-width: 400px;">

        <div style="text-align: center;">
            <button class="start-btn">ابدأ</button>
            <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: center;">
                <button class="small-btn">Options</button>
                <button class="small-btn">Quit</button>
            </div>
        </div>

        <div style="text-align: center;">
            <input type="text" class="name-input" placeholder="أدخل الاسم">
            </div>

    </div>

</body>
</html>
