<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic AAA Game Menu - With Custom Frames</title>
    <style>
        /* --- GLOBAL STYLES --- */
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #030305;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            color: #fff;
        }

        /* --- BACKGROUND ENVIRONMENT --- */
        #environment {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Animated Stars */
        .stars {
            position: absolute;
            width: 2px; height: 2px;
            background: transparent;
            box-shadow: 100px 200px #fff, 300px 500px #fff, 800px 100px #fff, 
                        1200px 400px #fff, 500px 800px #fff, 1500px 900px #fff, 
                        200px 900px #fff, 1000px 600px #fff, 1700px 200px #fff;
            animation: twinkle 4s infinite alternate;
        }
        .stars::after {
            content: " "; position: absolute; top: 2000px; left: 0;
            width: 2px; height: 2px; background: transparent;
            box-shadow: inherit;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); box-shadow: 100px 200px #fff, 300px 500px #fff, 800px 100px #fff, 1200px 400px #fff, 500px 800px #fff, 1500px 900px #fff, 200px 900px #fff, 1000px 600px #fff, 1700px 200px #fff, 0 0 10px #fff; }
        }

        /* Moving Planets */
        #planets {
            position: absolute;
            width: 100%; height: 100%;
            transition: opacity 2s ease-in-out;
        }
        .planet {
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
        }
        .planet-1 {
            width: 300px; height: 300px;
            background: radial-gradient(circle at 30% 30%, #2a2a35, #000);
            top: 10%; left: -100px;
            animation: float 20s infinite ease-in-out alternate;
        }
        .planet-2 {
            width: 150px; height: 150px;
            background: radial-gradient(circle at 70% 30%, #4a1515, #000);
            bottom: 20%; right: -50px;
            animation: float 25s infinite ease-in-out alternate-reverse;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(40px) rotate(10deg); }
        }

        /* --- SCREENS --- */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 1.5s ease, transform 1.5s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.05);
        }

        /* --- PHASE 1: START SCREEN --- */
        #start-btn {
            position: relative;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 3rem;
            font-family: inherit;
            font-weight: 700;
            letter-spacing: 15px;
            cursor: pointer;
            outline: none;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
            transition: text-shadow 0.3s ease, transform 0.3s ease;
        }

        #start-btn:hover {
            text-shadow: 0 0 20px #ff003c, 0 0 40px #ff003c;
            transform: scale(1.05);
        }

        .particle {
            position: absolute;
            background-color: #ff003c;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff003c, 0 0 15px #ff003c;
            pointer-events: none;
            animation: particle-fade 1s ease-out forwards;
        }

        @keyframes particle-fade {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
        }

        /* --- PHASE 2: LOBBY SCREEN --- */
        .lobby-ui {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            width: 100%;
            max-width: 800px;
        }

        /* Rank Hexagon Styling - WITH CUSTOM FRAMES */
        .hex-outer {
            /* تعديل الأبعاد لتتناسب مع حجم الإطارات الجديدة */
            width: 220px;
            height: 250px;
            
            /* إزالة clip-path القديم */
            /* clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); */
            
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.5s ease, filter 0.5s ease;
            position: relative;

            /* إعدادات الخلفية العامة للإطارات */
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        .hex-inner {
            /* تعديل الأبعاد والموضع ليتناسب مع مركز الإطار السداسي في الصورة الجديدة */
            width: 130px; 
            height: 150px;
            
            /* إزالة clip-path القديم */
            /* clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); */
            
            /* جعل الصورة سداسية بسيطة بدون حدود */
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            
            /* تموضع دقيق داخل hex-outer */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .hex-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.3s ease;
        }

        /* Rank Text Label below the frame */
        .rank-name-label {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 5px;
            margin-top: 10px;
            text-transform: uppercase;
            text-align: center;
            transition: color 0.5s ease, text-shadow 0.5s ease;
        }

        /* --- RANK SPECIFIC STYLES (IMAGES & GLOWS) --- */
        /* استبدل هذه المسارات بمسارات ملفات الصور الحقيقية التي قمت بإنشائها */

        .rank-bronze { 
            background-image: url('images/frames/bronze_frame.png'); 
            filter: drop-shadow(0 0 10px rgba(205, 127, 50, 0.5));
        }
        .rank-bronze + .rank-name-label { color: #cd7f32; text-shadow: 0 0 5px rgba(205, 127, 50, 0.5); }

        .rank-silver { 
            background-image: url('images/frames/silver_frame.png'); 
            filter: drop-shadow(0 0 10px rgba(229, 228, 226, 0.5));
        }
        .rank-silver + .rank-name-label { color: #e5e4e2; text-shadow: 0 0 5px rgba(229, 228, 226, 0.5); }

        .rank-gold { 
            background-image: url('images/frames/gold_frame.png'); 
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.7));
        }
        .rank-gold + .rank-name-label { color: #ffe600; text-shadow: 0 0 10px rgba(255, 215, 0, 0.7); }

        .rank-platinum { 
            background-image: url('images/frames/platinum_frame.png'); 
            filter: drop-shadow(0 0 15px rgba(180, 200, 200, 0.8));
        }
        .rank-platinum + .rank-name-label { color: #e5e4e2; text-shadow: 0 0 10px rgba(180, 200, 200, 0.8); }

        .rank-diamond { 
            background-image: url('images/frames/diamond_frame.png'); 
            filter: drop-shadow(0 0 20px rgba(185, 242, 255, 0.8));
        }
        .rank-diamond + .rank-name-label { color: #b9f2ff; text-shadow: 0 0 15px rgba(185, 242, 255, 0.8); }

        .rank-ruby { 
            background-image: url('images/frames/ruby_frame.png'); 
            filter: drop-shadow(0 0 25px rgba(255, 26, 74, 0.9));
        }
        .rank-ruby + .rank-name-label { color: #ff1a4a; text-shadow: 0 0 15px rgba(255, 26, 74, 0.9); }

        .rank-solar { 
            background-image: url('images/frames/solar_frame.png'); 
            filter: drop-shadow(0 0 30px rgba(255, 165, 0, 1));
        }
        .rank-solar + .rank-name-label { color: #ff4500; text-shadow: 0 0 20px rgba(255, 165, 0, 1); }

        /* Form Controls */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .glow-text {
            background: transparent;
            border: none;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 2px;
            outline: none;
            text-align: center;
            text-shadow: 0 0 5px rgba(255,255,255,0.3);
        }

        input[type="text"] {
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding: 10px;
            width: 300px;
            transition: border-color 0.3s, text-shadow 0.3s;
        }

        input[type="text"]:focus {
            border-bottom: 1px solid #fff;
            text-shadow: 0 0 10px #fff;
        }

        input[type="text"]::placeholder {
            color: rgba(255,255,255,0.3);
        }

        select {
            appearance: none;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding: 5px 20px;
            cursor: pointer;
        }
        select option {
            background: #050505;
            color: #fff;
        }

        .upload-lbl {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: color 0.3s, text-shadow 0.3s;
        }
        .upload-lbl:hover {
            color: #fff;
            text-shadow: 0 0 5px #fff;
        }

        /* Multiplayer Buttons */
        .multiplayer-btns {
            display: flex;
            gap: 40px;
            margin-top: 20px;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.6);
            font-family: 'Rajdhani', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 4px;
            cursor: pointer;
            position: relative;
            transition: color 0.3s, transform 0.3s;
        }

        .action-btn::after {
            content: '';
            position: absolute;
            width: 0%;
            height: 2px;
            background: #fff;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            transition: width 0.3s ease, background 0.3s;
            box-shadow: 0 0 10px #fff;
        }

        .action-btn:hover {
            color: #fff;
            transform: translateY(-2px);
            text-shadow: 0 0 15px #fff;
        }

        .action-btn:hover::after {
            width: 100%;
        }

        .action-btn.red-glow:hover {
            color: #ff003c;
            text-shadow: 0 0 15px #ff003c;
        }
        .action-btn.red-glow:hover::after {
            background: #ff003c;
            box-shadow: 0 0 10px #ff003c;
        }
    </style>
</head>
<body>

    <div id="environment">
        <div class="stars"></div>
        <div id="planets">
            <div class="planet planet-1"></div>
            <div class="planet planet-2"></div>
        </div>
    </div>

    <div id="phase1" class="screen">
        <button id="start-btn">START</button>
    </div>

    <div id="phase2" class="screen hidden">
        <div class="lobby-ui">
            
            <div class="controls">
                <div id="hex-border" class="hex-outer rank-bronze">
                    <div class="hex-inner">
                        <img id="profile-img" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="Profile">
                    </div>
                </div>
                
                <span id="rank-label" class="rank-name-label">BRONZE</span>

                <label for="upload-pic" class="upload-lbl">CLICK TO UPLOAD AVATAR</label>
                <input type="file" id="upload-pic" accept="image/*" hidden>

                <select id="rank-select" class="glow-text">
                    <option value="bronze">RANK: BRONZE</option>
                    <option value="silver">RANK: SILVER</option>
                    <option value="gold">RANK: GOLD</option>
                    <option value="platinum">RANK: PLATINUM</option>
                    <option value="diamond">RANK: DIAMOND</option>
                    <option value="ruby">RANK: RUBY</option>
                    <option value="solar">RANK: SOLAR</option>
                </select>

                <input type="text" id="player-name" class="glow-text" placeholder="ENTER PLAYER NAME" autocomplete="off">
            </div>

            <div class="multiplayer-btns">
                <button class="action-btn">JOIN ROOM</button>
                <button class="action-btn red-glow">CREATE ROOM</button>
            </div>

        </div>
    </div>

    <script>
        // DOM Elements
        const startBtn = document.getElementById('start-btn');
        const phase1 = document.getElementById('phase1');
        const phase2 = document.getElementById('phase2');
        const planets = document.getElementById('planets');
        const hexBorder = document.getElementById('hex-border');
        const rankSelect = document.getElementById('rank-select');
        const rankLabel = document.getElementById('rank-label'); // New element
        const uploadPic = document.getElementById('upload-pic');
        const profileImg = document.getElementById('profile-img');

        // Particle System for Start Button
        let particleInterval;

        function createParticles(e, burstCount = 1) {
            const rect = startBtn.getBoundingClientRect();
            const btnCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };

            for (let i = 0; i < burstCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random size
                const size = Math.random() * 4 + 2;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;

                // Starting position (scattered around button center)
                const startX = btnCenter.x + (Math.random() - 0.5) * rect.width;
                const startY = btnCenter.y + (Math.random() - 0.5) * rect.height;
                particle.style.left = `${startX}px`;
                particle.style.top = `${startY}px`;

                // Calculate random trajectory
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 100 + 50;
                const dx = Math.cos(angle) * velocity;
                const dy = Math.sin(angle) * velocity;

                // Pass variables to CSS animation
                particle.style.setProperty('--dx', `${dx}px`);
                particle.style.setProperty('--dy', `${dy}px`);

                document.body.appendChild(particle);

                // Cleanup particle after animation
                setTimeout(() => {
                    particle.remove();
                }, 1000);
            }
        }

        // Particle Hover Events
        startBtn.addEventListener('mouseenter', (e) => {
            createParticles(e, 5); // Initial burst
            particleInterval = setInterval(() => createParticles(e, 2), 100); // Continuous flow
        });

        startBtn.addEventListener('mouseleave', () => {
            clearInterval(particleInterval);
        });

        // Phase Transition Logic
        startBtn.addEventListener('click', (e) => {
            clearInterval(particleInterval);
            createParticles(e, 30); // Massive burst on click

            setTimeout(() => {
                phase1.classList.add('hidden');
                planets.style.opacity = '0'; // Fade out planets

                setTimeout(() => {
                    phase2.classList.remove('hidden');
                }, 800); // Wait for phase 1 to fade before showing phase 2
            }, 300);
        });

        // Lobby Logic: Profile Picture Upload
        uploadPic.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    profileImg.src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        // Lobby Logic: Rank Frame and Label Selection
        rankSelect.addEventListener('change', (e) => {
            const selectedRank = e.target.value;
            
            // 1. Update the Frame image (via CSS class)
            hexBorder.className = 'hex-outer'; // Reset to base classes
            hexBorder.classList.add(`rank-${selectedRank}`);
            
            // 2. Update the Text label
            rankLabel.textContent = selectedRank.toUpperCase();
        });

    </script>
</body>
</html>
