<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مين المختلف | Firebase Edition</title>
    
    <!-- مكتبات Firebase (الإصدار 8 المتوافق مع المتصفحات المباشرة) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- Tailwind & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ow-orange: #f99e1a;
            --dark-bg: #0f172a;
        }
        body {
            font-family: 'Cairo', sans-serif;
            /* خلفية احترافية ونظيفة جداً (تدرج لوني عميق بدون صور خارجية) */
            background: radial-gradient(circle at center, #1e293b 0%, #000000 100%);
            color: white;
            overflow: hidden;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        .ow-font { font-family: 'Oswald', sans-serif; }

        /* أزرار القائمة الرئيسية */
        .ow-menu-btn {
            font-size: 2.2rem;
            font-weight: 900;
            font-style: italic;
            color: white;
            cursor: pointer;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.9);
            transition: all 0.2s ease;
            text-align: right;
            background: transparent;
            border: none;
            outline: none;
            padding: 0;
            line-height: 1.3;
        }
        .ow-menu-btn:hover {
            color: var(--ow-orange);
            transform: translateX(-15px);
        }

        .floating-text {
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9), 0 0 10px rgba(0,0,0,0.6);
        }

        .hidden-screen { display: none !important; }
        
        /* إطارات الأفاتار للحيوانات (مبنية بالـ CSS لمنع أي خراب بالصور) */
        .avatar-select {
            font-size: 2.5rem;
            width: 70px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        .avatar-select:hover {
            transform: scale(1.1);
            background: rgba(249, 158, 26, 0.2);
        }
        .avatar-selected {
            border-color: var(--ow-orange) !important;
            transform: scale(1.1);
            background: rgba(249, 158, 26, 0.4);
            box-shadow: 0 0 15px var(--ow-orange);
        }

        .player-avatar-small {
            font-size: 1.8rem;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1e293b;
            border-radius: 50%;
            border: 2px solid white;
        }
    </style>
</head>
<body class="h-screen w-screen relative">

    <!-- 1. شاشة إنشاء الحساب -->
    <div id="screen-setup" class="h-full flex flex-col items-center justify-center relative z-10">
        <h1 class="text-4xl font-black text-white italic mb-8 floating-text">عرّف عن نفسك</h1>
        
        <div class="w-full max-w-xl flex flex-col items-center gap-8">
            <input type="text" id="input-name" class="w-1/2 p-3 bg-black bg-opacity-40 text-white text-xl font-bold text-center border-b-2 border-orange-400 outline-none floating-text rounded-t transition focus:bg-opacity-60" placeholder="اكتب اسمك هنا...">

            <!-- الأفاتار (حيوانات بـ Emojis مستحيل تخرب) -->
            <div class="text-center w-full">
                <h3 class="text-xl font-bold text-gray-300 mb-4 floating-text">اختر حيوانك المفضل:</h3>
                <div class="flex flex-wrap justify-center gap-4" id="avatar-container">
                    <div class="avatar-select" onclick="selectAvatar(this, '🐺')">🐺</div>
                    <div class="avatar-select" onclick="selectAvatar(this, '🦊')">🦊</div>
                    <div class="avatar-select" onclick="selectAvatar(this, '🐵')">🐵</div>
                    <div class="avatar-select" onclick="selectAvatar(this, '🐱')">🐱</div>
                    <div class="avatar-select" onclick="selectAvatar(this, '🐻')">🐻</div>
                    <div class="avatar-select" onclick="selectAvatar(this, '🐶')">🐶</div>
                </div>
            </div>

            <button onclick="saveProfile()" class="mt-4 text-3xl font-black italic text-orange-400 hover:text-white transition floating-text uppercase">
                دخول اللعبة ⮜
            </button>
        </div>
    </div>

    <!-- 2. القائمة الرئيسية -->
    <div id="screen-menu" class="hidden-screen h-full flex flex-col justify-center items-start pl-16 pr-16 z-10 relative">
        <h1 class="ow-font text-6xl italic font-black text-orange-400 mb-10 floating-text">مين المختلف؟</h1>
        <div class="flex flex-col gap-2 items-start">
            <button onclick="createRoom()" class="ow-menu-btn">إنشاء غرفة</button>
            <button onclick="joinRoomPrompt()" class="ow-menu-btn">الانضمام لغرفة</button>
        </div>
    </div>

    <!-- 3. غرفة الانتظار (Lobby) -->
    <div id="screen-lobby" class="hidden-screen h-full flex flex-col items-center justify-center relative z-10">
        <h2 class="text-4xl font-black italic text-white floating-text mb-2">غرفة الانتظار</h2>
        <h3 class="text-xl font-bold text-orange-400 floating-text mb-10">كود الغرفة: <span id="display-room-code" class="ow-font text-2xl text-white">----</span></h3>
        
        <!-- قائمة اللاعبين اللحظية من Firebase -->
        <div id="players-list" class="flex flex-col gap-4 w-full max-w-sm min-h-[200px] bg-black bg-opacity-30 p-6 rounded-xl border border-gray-700">
            <!-- سيتم إضافة اللاعبين هنا عن طريق الجافاسكربت -->
        </div>

        <button id="btn-start-game" onclick="startGame()" class="hidden mt-12 text-3xl font-black italic text-orange-400 hover:text-white transition floating-text uppercase">
            بدء اللعبة ⮜
        </button>
        <p id="wait-host-msg" class="mt-12 text-gray-400 text-lg font-bold">في انتظار الهوست لبدء اللعبة...</p>
    </div>

    <!-- 4. شاشة اللعب -->
    <div id="screen-game" class="hidden-screen h-full flex flex-col items-center justify-center relative z-40">
        <div class="absolute top-10 flex flex-col items-center floating-text">
            <span class="text-xl font-bold text-orange-400 mb-1">الوقت المتبقي</span>
            <span id="timer" class="ow-font text-6xl text-white font-black">60</span>
        </div>

        <div class="text-center mt-6">
            <h3 class="text-2xl font-bold text-gray-300 mb-4 floating-text" id="game-role-text">جاري توزيع الكلمات...</h3>
            <h1 class="text-6xl font-black text-orange-400 floating-text italic" id="game-word-text">--</h1>
            <p class="mt-6 text-xl font-bold text-gray-400 floating-text">تناقشوا الآن لمعرفة من يمتلك كلمة مختلفة!</p>
        </div>
    </div>

    <!-- السكريبت -->
    <script>
        // ==========================================
        // 1. إعدادات Firebase (يجب تغييرها ببياناتك)
        // ==========================================
        const firebaseConfig = {
            apiKey: "ضع_الـ_API_KEY_هنا",
            authDomain: "ضع_رابط_الدومين_هنا",
            databaseURL: "ضع_رابط_قاعدة_البيانات_هنا", // أهم شيء هذا الرابط
            projectId: "ضع_الـ_Project_ID_هنا",
            storageBucket: "ضع_الـ_Bucket_هنا",
            messagingSenderId: "ضع_الـ_Sender_ID_هنا",
            appId: "ضع_الـ_APP_ID_هنا"
        };

        // تهيئة Firebase (ستعمل إذا قمت بوضع بياناتك بالأعلى)
        try {
            firebase.initializeApp(firebaseConfig);
            var database = firebase.database();
            console.log("تم الاتصال بالفايربيس بنجاح!");
        } catch (error) {
            console.error("لم يتم إعداد Firebase بعد. اللعبة لن تعمل أونلاين حتى تضع بياناتك.", error);
        }

        // ==========================================
        // 2. متغيرات اللاعب واللعبة
        // ==========================================
        let player = { 
            id: 'player_' + Math.random().toString(36).substr(2, 9), // ID عشوائي فريد
            name: '', 
            avatar: '', 
            isHost: false 
        };
        let currentRoomCode = null;
        let roomRef = null;

        // ==========================================
        // 3. الواجهة واختيار الأفاتار
        // ==========================================
        function selectAvatar(element, emoji) {
            player.avatar = emoji;
            document.querySelectorAll('.avatar-select').forEach(el => el.classList.remove('avatar-selected'));
            element.classList.add('avatar-selected');
        }

        function saveProfile() {
            const nameInput = document.getElementById('input-name').value;
            if(!nameInput || !player.avatar) return alert('يا بطل، اكتب اسمك واختار حيوانك المفضل!');
            player.name = nameInput;
            showScreen('screen-menu');
        }

        function showScreen(screenId) {
            const screens = ['screen-setup', 'screen-menu', 'screen-lobby', 'screen-game'];
            screens.forEach(s => document.getElementById(s).classList.add('hidden-screen'));
            document.getElementById(screenId).classList.remove('hidden-screen');
        }

        // ==========================================
        // 4. إنشاء غرفة والانضمام (Firebase Logic)
        // ==========================================
        function createRoom() {
            if (!database) return alert("الرجاء إعداد Firebase أولاً في الكود!");
            
            // توليد كود من 4 أحرف/أرقام
            currentRoomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
            player.isHost = true;
            
            roomRef = database.ref('rooms/' + currentRoomCode);
            
            // إنشاء الغرفة في السيرفر
            roomRef.set({
                status: 'waiting',
                createdAt: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                // إضافة المضيف (أنت) للغرفة
                joinPlayerToFirebase();
                setupLobbyListener();
                
                document.getElementById('display-room-code').innerText = currentRoomCode;
                document.getElementById('btn-start-game').classList.remove('hidden');
                document.getElementById('wait-host-msg').classList.add('hidden');
                showScreen('screen-lobby');
            });
        }

        function joinRoomPrompt() {
            if (!database) return alert("الرجاء إعداد Firebase أولاً في الكود!");

            const code = prompt("أدخل كود الغرفة (4 أحرف/أرقام):");
            if (!code) return;
            
            currentRoomCode = code.toUpperCase();
            roomRef = database.ref('rooms/' + currentRoomCode);
            
            // التحقق من وجود الغرفة
            roomRef.once('value').then((snapshot) => {
                if (snapshot.exists() && snapshot.val().status === 'waiting') {
                    player.isHost = false;
                    joinPlayerToFirebase();
                    setupLobbyListener();
                    
                    document.getElementById('display-room-code').innerText = currentRoomCode;
                    document.getElementById('btn-start-game').classList.add('hidden');
                    document.getElementById('wait-host-msg').classList.remove('hidden');
                    showScreen('screen-lobby');
                } else {
                    alert("الغرفة غير موجودة أو اللعبة بدأت بالفعل!");
                }
            });
        }

        function joinPlayerToFirebase() {
            database.ref(`rooms/${currentRoomCode}/players/${player.id}`).set({
                name: player.name,
                avatar: player.avatar,
                isHost: player.isHost
            });

            // حذف اللاعب تلقائياً إذا خرج من المتصفح
            database.ref(`rooms/${currentRoomCode}/players/${player.id}`).onDisconnect().remove();
        }

        // ==========================================
        // 5. التحديث اللحظي للوبي والمزامنة
        // ==========================================
        function setupLobbyListener() {
            // تحديث قائمة اللاعبين
            database.ref(`rooms/${currentRoomCode}/players`).on('value', (snapshot) => {
                const playersListDiv = document.getElementById('players-list');
                playersListDiv.innerHTML = ''; // مسح القائمة الحالية
                
                if (snapshot.exists()) {
                    const playersData = snapshot.val();
                    Object.values(playersData).forEach(p => {
                        const isMe = p.name === player.name ? '(أنت)' : '';
                        const hostTag = p.isHost ? '<span class="mr-auto font-bold text-orange-400 text-sm">مضيف</span>' : '<span class="mr-auto font-bold text-green-400 text-sm">مستعد</span>';
                        
                        playersListDiv.innerHTML += `
                            <div class="flex items-center gap-4">
                                <div class="player-avatar-small">${p.avatar}</div>
                                <span class="font-black text-2xl floating-text text-white">${p.name} <span class="text-sm text-gray-400">${isMe}</span></span>
                                ${hostTag}
                            </div>
                        `;
                    });
                }
            });

            // الاستماع لبدء اللعبة
            database.ref(`rooms/${currentRoomCode}/status`).on('value', (snapshot) => {
                if (snapshot.exists() && snapshot.val() === 'playing') {
                    showScreen('screen-game');
                    startTimer();
                    // في الحقيقة هنا نحتاج دالة توزع الكلمات، للمحاكاة سنعرض كلمة ثابتة الآن
                    document.getElementById('game-word-text').innerText = "سيارة";
                }
            });
        }

        // ==========================================
        // 6. بدء اللعبة (للمضيف فقط)
        // ==========================================
        function startGame() {
            if (player.isHost && roomRef) {
                // تغيير حالة الغرفة في السيرفر ليتم نقل جميع اللاعبين شاشة اللعب
                roomRef.update({ status: 'playing' });
            }
        }

        let timerInterval;
        function startTimer() {
            let timeLeft = 60;
            document.getElementById('timer').innerText = timeLeft;
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("انتهى الوقت! انتقل للتصويت.");
                }
            }, 1000);
        }
    </script>
</body>
</html>
