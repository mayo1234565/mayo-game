<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الدب الضاحك والغاضب 🧸</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f4f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* فقاعة المحادثة */
        .speech-bubble {
            background: white;
            border: 4px solid #2b1d12;
            border-radius: 25px;
            padding: 15px 30px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            max-width: 450px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
            direction: rtl;
            z-index: 10;
        }

        .speech-bubble.angry {
            background: #ffe6e6;
            border-color: #dc143c;
            color: #dc143c;
            transform: scale(1.05) rotate(-1deg);
            animation: shake 0.3s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(2px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* حاوية اللعبة */
        .game-container {
            position: relative;
            width: 420px;
            height: 460px;
            cursor: pointer;
        }

        /* الدب الفروي المطور */
        .teddy {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* الأكتاف والجسم */
        .body-fur {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 350px;
            height: 220px;
            background: #a05a2c; /* بني دافئ فروي نفس الصورة */
            border-radius: 50% 50% 30% 30%;
            box-shadow: inset 0 -20px 30px rgba(0,0,0,0.2);
        }

        /* الأذنين */
        .ear {
            position: absolute;
            width: 90px;
            height: 90px;
            background: #a05a2c;
            border-radius: 50%;
            top: 25px;
        }
        .ear.left { left: 45px; }
        .ear.right { right: 45px; }
        .ear::after {
            content: '';
            position: absolute;
            width: 50px;
            height: 50px;
            background: #cca07a;
            border-radius: 50%;
            top: 20px;
            left: 20px;
        }

        /* رأس الدب الدائري */
        .head {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 310px;
            height: 270px;
            background: #a05a2c;
            border-radius: 50% 50% 48% 48%;
            z-index: 2;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        /* الشماغ/العصابة الزرقاء المنقوشة (نفس الصورة تماماً) */
        .keffiyeh-hat {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 316px;
            height: 95px;
            background: repeating-linear-gradient(45deg, #10629a, #10629a 8px, #052c4c 8px, #052c4c 16px);
            border-radius: 160px 160px 30px 30px;
            z-index: 5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* عيون خرزية سوداء لامعة */
        .eye {
            position: absolute;
            top: 115px;
            width: 20px;
            height: 20px;
            background: #050505;
            border-radius: 50%;
            z-index: 6;
            transition: all 0.15s ease;
        }
        .eye.left { left: 80px; }
        .eye.right { right: 80px; }
        .eye::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            top: 3px;
            left: 4px;
        }

        /* حواجب الغضب المخفية */
        .eyebrow {
            position: absolute;
            top: 95px;
            width: 35px;
            height: 7px;
            background: #2b1d12;
            z-index: 7;
            opacity: 0;
            transition: all 0.15s ease;
        }
        .eyebrow.left { left: 70px; }
        .eyebrow.right { right: 70px; }

        /* منطقة الخطم الدائرية (البيج الفاتح) */
        .muzzle {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 170px;
            height: 125px;
            background: #eadecc; /* لون بيج كريمي نفس خامة الصورة */
            border-radius: 50%;
            z-index: 6;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.05);
        }

        /* الأنف الشامواه الكبير */
        .nose {
            width: 75px;
            height: 50px;
            background: #54311c; /* بني غامق شمواه */
            border-radius: 50% 50% 45% 45%;
            margin-top: 15px;
            position: relative;
        }
        .nose::after {
            content: '';
            position: absolute;
            width: 3px;
            height: 25px;
            background: #2b1d12;
            bottom: -23px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* الفم الضاحك السعيد جداً (الافتراضي) */
        .mouth-container {
            width: 100px;
            height: 45px;
            position: relative;
            margin-top: 8px;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .mouth-happy {
            position: absolute;
            top: -30px;
            width: 100px;
            height: 70px;
            background: #802020; /* تجويف الفم */
            border: 4px solid #2b1d12;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        /* اللسان الضاحك */
        .tongue {
            width: 50px;
            height: 20px;
            background: #ff7373;
            border-radius: 20px 20px 0 0;
            margin-bottom: -2px;
        }

        /* يد السلام الـWaving */
        .hand-wave {
            position: absolute;
            right: 10px;
            top: 220px;
            width: 80px;
            height: 80px;
            background: #a05a2c;
            border-radius: 50%;
            z-index: 4;
            transform-origin: bottom center;
            animation: waveAction 1.2s infinite ease-in-out;
        }

        @keyframes waveAction {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(25deg); }
        }

        /* 🔫 المسدس التكتيكي المخفي */
        .gun-hand {
            position: absolute;
            left: -10px;
            bottom: 90px;
            width: 85px;
            height: 85px;
            background: #a05a2c;
            border-radius: 50%;
            z-index: 8;
            opacity: 0;
            transform: scale(0) rotate(45deg);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .pistol {
            position: absolute;
            top: -15px;
            left: -35px;
            width: 90px;
            height: 30px;
            background: #3a3d40;
            border-radius: 4px;
            transform: rotate(-10deg);
            box-shadow: -2px 4px 5px rgba(0,0,0,0.2);
        }
        .pistol::after {
            content: '';
            position: absolute;
            right: 8px;
            top: 25px;
            width: 28px;
            height: 48px;
            background: #1e2022;
            border-radius: 4px;
        }

        /* 😡 التحول لحالة الغضب العارم عند اللمس */
        .game-container.is-angry .eye {
            background: #ff0033;
            transform: scaleY(0.6);
            box-shadow: 0 0 10px #ff0033;
        }
        .game-container.is-angry .eye::after { display: none; }

        .game-container.is-angry .eyebrow.left { opacity: 1; transform: rotate(30deg); top: 102px; }
        .game-container.is-angry .eyebrow.right { opacity: 1; transform: rotate(-30deg); top: 102px; }

        /* تغيير الفم إلى خط عابس مشدود */
        .game-container.is-angry .mouth-container {
            height: 20px;
            margin-top: 15px;
        }
        .game-container.is-angry .mouth-happy {
            top: 10px;
            width: 80px;
            height: 40px;
            background: transparent;
            border: none;
            border-top: 5px solid #2b1d12;
            border-radius: 50%;
        }
        .game-container.is-angry .tongue { display: none; }

        /* إخفاء يد السلام وإظهار المسدس فوراً */
        .game-container.is-angry .hand-wave { display: none; }
        .game-container.is-angry .gun-hand {
            opacity: 1;
            transform: scale(1.3) rotate(0deg);
        }

        .footer-hint {
            margin-top: 15px;
            color: #7f8c8d;
            font-size: 15px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="speech-bubble" id="dialogue">مرحباً! أنا الدب المتكلم السعيد.. اضغط علي لنتحدث! هههههه 😂👋</div>

    <div class="game-container" id="bear-target">
        <div class="teddy">
            <div class="ear left"></div>
            <div class="ear right"></div>
            
            <div class="body-fur"></div>
            
            <div class="head">
                <div class="keffiyeh-hat"></div> <div class="eyebrow left"></div>
                <div class="eyebrow right"></div>
                <div class="eye left"></div>
                <div class="eye right"></div>
                
                <div class="muzzle">
                    <div class="nose"></div>
                    <div class="mouth-container">
                        <div class="mouth-happy">
                            <div class="tongue"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="hand-wave"></div>

            <div class="gun-hand">
                <div class="pistol"></div>
            </div>
        </div>
    </div>

    <div class="footer-hint">اضغط مع الاستمرار على الدب لتلمسه وتغضبه! 👆</div>

    <script>
        const bearTarget = document.getElementById('bear-target');
        const dialogueBox = document.getElementById('dialogue');

        const angryPhrases = [
            "لقد حذرتك!! الآن ستواجه العواقب!! 😡🔫",
            "ابتعد بيدك عن أنفي وإلا أطلقت النار! 🤬💥",
            "ألم أقل لك لا تلمسني؟! خذ هذه! 💀",
            "لا تختبر صبري أيها البشري! 🔫😤"
        ];

        // دالة التفعيل عند اللمس أو الضغط
        function triggerAngry() {
            bearTarget.classList.add('is-angry');
            dialogueBox.classList.add('angry');
            const randomText = angryPhrases[Math.floor(Math.random() * angryPhrases.length)];
            dialogueBox.innerText = randomText;
        }

        // دالة العودة للوضع الطبيعي الضاحك
        function triggerHappy() {
            if (bearTarget.classList.contains('is-angry')) {
                bearTarget.classList.remove('is-angry');
                dialogueBox.classList.remove('angry');
                dialogueBox.innerText = "مرحباً! أنا الدب المتكلم السعيد.. اضغط علي لنتحدث! هههههه 😂👋";
            }
        }

        // أحداث الماوس للكمبيوتر
        bearTarget.addEventListener('mousedown', triggerAngry);
        window.addEventListener('mouseup', triggerHappy);

        // أحداث اللمس للشاشات والجوالات
        bearTarget.addEventListener('touchstart', (e) => {
            e.preventDefault(); // منع التمرير المزعج أثناء اللعب
            triggerAngry();
        });
        window.addEventListener('touchend', triggerHappy);
    </script>
</body>
</html>
