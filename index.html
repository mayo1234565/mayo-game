<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة اللعبة الأسطورية | Overwatch Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Cairo:wght@600;800&display=swap" rel="stylesheet">
    
    <style>
        /* الإعدادات الأساسية للواجهة */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #120422; /* لون أساسي احتياطي */
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 🌌 الخلفية البنفسجية الفخمة والمتحركة */
        .epic-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: linear-gradient(45deg, #1a0b2e, #4b1d52, #290a42, #11051d);
            background-size: 400% 400%;
            animation: gradientMovement 12s ease infinite;
        }

        @keyframes gradientMovement {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* طبقة النجوم والجزيئات الواضحة */
        .particles-layer {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image: 
                radial-gradient(2px 2px at 40px 80px, #e2b3ff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 200px 300px, #fff, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 400px 150px, #ff9eff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 100px 500px, #b3d4ff, rgba(0,0,0,0));
            background-repeat: repeat;
            animation: spaceDrift 40s linear infinite;
            opacity: 0.6;
        }

        @keyframes spaceDrift {
            from { transform: rotate(0deg) translateY(0); }
            to { transform: rotate(360deg) translateY(-50px); }
        }

        /* 📱 حاوية اللعبة */
        .game-ui {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .hidden {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
            position: absolute;
        }

        /* 🔴 زر ابدأ الأسطوري مع الهالة الحمراء (Overwatch Style) */
        .btn-start {
            background: linear-gradient(90deg, #ff3b3b, #cc0000);
            color: #ffffff;
            font-family: 'Teko', sans-serif;
            font-size: 45px;
            text-transform: uppercase;
            padding: 10px 70px;
            border: none;
            cursor: pointer;
            position: relative;
            clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%); /* قصة الأطراف المائلة */
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.8);
            transition: transform 0.2s, box-shadow 0.2s;
            animation: redAuraPulse 2s infinite;
        }

        .btn-start:hover {
            transform: scale(1.05);
            background: linear-gradient(90deg, #ff5e5e, #e60000);
            box-shadow: 0 0 40px rgba(255, 50, 50, 1);
        }

        @keyframes redAuraPulse {
            0% { box-shadow: 0 0 20px rgba(255, 0, 0, 0.6); }
            50% { box-shadow: 0 0 40px rgba(255, 0, 0, 1); }
            100% { box-shadow: 0 0 20px rgba(255, 0, 0, 0.6); }
        }

        /* 🃏 بطاقة اللاعب (Player Card) مثل الصورة المرجعية */
        .player-card {
            background: rgba(10, 15, 30, 0.8);
            border: 2px solid #00f3ff;
            border-radius: 12px;
            padding: 30px 20px;
            width: 100%;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3), inset 0 0 20px rgba(0, 243, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(5px);
            margin-bottom: 25px;
        }

        /* منطقة دمج الأفتار مع الإطار (الاحترافية) */
        .portrait-container {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        /* الصورة تكون في الخلف ومقصوصة بشكل يناسب الإطار */
        .avatar-layer {
            position: absolute;
            width: 120px;
            height: 120px;
            background-color: #222;
            background-size: cover;
            background-position: center top;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); /* قص سداسي */
            z-index: 1;
            transition: background-image 0.3s ease;
        }

        /* الإطار يكون في الأمام تماماً وشفاف من المنتصف */
        .frame-layer {
            position: absolute;
            width: 250px;
            height: 250px;
            z-index: 2;
            background-image: url('ranks.webp'); /* اسم صورة الإطارات المجمعة */
            background-size: 700% 100%; /* لأن لديك 7 إطارات في الصورة */
            background-position: 0% 0%; /* يتغير برمجياً */
            pointer-events: none;
            transition: background-position 0.3s ease;
        }

        /* اسم اللاعب واللقب تحت الصورة */
        .player-name-input {
            background: transparent;
            border: none;
            color: #00f3ff;
            font-family: 'Teko', sans-serif;
            font-size: 38px;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 2px;
            outline: none;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.8);
            width: 90%;
            margin-top: 10px;
        }
        .player-name-input::placeholder { color: rgba(0, 243, 255, 0.3); }

        .player-title {
            color: #ffffff;
            font-family: 'Teko', sans-serif;
            font-size: 24px;
            letter-spacing: 4px;
            font-style: italic;
            opacity: 0.8;
        }

        /* 🎛️ واجهة التحكم الأنيقة (بدون إزعاج) */
        .controls-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            border-left: 4px solid #cc00ff; /* لمسة بليزارد */
            padding: 5px 10px;
        }

        .control-label {
            font-size: 15px;
            color: #d8c2ea;
            font-weight: bold;
            flex-grow: 1;
            text-align: right;
            padding-right: 15px;
        }

        .arrow-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
            padding: 5px 15px;
            transition: color 0.2s, transform 0.2s;
        }

        .arrow-btn:hover {
            color: #00f3ff;
            transform: scale(1.2);
        }

        .control-value {
            font-family: 'Teko', sans-serif;
            font-size: 22px;
            letter-spacing: 1px;
            min-width: 80px;
            text-align: center;
            color: #fff;
        }

    </style>
</head>
<body>

    <div class="epic-background"></div>
    <div class="particles-layer"></div>

    <div class="game-ui">

        <div id="startScreen" class="screen">
            <button class="btn-start" onclick="enterGame()">ابدأ</button>
        </div>

        <div id="setupScreen" class="screen hidden">
            
            <div class="player-card">
                <div class="portrait-container">
                    <div id="avatarLayer" class="avatar-layer"></div>
                    <div id="frameLayer" class="frame-layer"></div>
                </div>
                
                <input type="text" class="player-name-input" placeholder="أدخل اسمك..." maxlength="12">
                <div class="player-title">CHALLENGER</div>
            </div>

            <div class="controls-section">
                
                <div class="control-row">
                    <button class="arrow-btn" onclick="changeAvatar(1)">&#9654;</button>
                    <div class="control-value" id="avatarText">صورة 1</div>
                    <button class="arrow-btn" onclick="changeAvatar(-1)">&#9664;</button>
                    <div class="control-label">الـصـورة</div>
                </div>

                <div class="control-row" style="border-left-color: #00f3ff;">
                    <button class="arrow-btn" onclick="changeFrame(1)">&#9654;</button>
                    <div class="control-value" id="frameText">BRONZE</div>
                    <button class="arrow-btn" onclick="changeFrame(-1)">&#9664;</button>
                    <div class="control-label">الـرتـبـة</div>
                </div>

            </div>
        </div>

    </div>

    <script>
        // 🖼️ قائمة الصور (ضع روابط صور الأنمي هنا)
        const avatars = [
            "https://i.pinimg.com/736x/8f/c3/86/8fc3864197dc2b37bd358d10b7ee8719.jpg", // صورة أنمي 1
            "https://i.pinimg.com/736x/2b/43/b8/2b43b8110901e6ef67e2a9c375681729.jpg", // صورة أنمي 2
            "https://i.pinimg.com/736x/c8/10/a4/c810a42df6495db7b494dff9c2ff1b06.jpg"  // صورة أنمي 3
        ];

        // 🛡️ إعدادات الإطارات
        // الكود هنا يعتمد على صورة الإطارات المجمعة (ranks.webp) ويحركها بالنسبة المئوية 
        // 0% = برونز | 16.6% = فضي | 33.3% = ذهبي ... وهكذا
        const frames = [
            { name: "BRONZE", bgPos: "0%" },
            { name: "SILVER", bgPos: "16.66%" },
            { name: "GOLD", bgPos: "33.33%" },
            { name: "PLATINUM", bgPos: "50%" },
            { name: "DIAMOND", bgPos: "66.66%" },
            { name: "RUBY", bgPos: "83.33%" },
            { name: "SOLAR", bgPos: "100%" }
        ];

        let avatarIndex = 0;
        let frameIndex = 0;

        function enterGame() {
            document.getElementById('startScreen').classList.add('hidden');
            setTimeout(() => {
                document.getElementById('setupScreen').classList.remove('hidden');
            }, 300);
            updateUI();
        }

        function changeAvatar(dir) {
            avatarIndex += dir;
            if (avatarIndex >= avatars.length) avatarIndex = 0;
            if (avatarIndex < 0) avatarIndex = avatars.length - 1;
            updateUI();
        }

        function changeFrame(dir) {
            frameIndex += dir;
            if (frameIndex >= frames.length) frameIndex = 0;
            if (frameIndex < 0) frameIndex = frames.length - 1;
            updateUI();
        }

        function updateUI() {
            // تحديث الصورة الخلفية
            document.getElementById('avatarLayer').style.backgroundImage = `url('${avatars[avatarIndex]}')`;
            document.getElementById('avatarText').innerText = `صورة ${avatarIndex + 1}`;

            // تحديث الإطار الأمامي عبر تحريك (Sprite)
            const currentFrame = frames[frameIndex];
            document.getElementById('frameLayer').style.backgroundPosition = `${currentFrame.bgPos} 0%`;
            document.getElementById('frameText').innerText = currentFrame.name;
        }
    </script>
</body>
</html>
