<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة اللعبة | النسخة النهائية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #2b1b54;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 🌌 خلفية مستوحاة من Tricky Towers */
        .sky-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
            background: linear-gradient(180deg, #180b33 0%, #3e206d 50%, #683a9e 100%);
            overflow: hidden;
        }

        /* النجوم المتلألئة */
        .stars {
            position: absolute; top: 0; left: 0; width: 200%; height: 200%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 150px 250px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 300px 100px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 400px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            animation: twinkle 4s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* الغيوم المتحركة */
        .clouds-bg {
            position: absolute; bottom: 0; left: 0; width: 200%; height: 40%;
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 25" xmlns="http://www.w3.org/2000/svg"><path fill="%2324134d" d="M0 25 Q10 10 20 20 T40 10 T60 20 T80 5 T100 20 L100 25 Z"/></svg>');
            background-size: 50% 100%;
            background-repeat: repeat-x;
            animation: driftClouds 60s linear infinite;
            z-index: 2;
            opacity: 0.8;
        }

        .clouds-fg {
            position: absolute; bottom: -5%; left: 0; width: 200%; height: 35%;
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 25" xmlns="http://www.w3.org/2000/svg"><path fill="%23140a2e" d="M0 25 Q15 5 25 15 T50 10 T75 20 T100 10 L100 25 Z"/></svg>');
            background-size: 50% 100%;
            background-repeat: repeat-x;
            animation: driftClouds 40s linear infinite;
            z-index: 3;
        }

        @keyframes driftClouds {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        /* 📱 حاوية الواجهة */
        .ui-container {
            position: relative; z-index: 10; width: 100%; max-width: 400px;
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; padding: 20px;
        }

        .screen {
            width: 100%; display: flex; flex-direction: column; align-items: center;
            transition: all 0.4s ease-in-out;
        }

        .hidden { display: none !important; opacity: 0; transform: scale(0.95); }

        /* 🔘 زر البداية النظيف والزجاجي */
        .start-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; font-size: 32px; font-weight: 800;
            padding: 15px 80px; border-radius: 50px; cursor: pointer;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
        }
        .start-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #00f3ff;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            transform: translateY(-3px);
        }

        /* 🃏 بطاقة اللاعب والتخصيص */
        .profile-card {
            background: rgba(20, 10, 46, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 25px; width: 100%;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        /* منطقة الصورة والإطار القابلة للضغط */
        .avatar-wrapper {
            position: relative; width: 140px; height: 140px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: transform 0.2s;
            margin-bottom: 10px;
        }
        .avatar-wrapper:hover { transform: scale(1.05); }

        /* تلميح "اضغط للتغيير" */
        .click-hint {
            position: absolute; bottom: -15px; background: #00f3ff; color: #000;
            font-size: 11px; padding: 2px 10px; border-radius: 10px; font-weight: 800;
            z-index: 5; pointer-events: none; opacity: 0; transition: opacity 0.3s;
        }
        .avatar-wrapper:hover .click-hint { opacity: 1; }

        .avatar-img {
            width: 100px; height: 100px; border-radius: 15px;
            background-size: cover; background-position: center; z-index: 1;
        }

        .frame-img {
            position: absolute; width: 160px; height: 160px;
            background-size: contain; background-repeat: no-repeat;
            background-position: center; z-index: 2; pointer-events: none;
        }

        /* مدخل الاسم */
        .name-input {
            width: 100%; background: rgba(0,0,0,0.3); border: 2px solid #3e206d;
            color: #fff; font-size: 18px; text-align: center; padding: 12px;
            border-radius: 10px; outline: none; margin-bottom: 20px; transition: 0.3s;
        }
        .name-input:focus { border-color: #00f3ff; box-shadow: 0 0 15px rgba(0,243,255,0.3); }

        /* أزرار الغرف */
        .btn-group { display: flex; width: 100%; gap: 10px; }
        
        .room-btn {
            flex: 1; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; transition: 0.2s; border: none; color: #fff;
        }
        .btn-create {
            background: linear-gradient(135deg, #00f3ff, #007bb5);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }
        .btn-create:hover { filter: brightness(1.2); }
        
        .btn-join { background: #3e206d; border: 1px solid #683a9e; }
        .btn-join:hover { background: #4a2782; }

        /* 🗗 النافذة المنبثقة (Modal) لاختيار الصور والإطارات */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            z-index: 100; display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-content {
            background: #180b33; border: 2px solid #3e206d; border-radius: 15px;
            width: 90%; max-width: 350px; padding: 20px; display: flex; flex-direction: column;
            transform: translateY(20px); transition: transform 0.3s;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }

        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; font-size: 18px; border-bottom: 1px solid #3e206d; padding-bottom: 10px;
        }
        .close-btn { background: none; border: none; color: #ff3b3b; font-size: 24px; cursor: pointer; }

        /* شبكة الاختيار (Grid) */
        .selection-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            max-height: 300px; overflow-y: auto; padding-right: 5px;
        }

        .grid-item {
            width: 100%; aspect-ratio: 1; background-size: cover; background-position: center;
            border-radius: 10px; cursor: pointer; border: 2px solid transparent; transition: 0.2s;
        }
        .grid-item:hover { border-color: #00f3ff; transform: scale(1.05); }

        /* تصميم سكرول بار للشبكة */
        .selection-grid::-webkit-scrollbar { width: 5px; }
        .selection-grid::-webkit-scrollbar-thumb { background: #3e206d; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="sky-bg">
        <div class="stars"></div>
        <div class="clouds-bg"></div>
        <div class="clouds-fg"></div>
    </div>

    <div class="ui-container">
        
        <div id="startScreen" class="screen">
            <button class="start-btn" onclick="startGame()">ابــدأ</button>
        </div>

        <div id="setupScreen" class="screen hidden">
            <div class="profile-card">
                
                <div class="avatar-wrapper" onclick="openModal('avatar')">
                    <div id="currentAvatar" class="avatar-img"></div>
                    <div class="click-hint">اضغط لتغيير الصورة</div>
                </div>

                <div class="avatar-wrapper" onclick="openModal('frame')" style="position: absolute; pointer-events: auto; background: transparent; height: 160px; width: 160px;">
                     <div id="currentFrame" class="frame-img"></div>
                     <div class="click-hint" style="bottom: 0;">اضغط لتغيير الإطار</div>
                </div>

                <div style="height: 15px;"></div> <input type="text" id="playerName" class="name-input" placeholder="اكتب اسمك هنا..." maxlength="15">

                <div class="btn-group">
                    <button class="room-btn btn-create" onclick="createRoom()">إنشاء غرفة</button>
                    <button class="room-btn btn-join" onclick="joinRoom()">انضمام لغرفة</button>
                </div>

            </div>
        </div>
    </div>

    <div id="selectionModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle">اختر</span>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="gridContainer" class="selection-grid">
                </div>
        </div>
    </div>

    <script>
        // 🔗 روابط حية لصور أنمي فخمة (ستعمل معك فوراً)
        const avatars = [
            "https://i.pinimg.com/736x/8f/c3/86/8fc3864197dc2b37bd358d10b7ee8719.jpg",
            "https://i.pinimg.com/736x/2b/43/b8/2b43b8110901e6ef67e2a9c375681729.jpg",
            "https://i.pinimg.com/736x/c8/10/a4/c810a42df6495db7b494dff9c2ff1b06.jpg",
            "https://i.pinimg.com/736x/59/54/b4/5954b408c66525ad932faaeb9b8f0cc6.jpg",
            "https://i.pinimg.com/736x/2f/1b/38/2f1b38f8cf0265d953ccf40192e21b21.jpg",
            "https://i.pinimg.com/736x/a2/8d/b2/a28db2142289c09c2cc9d970e7960de2.jpg"
        ];

        // 🛡️ روابط حية لإطارات جاهزة شفافة (رتب الألعاب)
        const frames = [
            "https://cdn-icons-png.flaticon.com/512/7592/7592982.png", // مثال برونز
            "https://cdn-icons-png.flaticon.com/512/7592/7592985.png", // مثال فضي
            "https://cdn-icons-png.flaticon.com/512/7592/7592988.png", // مثال ذهبي
            "https://cdn-icons-png.flaticon.com/512/5482/5482613.png", // مثال بلاتيني
            "https://cdn-icons-png.flaticon.com/512/5482/5482607.png", // مثال دايموند
            "https://cdn-icons-png.flaticon.com/512/7593/7593005.png"  // مثال أسطوري
        ];

        let selectedAvatar = avatars[0];
        let selectedFrame = frames[2]; // الافتراضي ذهبي
        let currentModalType = '';

        // تطبيق الصور الافتراضية عند فتح الصفحة
        document.getElementById('currentAvatar').style.backgroundImage = `url('${selectedAvatar}')`;
        document.getElementById('currentFrame').style.backgroundImage = `url('${selectedFrame}')`;

        // دالة الضغط على ابدأ
        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            setTimeout(() => {
                document.getElementById('setupScreen').classList.remove('hidden');
            }, 300);
        }

        // دالة فتح نافذة الاختيار (تعرض الصور أو الإطارات في شبكة Grid)
        function openModal(type) {
            currentModalType = type;
            const grid = document.getElementById('gridContainer');
            grid.innerHTML = ''; // تفريغ الشبكة
            
            document.getElementById('modalTitle').innerText = type === 'avatar' ? 'اختر صورتك الشخصية' : 'اختر إطار الرتبة';

            const dataArray = type === 'avatar' ? avatars : frames;

            // تعبئة الشبكة بالصور
            dataArray.forEach(url => {
                const item = document.createElement('div');
                item.className = 'grid-item';
                item.style.backgroundImage = `url('${url}')`;
                if(type === 'frame') item.style.backgroundSize = 'contain'; // عشان الإطار ما ينقص
                
                // عند الضغط على الصورة في الشبكة
                item.onclick = () => selectItem(url);
                grid.appendChild(item);
            });

            document.getElementById('selectionModal').classList.add('active');
        }

        // إغلاق النافذة
        function closeModal() {
            document.getElementById('selectionModal').classList.remove('active');
        }

        // دالة اختيار العنصر وتطبيقه على الواجهة
        function selectItem(url) {
            if (currentModalType === 'avatar') {
                selectedAvatar = url;
                document.getElementById('currentAvatar').style.backgroundImage = `url('${selectedAvatar}')`;
            } else {
                selectedFrame = url;
                document.getElementById('currentFrame').style.backgroundImage = `url('${selectedFrame}')`;
            }
            closeModal();
        }

        // دوال أزرار الغرف
        function createRoom() {
            const name = document.getElementById('playerName').value;
            if(!name) return alert('الرجاء كتابة اسمك أولاً!');
            alert(`تم إنشاء الغرفة باسم: ${name} (هنا تبرمج انتقالك للسيرفر)`);
        }

        function joinRoom() {
            const name = document.getElementById('playerName').value;
            if(!name) return alert('الرجاء كتابة اسمك أولاً!');
            alert(`جاري البحث عن غرف للاعب: ${name} ...`);
        }
    </script>
</body>
</html>
