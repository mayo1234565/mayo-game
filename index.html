<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>المراهنة - Mayo Bet</title>
    <style>
        :root { --metal: #2d3436; --shine: #636e72; }
        body { background: #000; color: #fff; font-family: 'Cairo', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .game-screen { text-align: center; width: 100%; }
        h1 { color: #b2bec3; text-shadow: 0 0 10px #636e72; font-size: 3rem; letter-spacing: 5px; text-transform: uppercase; }
        
        .btn-main { 
            background: linear-gradient(145deg, #636e72, #2d3436); border: none; color: white; padding: 15px 40px;
            font-size: 1.5rem; cursor: pointer; margin: 10px; border-radius: 5px; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: 0.3s; z-index: 10; position: relative;
        }
        .btn-main:hover { transform: translateY(-5px); box-shadow: 0 8px 20px #636e72; }

        .table-3d { 
            width: 700px; height: 350px; margin: 50px auto; background: #1e272e;
            transform: perspective(800px) rotateX(45deg); display: flex; justify-content: space-around;
            padding: 20px; border: 5px solid #636e72; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        .bet-box { width: 180px; height: 100%; border: 3px dashed #636e72; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #b2bec3; }
        .player-avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid white; position: absolute; transition: 0.5s; }
    </style>
</head>
<body>

<div class="game-screen" id="menu">
    <h1>المراهنة</h1>
    <input type="text" id="name" placeholder="أدخل اسمك" style="padding:10px; font-size:1.2rem;">
    <br>
    <button class="btn-main" onclick="startGame()">بدء اللعبة</button>
</div>

<div class="game-screen hidden" id="arena" style="display:none;">
    <h2 id="msg">المقدم يجهز السؤال...</h2>
    <div class="table-3d">
        <div class="bet-box">مربع أ</div>
        <div class="bet-box">مربع ب</div>
        <div class="bet-box">مربع ج</div>
    </div>
    <div id="players-container"></div>
</div>

<script>
    function startGame() {
        let name = document.getElementById('name').value || "لاعب";
        document.getElementById('menu').style.display = 'none';
        document.getElementById('arena').style.display = 'block';
        
        createPlayer(name, 'white');
        createPlayer('Bot-1', 'red');
        createPlayer('Bot-2', 'gold');
        
        startBotLogic();
    }

    function createPlayer(name, color) {
        let p = document.createElement('div');
        p.className = 'player-avatar';
        p.style.background = color;
        p.style.left = Math.random() * 500 + 'px';
        p.style.top = '400px';
        document.body.appendChild(p);
    }

    function startBotLogic() {
        setInterval(() => {
            let bots = document.querySelectorAll('.player-avatar');
            bots.forEach(b => {
                if(b.style.background !== 'white') {
                    b.style.left = Math.random() * 600 + 50 + 'px';
                }
            });
            document.getElementById('msg').innerText = "السؤال: ما هي عاصمة السعودية؟";
        }, 2000);
    }
</script>

</body>
</html>
