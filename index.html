<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic AAA Game Menu</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- GLOBAL STYLES --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #020203; /* Deep space black */
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            color: #fff;
        }

        /* --- BACKGROUND ENVIRONMENT --- */
        #environment {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Animated Stars via CSS Box-Shadow */
        .stars {
            position: absolute;
            width: 2px; height: 2px;
            background: transparent;
            box-shadow: 100px 200px #fff, 300px 500px #fff, 800px 100px #fff, 
                        1200px 400px #fff, 500px 800px rgba(255,255,255,0.5), 1500px 900px #fff, 
                        200px 900px #fff, 1000px 600px #fff, 1700px 200px #fff,
                        400px 150px #fff, 900px 850px #fff, 1400px 300px rgba(255,255,255,0.3);
            animation: twinkle 5s infinite alternate;
        }
        
        .stars::after {
            content: " "; position: absolute; top: 10px; left: 10px;
            width: 1px; height: 1px; background: transparent;
            box-shadow: inherit;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.1); }
        }

        /* Moving Planets */
        #planets {
            position: absolute;
            width: 100%; height: 100%;
            transition: opacity 2.5s ease-in-out; /* Smooth fade away */
        }
        
        .planet {
            position: absolute;
            border-radius: 50%;
            filter: blur(1px);
        }
        
        .planet-1 {
            width: 40vw; height: 40vw;
            background: radial-gradient(circle at 30% 30%, #1a1a24, #000);
            top: -10%; left: -10%;
            animation: float-planet 40s infinite linear;
            box-shadow: inset -20px -20px 50px rgba(0,0,0,0.9), 0 0 100px rgba(255,255,255,0.05);
        }
        
        .planet-2 {
            width: 15vw; height: 15vw;
            background: radial-gradient(circle at 70% 30%, #2a0808, #000);
            bottom: 10%; right: 5%;
            animation: float-planet 30s infinite linear reverse;
            box-shadow: inset 10px 10px 30px rgba(0,0,0,0.8);
        }

        @keyframes float-planet {
            0% { transform: rotate(0deg) translate(0px) scale(1); }
            50% { transform: rotate(180deg) translate(20px) scale(1.02); }
            100% { transform: rotate(360deg) translate(0px) scale(1); }
        }

        /* --- UI LAYER & PHASES --- */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 1.5s cubic-bezier(0.25, 1, 0.5, 1), transform 1.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.05); /* Slight zoom out when fading */
        }

        /* Particles Overlay */
        #particle-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 5; /* Behind text, above background */
            pointer-events: none;
        }

        /* --- PHASE 1: START SCREEN --- */
        #start-btn {
            position: relative;
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.8);
            font-size: 3.5rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 20px;
            cursor: pointer;
            outline: none;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
            transition: color 0.3s ease, text-shadow 0.3s ease, transform 0.3s cubic-bezier(0.25, 1.5, 0.5, 1);
            z-index: 20;
        }

        #start-btn:hover {
            color: #fff;
            text-shadow: 0 0 20px #ff003c, 0 0 40px #ff003c, 0 0 80px rgba(255, 0, 60, 0.5);
            transform: scale(1.08);
        }

        /* --- PHASE 2: LOBBY SCREEN --- */
        .lobby-ui {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 50px;
            width: 100%;
            max-width: 800px;
            z-index: 20;
        }

        /* Avatar Layering System (As Requested) */
        .avatar-container {
            position: relative; /* CRITICAL: Establishes context for absolute children */
            width: 160px; 
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The base player image */
        .avatar-img {
            width: 120px; /* Slightly smaller than container to fit inside frame */
            height: 120px;
            object-fit: cover;
            /* Optional: Clip to a hexagon to match frame perfectly */
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.2));
            transition: filter 0.3s ease;
        }

        /* The detailed overlay frame */
        .rank-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180px; /* Extends past avatar to accommodate ornate edges/stars */
            height: 180px;
            pointer-events: none; /* CRITICAL: Allows clicking through to avatar if needed later */
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.6)); /* Adjust glow based on rank */
        }

        .avatar-container:hover .avatar-img {
            filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.5)) brightness(1.2);
        }

        /* Floating Input Field */
        .player-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 4px;
            text-align: center;
            padding: 10px 20px;
            width: 400px;
            outline: none;
            transition: border-color 0.3s ease, text-shadow 0.3s ease, box-shadow 0.3s ease;
            text-shadow: 0 0 5px rgba(255,255,255,0.2);
        }

        .player-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .player-input:focus {
            border-bottom: 1px solid #fff;
            text-shadow: 0 0 15px #fff;
            box-shadow: 0 5px 15px -10px #fff; /* Floating underline glow */
        }

        /* Multiplayer Buttons */
        .multiplayer-btns {
            display: flex;
            gap: 60px;
            margin-top: 20px;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 5px;
            cursor: pointer;
            position: relative;
            transition: color 0.3s ease, transform 0.3s ease;
            padding: 10px;
        }

        .action-btn::after {
            content: '';
            position: absolute;
            width: 0%;
            height: 2px;
            background: #fff;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1), background 0.3s, box-shadow 0.3s;
            box-shadow: 0 0 10px #fff;
        }

        .action-btn:hover {
            color: #fff;
            transform: translateY(-3px);
            text-shadow: 0 0 15px rgba(255,255,255,0.8);
        }

        .action-btn:hover::after {
            width: 100%;
        }

        /* Distinct Red Glow for Create Room (AAA UI emphasis) */
        .action-btn.red-glow:hover {
            color: #ff003c;
            text-shadow: 0 0 20px rgba(255, 0, 60, 0.8);
        }
        .action-btn.red-glow:hover::after {
            background: #ff003c;
            box-shadow: 0 0 15px #ff003c;
        }
    </style>
</head>
<body>

    <div id="environment">
        <div class="stars"></div>
        <div id="planets">
            <div class="planet planet-1"></div>
            <div class="planet planet-2"></div>
        </div>
    </div>

    <canvas id="particle-canvas"></canvas>

    <div id="phase1" class="screen">
        <button id="start-btn">START</button>
    </div>

    <div id="phase2" class="screen hidden">
        <div class="lobby-ui">
            
            <div class="avatar-container">
                <img src="https://via.placeholder.com/150/1a1a1a/ffffff?text=AVATAR" class="avatar-img" alt="Player Avatar">
                
                <img src="https://via.placeholder.com/180/00000000/ffd700?text=[Ornate+Frame+PNG]" class="rank-frame" alt="Rank Frame Border">
            </div>

            <input type="text" class="player-input" placeholder="ENTER CALLSIGN" autocomplete="off" spellcheck="false">

            <div class="multiplayer-btns">
                <button class="action-btn">JOIN MATCH</button>
                <button class="action-btn red-glow">CREATE LOBBY</button>
            </div>

        </div>
    </div>

    <script>
        // DOM Elements
        const startBtn = document.getElementById('start-btn');
        const phase1 = document.getElementById('phase1');
        const phase2 = document.getElementById('phase2');
        const planets = document.getElementById('planets');
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        // Canvas Setup for Fullscreen
        let width, height;
        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Canvas Particle System
        let particles = [];
        let isHovering = false;
        let btnRect = { x: 0, y: 0, w: 0, h: 0 };

        class Particle {
            constructor(x, y, isBurst = false) {
                this.x = x;
                this.y = y;
                
                // Random angle and speed
                const angle = Math.random() * Math.PI * 2;
                const speed = isBurst ? (Math.random() * 8 + 4) : (Math.random() * 2 + 0.5);
                
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                
                this.life = 1.0;
                this.decay = isBurst ? (Math.random() * 0.02 + 0.01) : (Math.random() * 0.03 + 0.02);
                
                // Red glowing particles
                this.size = Math.random() * 3 + 1;
                this.hue = 345 + Math.random() * 20; // Red to deep pink/crimson hues
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }

            draw() {
                if (this.life <= 0) return;
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                
                // Glowing effect
                ctx.shadowBlur = 15;
                ctx.shadowColor = `hsl(${this.hue}, 100%, 50%)`;
                ctx.fillStyle = `hsla(${this.hue}, 100%, 60%, ${this.life})`;
                
                ctx.fill();
                ctx.closePath();
            }
        }

        // Animation Loop
        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            
            // Continuous emission on hover
            if (isHovering && Math.random() > 0.3) {
                // Spawn randomly around the button boundaries
                const spawnX = btnRect.x + (Math.random() * btnRect.w);
                const spawnY = btnRect.y + (Math.random() * btnRect.h);
                particles.push(new Particle(spawnX, spawnY));
            }

            // Update and draw existing particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                
                // Remove dead particles
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
            
            // Reset shadow to avoid affecting other potential canvas drawings
            ctx.shadowBlur = 0; 

            requestAnimationFrame(animateParticles);
        }
        
        // Start animation loop
        animateParticles();

        // Button Event Listeners for Particles
        function updateBtnRect() {
            const rect = startBtn.getBoundingClientRect();
            btnRect = {
                x: rect.left,
                y: rect.top,
                w: rect.width,
                h: rect.height,
                cx: rect.left + rect.width / 2,
                cy: rect.top + rect.height / 2
            };
        }

        startBtn.addEventListener('mouseenter', () => {
            updateBtnRect();
            isHovering = true;
        });

        startBtn.addEventListener('mouseleave', () => {
            isHovering = false;
        });

        // Phase Transition Logic
        startBtn.addEventListener('click', () => {
            updateBtnRect();
            isHovering = false;
            
            // Massive particle burst
            for (let i = 0; i < 80; i++) {
                particles.push(new Particle(btnRect.cx, btnRect.cy, true));
            }

            // Fade out phase 1 and planets
            setTimeout(() => {
                phase1.classList.add('hidden');
                planets.style.opacity = '0'; // Cinematic fade away of background elements

                // Fade in phase 2
                setTimeout(() => {
                    phase2.classList.remove('hidden');
                }, 1000); // Wait for Phase 1 to cleanly exit
            }, 150); // Slight delay to let the click burst register visually
        });
    </script>
</body>
</html>
