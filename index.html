<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة اللعبة الاحترافية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Changa:wght@400;700&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #020202;
            color: white;
            font-family: 'Changa', sans-serif;
            overflow: hidden;
        }

        /* خلفية النجوم الهادئة */
        .stars-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat top center;
            z-index: 0;
            animation: moveStars 180s linear infinite; 
        }

        @keyframes moveStars {
            from { background-position: 0 0; }
            to { background-position: -2000px 1000px; }
        }

        /* الكوكب المتحرك ببطء */
        .planet {
            position: absolute;
            top: 20%;
            left: 15%;
            width: 140px;
            height: 140px;
            background: radial-gradient(circle at 30% 30%, #2c3e50, #000000);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(44, 62, 80, 0.4);
            z-index: 1;
            animation: rotatePlanet 100s linear infinite;
        }

        @keyframes rotatePlanet {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* الشاشات */
        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.6s ease;
        }

        #setup-screen {
            display: none;
            opacity: 0;
            flex-direction: column;
        }

        /* زر البداية بكسل */
        .start-btn {
            background-color: transparent;
            color: #fff;
            border: 4px solid #fff;
            padding: 15px 60px;
            font-size: 2.8rem;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 5px 5px 0px #e60039;
            text-shadow: 2px 2px 0px #e60039;
            transition: all 0.2s;
            z-index: 2;
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 7px 7px 0px #e60039;
        }

        /* واجهة الـ UI الاحترافية (بدون المربع الخلفي المزعج - خلفية شفافة وناعمة جداً) */
        .ps-panel {
            background: rgba(10, 10, 15, 0.6); /* شفافة جداً ومريحة للعين */
            border-radius: 24px;
            padding: 20px;
            width: 90%;
            max-width: 440px;
            text-align: center;
        }

        /* حاوية الأفاتار والإطار (أوفرواتش ستايل) */
        .avatar-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar-img {
            width: 110px;
            height: 110px;
            border-radius: 6px;
            object-fit: cover;
            z-index: 1;
            transition: 0.3s;
        }

        /* الإطار الديناميكي المربوط برابط ريديت المباشر */
        .frame-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 230px; 
            height: 230px;
            background-image: url('https://preview.redd.it/give-us-back-this-right-now-ranks-and-level-portraits-v0-t9ciyfkjjl5d1.png?width=1080&crop=smart&auto=webp&s=87204f0525d8869b2d07519ba2a3286377777d13');
            background-size: 730% auto; 
            /* الافتراضي: ياقوتي (Ruby) */
            background-position: 81.3% center; 
            mix-blend-mode: screen; 
            z-index: 2;
            pointer-events: none;
            transition: background-position 0.3s ease;
        }

        /* أزرار التحكم الفورية */
        .edit-btns {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .edit-btn {
            background: rgba(255,255,255,0.06);
            color: #b3b3b3;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Changa', sans-serif;
        }

        .edit-btn:hover {
            background: rgba(255,255,255,0.2);
            color: #fff;
        }

        /* لوحة اختيار الإطارات التفاعلية الخفية وتظهر عند الضغط */
        .frames-selector {
            display: none;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 12px;
        }

        .frame-option {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 5px 10px;
            font-size: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .frame-option:hover {
            border-color: #e60039;
            background: #e60039;
        }

        /* حقل الاسم الصافي بدون مربعات */
        .name-input {
            width: 75%;
            padding: 8px;
            margin-bottom: 30px;
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-family: 'Changa', sans-serif;
            font-size: 1.6rem;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        .name-input:focus {
            border-bottom: 2px solid #e60039; 
        }

        /* أزرار الغرف تحت */
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .action-btn {
            background: rgba(20, 20, 25, 0.6);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 14px 25px;
            font-size: 1.1rem;
            font-family: 'Changa', sans-serif;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
        }

        .action-btn:hover {
            background: #e60039;
            border-color: #e60039;
            box-shadow: 0 0 20px rgba(230, 0, 57, 0.6);
        }

        /* نافذة الغرفة المنبثقة المحترفة */
        .room-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 15, 25, 0.95);
            border: 2px solid #e60039;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            z-index: 100;
            box-shadow: 0 0 30px rgba(230, 0, 57, 0.4);
        }
    </style>
</head>
<body>

    <div class="stars-bg"></div>

    <div id="start-screen" class="screen">
        <div class="planet"></div>
        <button class="start-btn" onclick="goToSetup()">ابــــدأ</button>
    </div>

    <div id="setup-screen" class="screen">
        <div class="ps-panel">
            
            <div class="avatar-wrapper">
                <img id="avatar" src="https://i.pinimg.com/736x/21/df/b7/21dfb731dd5da68832c3cb16a49fa7e5.jpg" alt="Avatar" class="avatar-img">
                <div id="frame" class="frame-overlay"></div>
            </div>

            <div class="edit-btns">
                <button class="edit-btn" onclick="changeAvatar()">تغيير الصورة</button>
                <button class="edit-btn" onclick="toggleFrameSelector()">تغيير الإطار</button>
            </div>

            <div id="selector" class="frames-selector">
                <button class="frame-option" onclick="setFrame('bronze')">برونزي</button>
                <button class="frame-option" onclick="setFrame('silver')">فضي</button>
                <button class="frame-option" onclick="setFrame('gold')">ذهبي</button>
                <button class="frame-option" onclick="setFrame('ruby')">ياقوتي (الأحمر)</button>
            </div>

            <input type="text" class="name-input" placeholder="اسمك...">

            <div class="action-buttons">
                <button class="action-btn" onclick="showRoom()">إنشاء غرفة</button>
                <button class="action-btn" onclick="alert('جاري البحث عن غرف...')">انضمام لغرفة</button>
            </div>
        </div>
    </div>

    <div id="roomModal" class="room-modal">
        <h2>تم إنشاء الغرفة بنجاح! 🔥</h2>
        <p style="font-size: 1.5rem; color: #e60039; font-weight: bold;">كود الغرفة: <span id="roomCode">------</span></p>
        <p>انتظار دخول أخوياك...</p>
        <button class="edit-btn" onclick="closeRoom()">إغلاق</button>
    </div>

    <script>
        // التنقل بين الشاشات
        function goToSetup() {
            document.getElementById('start-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('setup-screen').style.display = 'flex';
                setTimeout(() => {
                    document.getElementById('setup-screen').style.opacity = '1';
                }, 50);
            }, 600);
        }

        // إظهار وإخفاء قائمة الإطارات
        function toggleFrameSelector() {
            const selector = document.getElementById('selector');
            selector.style.display = selector.style.display === 'flex' ? 'none' : 'flex';
        }

        // تغيير الإطار بشكل حي وفوري بالاعتماد على إحداثيات الصورة المرفوعة
        function setFrame(rank) {
            const frame = document.getElementById('frame');
            if (rank === 'bronze') {
                frame.style.backgroundPosition = "2.5% center";
            } else if (rank === 'silver') {
                frame.style.backgroundPosition = "18.3% center";
            } else if (rank === 'gold') {
                frame.style.backgroundPosition = "34.2% center";
            } else if (rank === 'ruby') {
                frame.style.backgroundPosition = "81.3% center";
            }
        }

        // تبديل فوري بين صورتين أنمي مظلم
        let currentAvatar = 1;
        function changeAvatar() {
            const avatar = document.getElementById('avatar');
            if (currentAvatar === 1) {
                avatar.src = "https://i.pinimg.com/736x/19/bf/02/19bf0283f5fb47b8559091629fa03328.jpg"; // صورة أنمي مظلم بديلة
                currentAvatar = 2;
            } else {
                avatar.src = "https://i.pinimg.com/736x/21/df/b7/21dfb731dd5da68832c3cb16a49fa7e5.jpg";
                currentAvatar = 1;
            }
        }

        // تشغيل نظام إنشاء الغرفة داخل اللعبة
        function showRoom() {
            const code = Math.floor(100000 + Math.random() * 900000);
            document.getElementById('roomCode').innerText = code;
            document.getElementById('roomModal').style.display = 'block';
        }

        function closeRoom() {
            document.getElementById('roomModal').style.display = 'none';
        }
    </script>

</body>
</html>
